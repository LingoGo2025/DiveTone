"zh-Hant":[["13. 補充條款、提供者與 Apple EULA",["本文件是 Apple Standard EULA 的補充使用條款與重要聲明，不取代 Standard EULA，也不是提交給 Apple 的自訂 EULA。若有衝突，適用法律、強制性消費者權利及 Apple 適用的授權條款優先。App／服務提供者是位於台灣的 DiveTone 開發者；聯絡信箱：{email}"]],["14. 示範素材授權",["除非素材旁另有書面授權，DiveTone 提供的示範照片與影片僅授予可撤銷、非專屬、不可轉讓的有限授權，供你評估與學習 DiveTone，並製作個人、非商業的測試輸出。不得重新散布原始素材、出售或再授權、宣稱擁有權，或未經書面允許用於商業用途。下載不移轉著作權或其他智慧財產權。"]],["15. Photos 編輯、恢復購買與語言",["經你確認的「覆蓋」使用 Photos 支援的非破壞性內容編輯；系統通常保留原始資源，並可在 Apple「照片」App 中還原。日期或位置等 Photos 資產屬性若經你確認修改，仍可能改變該相簿項目的顯示與排序。","恢復 DiveTone Pro 通常需要使用原購買所用的同一 Apple Account；實際購買資格、退款與 Family Sharing 由 Apple 決定。各語言版本旨在具有相同意義；如有明顯差異，以繁體中文與英文版本共同協助解釋，但你所在地的強制性法律及以當地語言取得資訊的權利不受影響。"]]],
"zh-Hans":[["13. 补充条款、提供者与 Apple EULA",["本文件是 Apple Standard EULA 的补充使用条款与重要声明，不取代 Standard EULA，也不是提交给 Apple 的自定义 EULA。若有冲突，适用法律、强制性消费者权利及 Apple 适用的许可条款优先。App／服务提供者是位于台湾的 DiveTone 开发者；联系邮箱：{email}"]],["14. 示例素材许可",["除非素材旁另有书面许可，DiveTone 提供的示例照片与视频仅授予可撤销、非独占、不可转让的有限许可，供你评估和学习 DiveTone，并制作个人、非商业测试输出。不得重新分发原始素材、出售或再许可、宣称所有权，或未经书面许可用于商业用途。下载不转移著作权或其他知识产权。"]],["15. Photos 编辑、恢复购买与语言",["经你确认的“覆盖”使用 Photos 支持的非破坏性内容编辑；系统通常保留原始资源，并可在 Apple“照片”App 中还原。经确认修改日期或位置等 Photos 资源属性，仍可能改变相册项目的显示与排序。","恢复 DiveTone Pro 通常需要使用原购买所用的同一 Apple Account；实际资格、退款和家庭共享由 Apple 决定。各语言版本旨在具有相同含义；如有明显差异，以繁体中文与英文共同协助解释，但所在地强制法律和当地语言信息权利不受影响。"]]],
en:[["13. Supplemental terms, provider, and Apple EULA",["This document is a set of supplemental terms and important notices under Apple's Standard EULA. It does not replace the Standard EULA and is not a Custom EULA submitted to Apple. If terms conflict, applicable law, mandatory consumer rights, and Apple's applicable licensing terms prevail. The app and service provider is the DiveTone developer located in Taiwan. Contact: {email}"]],["14. Sample-media license",["Unless a separate written license appears with an item, sample photos and videos made available by DiveTone carry only a revocable, non-exclusive, non-transferable limited license to evaluate and learn DiveTone and create personal, non-commercial test output. You may not redistribute the original samples, sell or sublicense them, claim ownership, or use them commercially without written permission. Downloading does not transfer copyright or other intellectual-property rights."]],["15. Photos edits, purchase restoration, and languages",["A confirmed “overwrite” uses the non-destructive content-editing mechanism supported by Photos. The system normally retains the original resource and allows restoration in Apple's Photos app. A confirmed change to Photos asset properties such as date or location may still change how that library item is shown and sorted.","Restoring DiveTone Pro normally requires the same Apple Account used for the original purchase; Apple determines actual eligibility, refunds, and Family Sharing. Language versions are intended to have the same meaning. If an apparent difference remains, the Traditional Chinese and English versions may be consulted together, without limiting mandatory local law or a right to receive information in a local language."]]],
ja:[["13. 補足条件、提供者、Apple EULA",["本書は Apple Standard EULA に基づく補足条件と重要事項であり、同 EULA を置き換えず、Apple へ提出する Custom EULA でもありません。矛盾時は適用法、強行的な消費者権利、Apple の適用ライセンス条件が優先します。提供者は台湾所在の DiveTone 開発者です。連絡先：{email}"]],["14. サンプル媒体のライセンス",["別途書面の表示がない限り、サンプル写真・動画は DiveTone の評価・学習と個人的かつ非商用のテスト出力のための、取消可能・非独占・譲渡不能の限定ライセンスです。原本の再配布、販売、再許諾、所有権の主張、無断商用利用は禁止します。ダウンロードで著作権等は移転しません。"]],["15. 写真の編集、購入復元、言語",["確認済みの「上書き」は「写真」の非破壊編集を使い、通常は原本を保持して Apple の写真 App から復元できます。ただし確認した日付・位置変更は表示や並び順を変える場合があります。Pro の復元には通常購入時と同じ Apple Account が必要で、資格、返金、Family Sharing は Apple が決定します。各言語は同義を意図し、差異時は繁体字中国語と英語を併せて参照しますが、現地の強行法は制限しません。"]]],
ko:[["13. 보충 약관, 제공자 및 Apple EULA",["본 문서는 Apple Standard EULA에 따른 보충 약관과 중요 고지이며 이를 대체하거나 Apple에 제출한 Custom EULA가 아닙니다. 충돌 시 적용 법률, 강행 소비자 권리 및 Apple의 적용 라이선스 조건이 우선합니다. 제공자는 대만의 DiveTone 개발자입니다. 연락처: {email}"]],["14. 샘플 미디어 라이선스",["별도 서면 라이선스가 없다면 샘플 사진·동영상은 DiveTone 평가·학습 및 개인적 비상업 테스트 출력만을 위한 취소 가능, 비독점, 양도 불가 제한 라이선스입니다. 원본 재배포, 판매, 재라이선스, 소유권 주장 또는 무단 상업 사용은 금지됩니다. 다운로드로 저작권 등이 이전되지 않습니다."]],["15. Photos 편집, 구매 복원 및 언어",["확인한 ‘덮어쓰기’는 Photos의 비파괴 편집을 사용하며 원본은 보통 유지되어 Apple Photos에서 복원할 수 있습니다. 확인한 날짜·위치 변경은 표시나 정렬을 바꿀 수 있습니다. Pro 복원에는 보통 구매한 동일 Apple Account가 필요하며 자격, 환불 및 가족 공유는 Apple이 결정합니다. 번역은 같은 의미를 목표로 하며 차이가 있으면 번체 중국어와 영어를 함께 참조하되 현지 강행법은 제한하지 않습니다."]]],
es:[["13. Condiciones suplementarias, proveedor y EULA",["Este documento contiene condiciones suplementarias y avisos bajo la EULA estándar de Apple; no la sustituye ni es una EULA personalizada enviada a Apple. En caso de conflicto prevalecen la ley aplicable, los derechos imperativos del consumidor y las licencias Apple aplicables. El proveedor es el desarrollador de DiveTone, ubicado en Taiwán. Contacto: {email}"]],["14. Licencia de medios de muestra",["Salvo licencia escrita separada, las muestras solo incluyen una licencia limitada, revocable, no exclusiva e intransferible para evaluar y aprender DiveTone y crear pruebas personales no comerciales. No puede redistribuir originales, venderlos, sublicenciarlos, atribuirse su propiedad ni usarlos comercialmente sin permiso. La descarga no transfiere derechos."]],["15. Ediciones en Fotos, restauración e idiomas",["“Sobrescribir” confirmado usa la edición no destructiva de Fotos; el original normalmente se conserva y puede restaurarse en Fotos de Apple. Cambios confirmados de fecha o ubicación pueden alterar presentación y orden. Restaurar Pro normalmente exige la misma cuenta Apple de compra; Apple decide elegibilidad, reembolsos y En familia. Las traducciones buscan el mismo sentido; ante diferencias pueden consultarse conjuntamente chino tradicional e inglés, sin limitar la ley local obligatoria."]]],
fr:[["13. Conditions complémentaires, fournisseur et EULA",["Ce document contient des conditions complémentaires et avis relevant de l’EULA standard Apple ; il ne la remplace pas et n’est pas une EULA personnalisée soumise à Apple. En cas de conflit, le droit applicable, les droits impératifs du consommateur et les licences Apple applicables prévalent. Le fournisseur est le développeur de DiveTone situé à Taïwan. Contact : {email}"]],["14. Licence des médias d’exemple",["Sauf licence écrite distincte, les exemples ne comportent qu’une licence limitée, révocable, non exclusive et incessible pour évaluer et apprendre DiveTone et créer des essais personnels non commerciaux. Interdiction de redistribuer les originaux, vendre, sous-licencier, revendiquer la propriété ou utiliser commercialement sans autorisation. Le téléchargement ne transfère aucun droit."]],["15. Retouches Photos, restauration et langues",["Un « écrasement » confirmé utilise la retouche non destructive de Photos ; l’original est normalement conservé et restaurable dans Photos Apple. Les changements confirmés de date ou lieu peuvent modifier affichage et tri. La restauration de Pro exige normalement le même compte Apple ; Apple décide l’éligibilité, les remboursements et le partage familial. Les traductions visent le même sens ; en cas d’écart, chinois traditionnel et anglais peuvent être consultés ensemble, sans limiter le droit local impératif."]]],
de:[["13. Ergänzende Bedingungen, Anbieter und EULA",["Dieses Dokument enthält ergänzende Bedingungen und Hinweise zur Apple Standard-EULA; es ersetzt sie nicht und ist keine bei Apple eingereichte Custom EULA. Bei Widerspruch gelten anwendbares Recht, zwingende Verbraucherrechte und Apples anwendbare Lizenzregeln vorrangig. Anbieter ist der in Taiwan ansässige DiveTone-Entwickler. Kontakt: {email}"]],["14. Lizenz für Beispielmedien",["Ohne gesonderte schriftliche Lizenz gilt nur eine widerrufliche, nicht exklusive, nicht übertragbare beschränkte Lizenz zur Bewertung und zum Erlernen von DiveTone sowie für persönliche, nicht kommerzielle Testausgaben. Originale dürfen nicht weitergegeben, verkauft, unterlizenziert, als eigenes Eigentum beansprucht oder ohne Erlaubnis kommerziell genutzt werden. Ein Download überträgt keine Rechte."]],["15. Fotos-Bearbeitung, Wiederherstellung und Sprachen",["Bestätigtes „Überschreiben“ nutzt die nichtdestruktive Fotos-Bearbeitung; das Original bleibt üblicherweise erhalten und kann in Apple Fotos wiederhergestellt werden. Bestätigte Datums-/Ortsänderungen können Anzeige und Sortierung ändern. Pro-Wiederherstellung verlangt üblicherweise denselben Apple Account; Apple entscheidet Anspruch, Erstattung und Familienfreigabe. Übersetzungen sollen gleichbedeutend sein; bei Abweichungen können traditionelles Chinesisch und Englisch gemeinsam herangezogen werden, ohne zwingendes Ortsrecht zu beschränken."]]],
it:[["13. Termini supplementari, fornitore ed EULA",["Questo documento contiene termini e avvisi supplementari rispetto all’EULA standard Apple; non la sostituisce e non è un’EULA personalizzata inviata ad Apple. In caso di conflitto prevalgono legge applicabile, diritti inderogabili e licenze Apple applicabili. Il fornitore è lo sviluppatore di DiveTone con sede a Taiwan. Contatto: {email}"]],["14. Licenza dei contenuti di esempio",["Salvo licenza scritta separata, gli esempi hanno solo licenza limitata, revocabile, non esclusiva e non trasferibile per valutare e imparare DiveTone e creare prove personali non commerciali. Non puoi ridistribuire gli originali, venderli, sublicenziarli, dichiararne la proprietà o usarli commercialmente senza permesso. Il download non trasferisce diritti."]],["15. Modifiche Foto, ripristino e lingue",["La “sovrascrittura” confermata usa la modifica non distruttiva di Foto; l’originale resta normalmente disponibile e ripristinabile in Foto di Apple. Cambi confermati a data o luogo possono cambiare visualizzazione e ordine. Il ripristino di Pro richiede normalmente lo stesso Apple Account; Apple decide idoneità, rimborsi e In famiglia. Le traduzioni mirano allo stesso significato; in caso di differenza si consultano insieme cinese tradizionale e inglese, senza limitare norme locali inderogabili."]]],
"pt-BR":[["13. Termos suplementares, provedor e EULA",["Este documento contém termos suplementares e avisos sob a EULA Padrão da Apple; não a substitui nem é uma EULA personalizada enviada à Apple. Em conflito, prevalecem lei aplicável, direitos obrigatórios e licenças Apple aplicáveis. O provedor é o desenvolvedor do DiveTone, localizado em Taiwan. Contato: {email}"]],["14. Licença da mídia de exemplo",["Sem licença escrita separada, as amostras têm apenas licença limitada, revogável, não exclusiva e intransferível para avaliar e aprender o DiveTone e criar testes pessoais não comerciais. Você não pode redistribuir originais, vender, sublicenciar, alegar propriedade ou usar comercialmente sem permissão. O download não transfere direitos."]],["15. Edições no Fotos, restauração e idiomas",["“Sobrescrever” confirmado usa edição não destrutiva do Fotos; o original normalmente permanece e pode ser restaurado no Fotos da Apple. Mudanças confirmadas de data ou local podem alterar exibição e ordem. Restaurar Pro normalmente exige a mesma Conta Apple; a Apple decide elegibilidade, reembolso e Compartilhamento Familiar. As traduções visam o mesmo sentido; em divergência, chinês tradicional e inglês podem ser consultados juntos, sem limitar lei local obrigatória."]]],
"pt-PT":[["13. Termos suplementares, fornecedor e EULA",["Este documento contém termos suplementares e avisos ao abrigo do EULA padrão Apple; não o substitui nem é um EULA personalizado enviado à Apple. Em conflito, prevalecem lei aplicável, direitos obrigatórios e licenças Apple aplicáveis. O fornecedor é o programador do DiveTone, localizado em Taiwan. Contacto: {email}"]],["14. Licença dos conteúdos de exemplo",["Sem licença escrita separada, os exemplos têm apenas licença limitada, revogável, não exclusiva e intransmissível para avaliar e aprender o DiveTone e criar testes pessoais não comerciais. Não pode redistribuir originais, vender, sublicenciar, alegar propriedade ou usar comercialmente sem autorização. A descarga não transfere direitos."]],["15. Edições em Fotografias, restauro e idiomas",["“Substituir” confirmado usa edição não destrutiva de Fotografias; o original costuma permanecer e pode ser restaurado na app Fotografias Apple. Mudanças confirmadas de data ou local podem alterar visualização e ordem. Restaurar Pro exige normalmente a mesma Conta Apple; a Apple decide elegibilidade, reembolso e Partilha com a família. As traduções procuram o mesmo sentido; em divergência, chinês tradicional e inglês podem ser consultados juntos, sem limitar lei local obrigatória."]]],
nl:[["13. Aanvullende voorwaarden, aanbieder en EULA",["Dit document bevat aanvullende voorwaarden en mededelingen onder Apples standaard-EULA; het vervangt die niet en is geen bij Apple ingediende Custom EULA. Bij strijd gaan toepasselijk recht, dwingende consumentenrechten en toepasselijke Apple-licenties voor. Aanbieder is de DiveTone-ontwikkelaar in Taiwan. Contact: {email}"]],["14. Licentie voor voorbeeldmedia",["Zonder aparte schriftelijke licentie geldt alleen een herroepelijke, niet-exclusieve, niet-overdraagbare beperkte licentie om DiveTone te beoordelen en leren en persoonlijke, niet-commerciële testuitvoer te maken. U mag originelen niet verspreiden, verkopen, sublicentiëren, als eigendom claimen of commercieel gebruiken zonder toestemming. Download draagt geen rechten over."]],["15. Foto's-bewerking, herstel en talen",["Bevestigd ‘overschrijven’ gebruikt niet-destructieve Foto's-bewerking; het origineel blijft normaal behouden en kan in Apple Foto's worden hersteld. Bevestigde datum-/locatiewijzigingen kunnen weergave en sortering veranderen. Pro herstellen vereist meestal dezelfde Apple Account; Apple bepaalt recht, terugbetaling en Delen met gezin. Vertalingen beogen dezelfde betekenis; bij verschil kunnen traditioneel Chinees en Engels samen worden geraadpleegd, zonder dwingend lokaal recht te beperken."]]],
th:[["13. ข้อกำหนดเสริม ผู้ให้บริการ และ EULA",["เอกสารนี้เป็นข้อกำหนดและประกาศเสริมภายใต้ EULA มาตรฐานของ Apple ไม่ได้แทนที่และไม่ใช่ Custom EULA ที่ส่งให้ Apple หากขัดกัน ให้กฎหมาย สิทธิผู้บริโภคที่บังคับใช้ และข้ออนุญาตของ Apple มีผลก่อน ผู้ให้บริการคือนักพัฒนา DiveTone ในไต้หวัน ติดต่อ: {email}"]],["14. ใบอนุญาตสื่อตัวอย่าง",["หากไม่มีใบอนุญาตเป็นลายลักษณ์อักษรแยกต่างหาก สื่อตัวอย่างให้เพียงสิทธิจำกัดที่เพิกถอนได้ ไม่ผูกขาด และโอนไม่ได้ เพื่อประเมินและเรียนรู้ DiveTone และทำผลงานทดสอบส่วนบุคคลที่ไม่ใช่เชิงพาณิชย์ ห้ามแจกจ่ายต้นฉบับ ขาย อนุญาตต่อ อ้างความเป็นเจ้าของ หรือใช้เชิงพาณิชย์โดยไม่ได้รับอนุญาต การดาวน์โหลดไม่โอนลิขสิทธิ์"]],["15. การแก้ไข Photos การกู้คืน และภาษา",["การยืนยัน “เขียนทับ” ใช้การแก้ไขแบบไม่ทำลายของ Photos โดยปกติต้นฉบับยังอยู่และคืนค่าได้ใน Photos ของ Apple การเปลี่ยนวันที่หรือตำแหน่งอาจเปลี่ยนการแสดงและเรียงลำดับ การกู้ Pro มักต้องใช้ Apple Account เดิม ส่วนสิทธิ คืนเงิน และ Family Sharing Apple เป็นผู้ตัดสิน การแปลมุ่งหมายให้เท่ากัน หากต่างให้ดูภาษาจีนตัวเต็มและอังกฤษร่วมกันโดยไม่จำกัดกฎหมายท้องถิ่น"]]],
id:[["13. Ketentuan tambahan, penyedia, dan EULA",["Dokumen ini adalah ketentuan dan pemberitahuan tambahan di bawah EULA Standar Apple; tidak menggantikannya dan bukan Custom EULA yang dikirim ke Apple. Jika bertentangan, hukum, hak konsumen wajib, dan lisensi Apple yang berlaku didahulukan. Penyedia adalah pengembang DiveTone di Taiwan. Kontak: {email}"]],["14. Lisensi media contoh",["Tanpa lisensi tertulis terpisah, contoh hanya memiliki lisensi terbatas yang dapat dicabut, non-eksklusif, dan tidak dapat dialihkan untuk mengevaluasi serta mempelajari DiveTone dan membuat hasil uji pribadi nonkomersial. Dilarang mendistribusikan ulang asli, menjual, mensublisensikan, mengaku memilikinya, atau memakai secara komersial tanpa izin. Unduhan tidak memindahkan hak."]],["15. Edit Photos, pemulihan, dan bahasa",["“Timpa” yang dikonfirmasi memakai edit nondestruktif Photos; asli biasanya tetap ada dan dapat dipulihkan di Photos Apple. Perubahan tanggal/lokasi dapat mengubah tampilan dan urutan. Pemulihan Pro biasanya memerlukan Apple Account yang sama; Apple menentukan kelayakan, refund, dan Family Sharing. Terjemahan dimaksudkan setara; jika berbeda, Tionghoa Tradisional dan Inggris dapat dibaca bersama tanpa membatasi hukum lokal wajib."]]],
ms:[["13. Terma tambahan, penyedia dan EULA",["Dokumen ini ialah terma dan notis tambahan di bawah EULA Standard Apple; ia tidak menggantikannya dan bukan Custom EULA yang dihantar kepada Apple. Jika bercanggah, undang-undang, hak pengguna wajib dan lesen Apple berkenaan mengatasi. Penyedia ialah pembangun DiveTone di Taiwan. Hubungi: {email}"]],["14. Lesen media contoh",["Tanpa lesen bertulis berasingan, contoh hanya diberi lesen terhad boleh ditarik balik, bukan eksklusif dan tidak boleh dipindah untuk menilai serta mempelajari DiveTone dan menghasilkan ujian peribadi bukan komersial. Jangan edar semula asal, jual, sublesen, dakwa pemilikan atau guna secara komersial tanpa izin. Muat turun tidak memindahkan hak."]],["15. Suntingan Photos, pemulihan dan bahasa",["“Tulis ganti” yang disahkan menggunakan suntingan tidak merosakkan Photos; asal biasanya kekal dan boleh dipulihkan dalam Photos Apple. Perubahan tarikh/lokasi boleh mengubah paparan dan susunan. Pemulihan Pro biasanya memerlukan Apple Account sama; Apple menentukan kelayakan, bayaran balik dan Family Sharing. Terjemahan dimaksudkan setara; jika berbeza, Cina Tradisional dan Inggeris boleh dirujuk bersama tanpa mengehadkan undang-undang tempatan wajib."]]],
fil:[["13. Supplemental terms, provider at EULA",["Ang dokumentong ito ay supplemental terms at notices sa ilalim ng Apple Standard EULA; hindi nito iyon pinapalitan at hindi ito Custom EULA na isinumite sa Apple. Kapag may conflict, mananaig ang batas, mandatory consumer rights at naaangkop na Apple license. Ang provider ay ang DiveTone developer sa Taiwan. Contact: {email}"]],["14. Lisensya sa sample media",["Kung walang hiwalay na written license, ang sample ay may revocable, non-exclusive, non-transferable limited license lamang para suriin at pag-aralan ang DiveTone at gumawa ng personal, non-commercial test output. Huwag ipamahagi muli ang original, ibenta, i-sublicense, angkinin, o gamitin sa komersyo nang walang pahintulot. Hindi inililipat ng download ang copyright."]],["15. Photos edit, restore at wika",["Ang kumpirmadong “overwrite” ay gumagamit ng non-destructive Photos edit; karaniwang nananatili ang original at nare-restore sa Apple Photos. Maaaring baguhin ng petsa/lokasyon ang display at sort. Karaniwang kailangan ang parehong Apple Account para ibalik ang Pro; Apple ang nagpapasya sa eligibility, refund at Family Sharing. Nilalayong pareho ang kahulugan ng salin; sa pagkakaiba, maaaring sabay tingnan ang Traditional Chinese at English nang hindi nililimitahan ang mandatory local law."]]],
vi:[["13. Điều khoản bổ sung, nhà cung cấp và EULA",["Đây là điều khoản và thông báo bổ sung theo EULA Tiêu chuẩn Apple; không thay thế EULA và không phải Custom EULA gửi cho Apple. Nếu xung đột, luật áp dụng, quyền người tiêu dùng bắt buộc và giấy phép Apple áp dụng được ưu tiên. Nhà cung cấp là nhà phát triển DiveTone tại Đài Loan. Liên hệ: {email}"]],["14. Giấy phép nội dung mẫu",["Nếu không có giấy phép riêng bằng văn bản, nội dung mẫu chỉ có giấy phép giới hạn, có thể thu hồi, không độc quyền và không chuyển nhượng để đánh giá, học DiveTone và tạo bản thử cá nhân phi thương mại. Không được phân phối lại bản gốc, bán, cấp phép lại, nhận là sở hữu hoặc dùng thương mại khi chưa được phép. Tải xuống không chuyển quyền."]],["15. Chỉnh sửa Photos, khôi phục và ngôn ngữ",["“Ghi đè” đã xác nhận dùng chỉnh sửa không phá hủy của Photos; bản gốc thường còn và có thể khôi phục trong Apple Photos. Thay đổi ngày/vị trí có thể đổi hiển thị và sắp xếp. Khôi phục Pro thường cần cùng Apple Account; Apple quyết định điều kiện, hoàn tiền và Family Sharing. Các bản dịch nhằm cùng nghĩa; nếu khác có thể xem chung Hoa phồn thể và Anh ngữ, không hạn chế luật địa phương bắt buộc."]]],
ar:[["13. شروط تكميلية والمزود وEULA",["هذه شروط وإشعارات تكميلية بموجب EULA القياسي من Apple، ولا تستبدله وليست Custom EULA مقدمة إلى Apple. عند التعارض يسود القانون وحقوق المستهلك الإلزامية وشروط ترخيص Apple المطبقة. المزود هو مطور DiveTone في تايوان. التواصل: {email}"]],["14. ترخيص الوسائط النموذجية",["ما لم يوجد ترخيص خطي منفصل، تمنح العينات ترخيصاً محدوداً قابلاً للإلغاء وغير حصري وغير قابل للنقل لتقييم DiveTone وتعلمه وإنشاء مخرجات اختبار شخصية غير تجارية. لا يجوز إعادة توزيع الأصل أو بيعه أو ترخيصه أو ادعاء ملكيته أو استعماله تجارياً بلا إذن. التنزيل لا ينقل الحقوق."]],["15. تعديلات Photos والاستعادة واللغات",["يستخدم «الاستبدال» المؤكد تحرير Photos غير المتلف؛ يبقى الأصل عادة ويمكن استعادته في Apple Photos. قد تغير تعديلات التاريخ أو الموقع العرض والترتيب. تتطلب استعادة Pro عادة Apple Account نفسه؛ وتحدد Apple الأهلية والاسترداد والمشاركة العائلية. تهدف الترجمات للمعنى نفسه؛ وعند اختلاف ظاهر يمكن الرجوع للصينية التقليدية والإنجليزية معاً دون تقييد القانون المحلي الإلزامي."]]],
tr:[["13. Ek koşullar, sağlayıcı ve EULA",["Bu belge Apple Standart EULA kapsamındaki ek koşul ve bildirimlerdir; EULA'nın yerini almaz ve Apple'a sunulmuş bir Custom EULA değildir. Çatışmada yasa, zorunlu tüketici hakları ve Apple'ın uygulanan lisans koşulları önceliklidir. Sağlayıcı Tayvan'daki DiveTone geliştiricisidir. İletişim: {email}"]],["14. Örnek medya lisansı",["Ayrı yazılı lisans yoksa örnekler yalnızca DiveTone'u değerlendirme ve öğrenme ve kişisel, ticari olmayan test çıktısı oluşturma amaçlı, geri alınabilir, münhasır olmayan, devredilemez sınırlı lisansa sahiptir. Orijinalleri dağıtamaz, satamaz, alt lisanslayamaz, sahiplenemez veya izinsiz ticari kullanamazsınız. İndirme hak devretmez."]],["15. Fotoğraflar düzenlemesi, geri yükleme ve diller",["Onaylanan “üzerine yazma” Fotoğraflar'ın tahribatsız düzenlemesini kullanır; orijinal genellikle kalır ve Apple Fotoğraflar'da geri alınabilir. Tarih/konum değişikliği görünüm ve sıralamayı etkileyebilir. Pro geri yükleme genellikle aynı Apple Account'u gerektirir; uygunluk, iade ve Aile Paylaşımı Apple'a bağlıdır. Çeviriler aynı anlamı amaçlar; farkta Geleneksel Çince ve İngilizce birlikte okunabilir, zorunlu yerel hukuk sınırlanmaz."]]],
el:[["13. Συμπληρωματικοί όροι, πάροχος και EULA",["Το έγγραφο περιέχει συμπληρωματικούς όρους και ειδοποιήσεις βάσει της Standard EULA της Apple· δεν την αντικαθιστά και δεν είναι Custom EULA που υποβλήθηκε στην Apple. Σε σύγκρουση υπερισχύουν νόμος, αναγκαστικά δικαιώματα και άδειες Apple. Πάροχος είναι ο προγραμματιστής DiveTone στην Ταϊβάν. Επικοινωνία: {email}"]],["14. Άδεια δειγμάτων",["Χωρίς ξεχωριστή γραπτή άδεια, τα δείγματα έχουν μόνο ανακλητή, μη αποκλειστική, μη μεταβιβάσιμη περιορισμένη άδεια για αξιολόγηση και εκμάθηση του DiveTone και προσωπικές μη εμπορικές δοκιμές. Απαγορεύεται αναδιανομή πρωτοτύπων, πώληση, υποαδειοδότηση, αξίωση κυριότητας ή εμπορική χρήση χωρίς άδεια. Η λήψη δεν μεταβιβάζει δικαιώματα."]],["15. Επεξεργασία Φωτογραφιών, επαναφορά και γλώσσες",["Η επιβεβαιωμένη «αντικατάσταση» χρησιμοποιεί μη καταστροφική επεξεργασία Φωτογραφιών· το πρωτότυπο συνήθως μένει και επαναφέρεται στο Apple Photos. Αλλαγές ημερομηνίας/θέσης μπορεί να αλλάξουν εμφάνιση και ταξινόμηση. Η επαναφορά Pro συνήθως απαιτεί το ίδιο Apple Account· η Apple κρίνει επιλεξιμότητα, επιστροφή και Family Sharing. Οι μεταφράσεις επιδιώκουν ίδιο νόημα· σε διαφορά συμβουλευτείτε παραδοσιακά κινεζικά και αγγλικά χωρίς περιορισμό αναγκαστικού τοπικού δικαίου."]]],
pl:[["13. Warunki uzupełniające, dostawca i EULA",["Niniejszy dokument zawiera warunki uzupełniające i informacje w ramach Standardowej EULA Apple; nie zastępuje jej i nie jest Custom EULA przesłaną Apple. W razie sprzeczności pierwszeństwo ma prawo, obowiązkowe prawa konsumenta i właściwe licencje Apple. Dostawcą jest deweloper DiveTone z Tajwanu. Kontakt: {email}"]],["14. Licencja materiałów przykładowych",["Bez osobnej pisemnej licencji próbki mają jedynie odwołalną, niewyłączną i nieprzenoszalną ograniczoną licencję do oceny i nauki DiveTone oraz osobistych, niekomercyjnych wyników testowych. Nie wolno rozpowszechniać oryginałów, sprzedawać, sublicencjonować, przypisywać sobie własności ani używać komercyjnie bez zgody. Pobranie nie przenosi praw."]],["15. Edycje Zdjęć, przywracanie i języki",["Potwierdzone „nadpisanie” używa niedestrukcyjnej edycji Zdjęć; oryginał zwykle pozostaje i można go przywrócić w Apple Photos. Zmiany daty/lokalizacji mogą zmienić widok i sortowanie. Przywracanie Pro zwykle wymaga tego samego Apple Account; Apple ustala uprawnienia, zwroty i Chmurę rodzinną. Tłumaczenia mają to samo znaczenie; przy różnicy można łącznie sprawdzić tradycyjny chiński i angielski, bez ograniczania bezwzględnego prawa lokalnego."]]],
ru:[["13. Дополнительные условия, поставщик и EULA",["Это дополнительные условия и уведомления в рамках Стандартного EULA Apple; они не заменяют его и не являются Custom EULA, поданным Apple. При противоречии преимущество имеют закон, обязательные права потребителей и применимые лицензии Apple. Поставщик — разработчик DiveTone на Тайване. Контакт: {email}"]],["14. Лицензия на примеры",["Без отдельной письменной лицензии примеры предоставляются только по отзывной, неисключительной, непередаваемой ограниченной лицензии для оценки и изучения DiveTone и личных некоммерческих тестовых результатов. Нельзя распространять оригиналы, продавать, сублицензировать, заявлять право собственности или коммерчески использовать без разрешения. Загрузка не передаёт прав."]],["15. Редактирование Фото, восстановление и языки",["Подтверждённая «перезапись» использует неразрушающее редактирование Фото; оригинал обычно сохраняется и восстанавливается в Apple Photos. Изменение даты/места может повлиять на отображение и сортировку. Восстановление Pro обычно требует тот же Apple Account; условия, возвраты и семейный доступ определяет Apple. Переводы имеют одинаковый смысл; при расхождении совместно используются традиционный китайский и английский без ограничения обязательного местного права."]]],
he:[["13. תנאים משלימים, ספק ו־EULA",["מסמך זה הוא תנאים והודעות משלימים במסגרת ה־EULA האחיד של Apple; הוא אינו מחליף אותו ואינו Custom EULA שהוגש ל־Apple. במקרה סתירה גוברים הדין, זכויות צרכן מחייבות ותנאי הרישיון החלים של Apple. הספק הוא מפתח DiveTone בטייוואן. קשר: {email}"]],["14. רישיון למדיה לדוגמה",["ללא רישיון נפרד בכתב, הדוגמאות ניתנות רק ברישיון מוגבל, ניתן לביטול, לא בלעדי ולא ניתן להעברה, להערכת DiveTone ולמידתו וליצירת פלט בדיקה אישי ולא מסחרי. אין להפיץ את המקור, למכור, לתת רישיון משנה, לטעון לבעלות או להשתמש מסחרית ללא אישור. ההורדה אינה מעבירה זכויות."]],["15. עריכות תמונות, שחזור ושפות",["״החלפה״ שאושרה משתמשת בעריכה הלא־הרסנית של תמונות; המקור נשמר בדרך כלל וניתן לשחזרו ב־Apple Photos. שינוי תאריך/מיקום עשוי לשנות תצוגה ומיון. שחזור Pro דורש בדרך כלל אותו Apple Account; Apple קובעת זכאות, החזר ושיתוף משפחתי. התרגומים נועדו לאותה משמעות; במקרה הבדל ניתן לעיין יחד בסינית מסורתית ובאנגלית, בלי להגביל דין מקומי מחייב."]]]

function bestLanguage(){const q=new URLSearchParams(location.search).get("lang");const candidates=[q,...(navigator.languages||[]),navigator.language].filter(Boolean);for(const c of candidates){if(T[c])return c;const base=c.split("-")[0];if(base==="zh")return c.toLowerCase().includes("hant")||/tw|hk|mo/i.test(c)?"zh-Hant":"zh-Hans";if(base==="pt")return /br/i.test(c)?"pt-BR":"pt-PT";if(T[base])return base}return"en"}
function legalText(x){return x.replace("{email}",`<a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a>`).replace("{eula}",`<a href="${APPLE_EULA}" target="_blank" rel="noopener">${APPLE_EULA}</a>`)}function renderSections(sections){return sections.map(([h,ps])=>`<section><h2>${h}</h2>${ps.map(x=>`<p>${legalText(x)}</p>`).join("")}</section>`).join("")}function render(lang){const d=T[lang]||T.en;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"||lang==="he"?"rtl":"ltr";document.title=d.title;document.getElementById("title").textContent=d.title;document.getElementById("updated").textContent=lastUpdated[lang]||lastUpdated.en;document.getElementById("languageLabel").textContent=d.label;document.getElementById("language").value=lang;document.getElementById("content").innerHTML=`<p class="muted">${d.intro}</p><p>${quotaNotes[lang]||quotaNotes.en}</p>`+renderSections(d.sections)+renderSections(termsAddenda[lang]||termsAddenda.en);localStorage.setItem("divetone-legal-language",lang);history.replaceState(null,"",`${location.pathname}?lang=${encodeURIComponent(lang)}`)}
for(const [code,name] of Object.entries(languages)){const o=document.createElement("option");o.value=code;o.textContent=name;document.getElementById("language").appendChild(o)}
document.getElementById("language").addEventListener("change",e=>render(e.target.value));if(CONTACT_EMAIL.startsWith("YOUR_"))document.getElementById("setupWarning").style.display="block";render(new URLSearchParams(location.search).has("lang")?bestLanguage():(T[localStorage.getItem("divetone-legal-language")]?localStorage.getItem("divetone-legal-language"):bestLanguage()));
</script>
