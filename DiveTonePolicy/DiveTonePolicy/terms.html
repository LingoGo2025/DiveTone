const T={
"zh-Hant":{title:"DiveTone 使用條款與重要聲明",updated:"生效日期：2026 年 8 月 9 日",label:"語言",intro:"下載、存取或使用 DiveTone，即表示你同意本條款及 Apple 適用的標準最終使用者授權協議。如果你不同意，請停止使用 App。",sections:[["1. 服務內容",["DiveTone 是離線優先的水下照片與影片輔助編輯工具，提供調色、主體偵測與手動標示、黑背景、裁切、浮水印、照片資訊、影片影格擷取及匯出等功能。功能可能因裝置、作業系統、媒體格式、相簿權限或版本而不同。","目前尚未提供的功能若在 App 中標示為準備中，不構成未來一定推出的承諾。"]],["2. 自動分析與編輯結果",["自動主體偵測、色彩校正及其他演算法可能因水色、能見度、遮擋、構圖與檔案內容而誤判。手動主體筆刷及預覽是輔助工具，不保證像素級完美。","黑背景可能產生邊緣光暈、透明區域或錯誤遮蔽。你應在匯出前檢查主體邊緣、色彩、裁切、metadata 與浮水印。DiveTone 不保證輸出符合特定審美、商業、競賽、科學或鑑識用途。"]],["3. 非潛水安全工具",["DiveTone 只用於影像編輯與整理，不提供潛水計畫、深度、氣體、減壓、導航、天候、醫療或緊急救援建議。請勿依賴 App 作出任何攸關生命或潛水安全的決定。"]],["4. 你的內容與責任",["你保有照片、影片及自製內容的權利。你聲明自己有權使用、編輯、加入攝影者或版權資訊、加上浮水印並分享或匯出這些內容。","你不得利用 DiveTone 侵害著作權、商標、肖像、隱私或其他權利，或製作、保存、分享違法及有害內容。你對輸入內容、編輯選擇、metadata 及輸出用途負責。"]],["5. 原始媒體、保存與備份",["DiveTone 採非破壞性專案設計，但部分操作可在你確認後寫回 Photos 資產或修改 Photos 中的拍攝日期。匯出與覆蓋前請確認選項。","App 不是備份服務。專案可能因媒體被刪除、相簿識別碼改變、裝置故障、系統清理、App 移除或軟體錯誤而無法恢復。請自行保留重要原始檔與成品備份。"]],["6. Metadata、GPS 與分享",["你可選擇保留或移除 EXIF、拍攝日期、攝影者及 GPS。完整保留可能在分享照片時揭露精確拍攝地點、時間、裝置或人員資訊；請在公開發布前檢查。","AirDrop、Files、Photos、Google Maps 及其他 App 或服務由其提供者管理，DiveTone 不控制其可用性、保存或後續使用。"]],["7. 免費額度與 DiveTone Pro",["免費版目前每日可成功匯出 15 張照片與 2 支影片，依裝置當地日期重設；實際可用功能與額度以 App 當時顯示為準。開發者可在合理通知後調整未來版本的免費方案，但不影響已依法完成的購買權利。","DiveTone Pro 是透過 Apple App Store 提供的非消耗型永久解鎖，不是訂閱。購買、付款、退款、家庭共享（如適用）、資格驗證及恢復購買由 Apple 規則處理。『永久』指該商品在相容且持續提供的 DiveTone 版本中的使用權，不保證 App、裝置或作業系統永久可用。"]],["8. 智慧財產權",["除你的內容外，DiveTone 的 App、名稱、介面、程式碼、演算法、圖示、文件及內附素材受智慧財產權保護。除法律或 Apple 授權條款明確允許外，不得複製、修改、散布、出租、出售、反向工程或建立衍生產品。"]],["9. 可用性、更新與終止",["App 以現況及可用狀態提供。開發者可為安全、相容性、法規、品質或營運需要修正、更新、暫停或停止功能。更新可能需要較新系統或硬體。","若你嚴重違反本條款，使用授權可能依法終止。你可隨時停止使用並移除 App。"]],["10. 保證與責任限制",["在適用法律允許的最大範圍內，DiveTone 不保證不中斷、無錯誤、所有格式皆相容、結果完全準確或資料永不遺失。你應先以非重要副本測試工作流程。","在法律允許範圍內，開發者不對間接、附帶、特殊或衍生損害，以及媒體、metadata、收益或機會損失負責。本條不排除因故意、重大過失、消費者保護法或其他不得排除事項所生的責任。"]],["11. 準據規則與消費者權利",["本條款與 Apple 標準 EULA 共同適用；若有衝突，以適用法律及 Apple 對 App Store 授權的強制規則為準。你慣常居住地的強制性消費者、隱私與數位內容權利不因本條款而被排除。","Apple 標準 EULA：{eula}"]],["12. 條款變更與聯絡",["功能或法律要求變更時，本條款可能更新。重大變更會透過 App、網站或版本說明告知，繼續使用更新版本即表示接受依法有效的新版條款。","聯絡信箱：{email}"]]]},
"zh-Hans":{title:"DiveTone 使用条款与重要声明",updated:"生效日期：2026 年 8 月 9 日",label:"语言",intro:"下载、访问或使用 DiveTone，即表示你同意本条款及 Apple 适用的标准最终用户许可协议。如不同意，请停止使用。",sections:[["1. 服务内容",["DiveTone 是离线优先的水下照片和视频辅助编辑工具，提供调色、主体检测和手动标记、黑背景、裁切、水印、媒体信息、视频帧提取及导出。功能可能因设备、系统、格式、权限或版本而异。","标为准备中的功能不构成未来一定推出的承诺。"]],["2. 自动分析与编辑结果",["自动主体检测、色彩校正和其他算法可能因水色、能见度、遮挡、构图及文件内容而误判。手动笔刷和预览不保证像素级完美。","黑背景可能出现边缘光晕、透明区域或错误遮挡。导出前请检查边缘、颜色、裁切、元数据和水印。DiveTone 不保证输出适合特定审美、商业、比赛、科学或鉴证用途。"]],["3. 非潜水安全工具",["DiveTone 仅用于影像编辑和整理，不提供潜水计划、深度、气体、减压、导航、天气、医疗或救援建议。请勿用它作出攸关生命或潜水安全的决定。"]],["4. 你的内容与责任",["你保留内容权利，并确认有权使用、编辑、写入摄影者或版权信息、添加水印、分享和导出。不得侵犯版权、商标、肖像、隐私或其他权利，也不得处理违法有害内容。你对输入、编辑、元数据和输出用途负责。"]],["5. 原始媒体、保存与备份",["DiveTone 采用非破坏性项目，但经你确认的部分操作可写回 Photos 资源或修改 Photos 拍摄日期。导出或覆盖前请确认。","App 不是备份服务。媒体删除、标识符变化、设备故障、系统清理、移除 App 或软件错误可能导致项目无法恢复。请自行备份重要内容。"]],["6. 元数据、GPS 与分享",["完整保留 EXIF、日期、摄影者和 GPS 可能在分享时泄露精确地点、时间、设备或人员信息，请在公开发布前检查。第三方分享服务由各提供者管理。"]],["7. 免费额度与 Pro",["免费版目前每日可成功导出 15 张照片和 2 个视频，依设备当地日期重置，以 App 实际显示为准。","Pro 是 Apple App Store 非消耗型永久解锁，不是订阅。购买、退款、验证和恢复由 Apple 处理。“永久”指在兼容且持续提供的 DiveTone 版本中的使用权，不保证 App、设备或系统永远可用。"]],["8. 知识产权",["除你的内容外，App、名称、界面、代码、算法、图标和文档受保护。除法律或 Apple 条款允许外，不得复制、修改、分发、出售或反向工程。"]],["9. 可用性与终止",["App 按现状提供。开发者可因安全、兼容、法律、质量或运营需要更新、暂停或停止功能。严重违反条款可能终止许可；你可随时移除 App。"]],["10. 保证与责任限制",["在法律允许范围内，不保证不中断、无错误、兼容所有格式、结果完全准确或数据永不丢失。请先用非重要副本测试。开发者不对间接或衍生损失负责，但不排除法律不得排除的责任。"]],["11. 适用规则与消费者权利",["本条款与 Apple 标准 EULA 共同适用。你惯常居住地的强制消费者、隐私及数字内容权利不受排除。","Apple 标准 EULA：{eula}"]],["12. 更新与联系",["重大变化会通过 App、网站或版本说明告知。","联系邮箱：{email}"]]]},
"en":{title:"DiveTone Terms of Use and Important Notices",updated:"Effective: August 9, 2026",label:"Language",intro:"By downloading, accessing, or using DiveTone, you agree to these terms and Apple's applicable Standard End User License Agreement. If you disagree, stop using the app.",sections:[["1. The service",["DiveTone is an offline-first assistant for underwater photo and video editing. Features include color correction, automatic subject detection and manual marking, black backgrounds, cropping, watermarks, media information, video-frame capture, and export. Availability can vary by device, operating system, format, permission, and version.","A feature marked as under development is not a promise that it will be released."]],["2. Automated analysis and output",["Automatic subject detection, color correction, and other algorithms can be wrong because of water color, visibility, occlusion, composition, or file content. Manual brushes and previews are aids and do not guarantee pixel-perfect boundaries.","Black-background output may contain halos, transparent areas, or incorrect masking. Before export, inspect subject edges, color, crop, metadata, and watermarks. DiveTone does not guarantee suitability for a particular aesthetic, commercial, competition, scientific, forensic, or evidentiary purpose."]],["3. Not a diving-safety tool",["DiveTone is only for media editing and organization. It does not provide dive planning, depth, gas, decompression, navigation, weather, medical, or emergency-rescue advice. Never rely on it for a life-critical or diving-safety decision."]],["4. Your content and responsibilities",["You retain rights in your photos, videos, and original content. You represent that you have authority to use, edit, add photographer or copyright fields, watermark, share, and export that content.","Do not use DiveTone to infringe copyright, trademark, publicity, privacy, or other rights, or to create, store, or share unlawful or harmful content. You are responsible for inputs, edits, metadata, and use of outputs."]],["5. Originals, storage, and backups",["DiveTone uses a non-destructive project design, but some actions can write back to a Photos asset or change its Photos capture date after you confirm. Review export and overwrite choices.","The app is not a backup service. Projects may become unavailable if media is deleted, identifiers change, a device fails, the system clears data, the app is removed, or software malfunctions. Keep independent backups of important originals and output."]],["6. Metadata, GPS, and sharing",["You can preserve or remove EXIF, dates, photographer fields, and GPS. Keeping full metadata can reveal exact capture location, time, device, or people when shared. Review it before public release.","AirDrop, Files, Photos, Google Maps, and other apps or services are controlled by their providers; DiveTone does not control their availability, retention, or later use."]],["7. Free quota and DiveTone Pro",["The free version currently allows 15 successful photo exports and 2 video exports per local device day. The app's current display controls actual availability. The developer may adjust a future free offering with reasonable notice without affecting rights from completed purchases.","DiveTone Pro is a non-consumable lifetime unlock sold through Apple's App Store, not a subscription. Apple handles purchase, payment, refund, Family Sharing if applicable, verification, and restoration. “Lifetime” means the right to use the product in compatible DiveTone versions that remain available; it does not promise that the app, a device, or an operating system will exist or remain compatible forever."]],["8. Intellectual property",["Except for your content, the app, name, interface, code, algorithms, icons, documentation, and included materials are protected. Except as allowed by law or Apple licensing terms, you may not copy, modify, distribute, rent, sell, reverse engineer, or create derivative products."]],["9. Availability, updates, and termination",["The app is provided “as is” and “as available.” Features may be fixed, updated, suspended, or discontinued for security, compatibility, legal, quality, or operational reasons. Updates may require newer software or hardware.","Your license may terminate as permitted by law for a material breach. You may stop using and remove the app at any time."]],["10. Warranties and liability",["To the maximum extent permitted by law, DiveTone does not warrant uninterrupted or error-free operation, compatibility with every format, perfect accuracy, or freedom from data loss. Test workflows on noncritical copies first.","To the extent legally permitted, the developer is not liable for indirect, incidental, special, or consequential loss, including loss of media, metadata, revenue, or opportunity. Nothing excludes liability for intent, gross negligence, mandatory consumer protection, or any matter that cannot legally be excluded."]],["11. Applicable terms and consumer rights",["These terms operate with Apple's Standard EULA. If they conflict, applicable law and mandatory Apple App Store licensing rules govern. Mandatory consumer, privacy, and digital-content rights in your habitual residence are not waived.","Apple Standard EULA: {eula}"]],["12. Changes and contact",["These terms may change with features or legal requirements. Material changes will be communicated in the app, website, or release notes. Continued use of an updated version means acceptance to the extent legally effective.","Contact: {email}"]]]},
"ja":{title:"DiveTone 利用規約および重要事項",updated:"施行日：2026年8月9日",label:"言語",intro:"DiveTone をダウンロードまたは使用すると、本規約と Apple の標準 EULA に同意したものとみなされます。同意しない場合は使用を中止してください。",sections:[["1. サービス",["DiveTone は水中写真・動画向けのオフライン優先編集支援です。色補正、被写体検出と手動指定、黒背景、切り抜き、透かし、情報表示、動画フレーム取得、書き出しを提供します。機能は端末、OS、形式、権限、版により異なります。","開発中と表示された機能の提供は保証されません。"]],["2. 自動解析と出力",["水色、視界、遮蔽、構図などにより被写体検出や補正は誤ることがあります。手動ブラシとプレビューも完全な境界を保証しません。黒背景にはハローや誤ったマスクが生じ得ます。書き出し前に境界、色、切り抜き、メタデータ、透かしを確認してください。特定の商用、競技、科学、鑑識用途への適合は保証しません。"]],["3. 潜水安全ツールではありません",["潜水計画、深度、ガス、減圧、航法、天候、医療、救助助言は提供しません。生命や潜水安全の判断に使用しないでください。"]],["4. コンテンツと責任",["あなたはコンテンツの権利を保持し、利用、編集、著作者情報、透かし、共有、書き出しの権限があることを表明します。著作権、商標、肖像、プライバシー等を侵害せず、入力、編集、メタデータ、出力利用に責任を負います。"]],["5. 原本、保存、バックアップ",["非破壊型ですが、確認後に Photos 資産への書き戻しや撮影日時変更を行う操作があります。App はバックアップではありません。媒体削除、故障、システム消去、App 削除等で復元不能になり得るため、重要な原本と成果を別途保存してください。"]],["6. メタデータと共有",["EXIF、日時、撮影者、GPS を保持すると、共有時に場所や個人情報が分かる場合があります。公開前に確認してください。外部サービスは各提供者が管理します。"]],["7. 無料枠と Pro",["無料版は現在、端末の現地日付ごとに写真15枚、動画2本の成功書き出しが可能です。実際は App 表示に従います。","Pro は Apple App Store の買い切り非消耗型商品で、購買、返金、検証、復元は Apple が扱います。「永久」は提供中かつ互換性のある DiveTone 版での利用権を意味し、App や OS の永続提供を保証しません。"]],["8. 知的財産",["あなたの内容を除く App、名称、UI、コード、アルゴリズム、アイコン、文書は保護されています。法令または Apple 規約で許される場合を除き、複製、販売、改変、逆解析等は禁止です。"]],["9. 提供と終了",["App は現状有姿で提供され、安全、互換性、法令、品質、運営上の理由で変更・停止される場合があります。重大な違反では利用許諾が終了し得ます。"]],["10. 保証と責任",["法令上許される限り、無停止、無誤り、全形式対応、完全な精度、データ無損失を保証しません。重要でない複製で試してください。間接・派生損害の責任は法令上許される範囲に限られ、消費者法等で排除不能な責任は排除しません。"]],["11. 適用条件と消費者権利",["Apple 標準 EULA と共に適用され、居住地の強行的な消費者・プライバシー権は放棄されません。","Apple 標準 EULA：{eula}"]],["12. 変更と連絡",["重要な変更は App、サイトまたはリリースノートで案内します。","連絡先：{email}"]]]},
"ko":{title:"DiveTone 이용 약관 및 중요 고지",updated:"시행일: 2026년 8월 9일",label:"언어",intro:"DiveTone을 다운로드하거나 사용하면 본 약관과 Apple 표준 EULA에 동의합니다. 동의하지 않으면 사용을 중단하세요.",sections:[["1. 서비스",["DiveTone은 수중 사진·동영상용 오프라인 우선 편집 도구로 색 보정, 피사체 자동 감지와 수동 표시, 검은 배경, 자르기, 워터마크, 정보, 프레임 캡처와 내보내기를 제공합니다. 기능은 기기, OS, 형식, 권한과 버전에 따라 다릅니다.","준비 중 기능은 출시 약속이 아닙니다."]],["2. 자동 분석과 결과",["물색, 시야, 가림, 구도 등에 따라 감지와 보정이 틀릴 수 있습니다. 브러시와 미리보기도 완벽한 경계를 보장하지 않습니다. 검은 배경에 후광이나 잘못된 마스크가 생길 수 있으므로 내보내기 전 경계, 색, 자르기, 메타데이터와 워터마크를 확인하세요. 특정 상업·대회·과학·감식 용도 적합성을 보장하지 않습니다."]],["3. 잠수 안전 도구 아님",["다이빙 계획, 수심, 가스, 감압, 항법, 날씨, 의료 또는 구조 조언을 제공하지 않습니다. 생명이나 안전 결정에 의존하지 마세요."]],["4. 콘텐츠와 책임",["콘텐츠 권리는 사용자에게 있으며 사용, 편집, 저작자 정보, 워터마크, 공유와 내보내기 권한이 있음을 확인합니다. 저작권, 상표, 초상권, 개인정보 등 타인의 권리를 침해하지 말아야 하며 입력과 출력 사용에 책임집니다."]],["5. 원본과 백업",["비파괴 프로젝트지만 확인 후 Photos 자산에 기록하거나 촬영일을 변경할 수 있습니다. 앱은 백업 서비스가 아니며 미디어 삭제, 기기 오류, 시스템 정리 또는 앱 제거로 복구하지 못할 수 있습니다. 중요한 원본과 결과를 별도 백업하세요."]],["6. 메타데이터와 공유",["EXIF, 날짜, 촬영자와 GPS를 유지하면 공유 시 정확한 위치나 개인정보가 노출될 수 있습니다. 공개 전 확인하세요. 외부 서비스는 해당 제공자가 관리합니다."]],["7. 무료 한도와 Pro",["무료판은 현재 기기 현지 날짜마다 사진 15장과 동영상 2개의 성공 내보내기를 허용하며 앱 표시가 우선합니다.","Pro는 Apple App Store의 비소모성 영구 잠금 해제이며 구독이 아닙니다. 구매, 환불, 검증과 복원은 Apple이 처리합니다. ‘영구’는 제공 중이고 호환되는 DiveTone 버전의 권리이며 앱이나 OS의 영구 제공을 뜻하지 않습니다."]],["8. 지식재산",["사용자 콘텐츠 외 앱, 이름, UI, 코드, 알고리즘, 아이콘과 문서는 보호됩니다. 법률 또는 Apple 조건이 허용하지 않는 복제, 판매, 수정, 역공학은 금지됩니다."]],["9. 제공과 종료",["앱은 현 상태로 제공되며 보안, 호환성, 법률, 품질 또는 운영상 이유로 변경·중단될 수 있습니다. 중대한 위반 시 라이선스가 종료될 수 있습니다."]],["10. 보증과 책임",["법이 허용하는 범위에서 무중단, 무오류, 모든 형식 호환, 완전한 정확성 또는 무손실을 보장하지 않습니다. 중요하지 않은 사본으로 시험하세요. 간접·결과적 손해 책임은 제한되지만 법률상 배제할 수 없는 책임은 제외되지 않습니다."]],["11. 적용 조건과 소비자 권리",["Apple 표준 EULA와 함께 적용되며 거주지의 강행 소비자·개인정보 권리는 포기되지 않습니다.","Apple 표준 EULA: {eula}"]],["12. 변경 및 연락",["중요 변경은 앱, 웹사이트 또는 릴리스 노트로 알립니다.","연락처: {email}"]]]},
"es":{title:"Términos de uso y avisos importantes de DiveTone",updated:"Vigente desde el 9 de agosto de 2026",label:"Idioma",intro:"Al descargar o usar DiveTone aceptas estos términos y el EULA estándar de Apple. Si no estás de acuerdo, deja de usar la app.",sections:[["1. Servicio",["DiveTone es un asistente de edición submarina prioritariamente sin conexión: corrección, detección y marcado de sujeto, fondo negro, recorte, marca de agua, información, captura de fotogramas y exportación. Las funciones varían por dispositivo, sistema, formato, permiso y versión.","Una función indicada como en desarrollo no promete su lanzamiento."]],["2. Análisis y resultados",["Los algoritmos pueden equivocarse por el color del agua, visibilidad, oclusión o composición. Pinceles y vistas previas no garantizan límites perfectos. El fondo negro puede producir halos o máscaras erróneas. Revisa bordes, color, recorte, metadatos y marcas antes de exportar. No garantizamos adecuación estética, comercial, competitiva, científica o forense."]],["3. No es una herramienta de seguridad",["No ofrece planificación de inmersiones, profundidad, gases, descompresión, navegación, meteorología, medicina ni rescate. No la uses para decisiones vitales o de seguridad de buceo."]],["4. Tu contenido",["Conservas tus derechos y confirmas tener autorización para usar, editar, identificar autoría, añadir marcas, compartir y exportar. No infrinjas derechos de autor, marcas, imagen, privacidad u otras leyes. Eres responsable de entradas, ediciones, metadatos y resultados."]],["5. Originales y copias",["El diseño es no destructivo, pero ciertas acciones confirmadas pueden escribir en Photos o cambiar la fecha. No es un servicio de copia de seguridad. Borrado de medios, fallos, limpieza del sistema o desinstalación pueden impedir recuperar proyectos. Conserva copias independientes."]],["6. Metadatos y servicios externos",["Conservar EXIF, fechas, fotógrafo y GPS puede revelar ubicación, tiempo, dispositivo o personas al compartir. Revísalo. Los servicios externos son gestionados por sus proveedores."]],["7. Cuota gratuita y Pro",["Actualmente la versión gratuita permite 15 fotos y 2 vídeos exportados correctamente por día local; prevalece lo mostrado en la app.","Pro es un desbloqueo perpetuo no consumible de Apple App Store, no una suscripción. Apple gestiona compra, reembolso, verificación y restauración. “Perpetuo” significa el derecho en versiones compatibles de DiveTone disponibles, no la existencia eterna de la app, dispositivo o sistema."]],["8. Propiedad intelectual",["Salvo tu contenido, la app, nombre, interfaz, código, algoritmos, iconos y documentos están protegidos. Se prohíbe copiar, vender, modificar o aplicar ingeniería inversa salvo autorización legal o de Apple."]],["9. Disponibilidad",["Se ofrece tal cual y puede modificarse o interrumpirse por seguridad, compatibilidad, ley, calidad u operación. Una infracción grave puede terminar la licencia."]],["10. Garantías y responsabilidad",["En lo permitido por ley, no se garantiza ausencia de errores, compatibilidad total, exactitud perfecta o ausencia de pérdidas. Prueba con copias no críticas. Se limita la responsabilidad por daños indirectos, sin excluir derechos o responsabilidades legalmente irrenunciables."]],["11. Normas y derechos del consumidor",["Se aplica junto con el EULA estándar de Apple. No renuncias a derechos obligatorios de consumo, privacidad o contenido digital de tu residencia.","EULA estándar de Apple: {eula}"]],["12. Cambios y contacto",["Los cambios importantes se comunicarán en la app, web o notas de versión.","Contacto: {email}"]]]},
"fr":{title:"Conditions d’utilisation et avis importants de DiveTone",updated:"En vigueur le 9 août 2026",label:"Langue",intro:"En téléchargeant ou utilisant DiveTone, vous acceptez ces conditions et le contrat standard Apple. Sinon, cessez d’utiliser l’app.",sections:[["1. Service",["DiveTone est un assistant hors ligne pour l’édition sous-marine : correction, détection et marquage du sujet, fond noir, recadrage, filigrane, informations, capture d’images vidéo et export. Les fonctions varient selon appareil, système, format, autorisation et version.","Une fonction annoncée en préparation ne garantit pas sa sortie."]],["2. Analyse et résultats",["Les algorithmes peuvent se tromper selon l’eau, la visibilité, l’occlusion ou la composition. Brosses et aperçus ne garantissent pas des contours parfaits. Le fond noir peut créer halos ou masques erronés. Vérifiez contours, couleur, recadrage, métadonnées et filigranes. Aucune aptitude particulière esthétique, commerciale, scientifique, de concours ou judiciaire n’est garantie."]],["3. Aucun outil de sécurité plongée",["L’app ne fournit aucun conseil de planification, profondeur, gaz, décompression, navigation, météo, médical ou secours. Ne l’utilisez jamais pour une décision vitale ou de sécurité."]],["4. Votre contenu",["Vous conservez vos droits et confirmez être autorisé à utiliser, modifier, créditer, filigraner, partager et exporter. N’enfreignez pas droits d’auteur, marques, image, vie privée ou lois. Vous êtes responsable des entrées, modifications, métadonnées et sorties."]],["5. Originaux et sauvegarde",["Le projet est non destructif, mais certaines actions confirmées peuvent écrire dans Photos ou changer la date. Ce n’est pas un service de sauvegarde. Suppression, panne, nettoyage système ou désinstallation peuvent rendre un projet irrécupérable. Gardez des copies indépendantes."]],["6. Métadonnées et services externes",["Conserver EXIF, date, photographe et GPS peut révéler lieu, heure, appareil ou personnes lors du partage. Vérifiez avant publication. Les services externes relèvent de leurs fournisseurs."]],["7. Quota gratuit et Pro",["La version gratuite permet actuellement 15 photos et 2 vidéos exportées avec succès par jour local ; l’affichage de l’app prévaut.","Pro est un achat non consommable à vie via l’App Store, non un abonnement. Apple gère achat, remboursement, vérification et restauration. « À vie » désigne le droit dans les versions compatibles et disponibles, sans garantie de disponibilité éternelle de l’app ou du système."]],["8. Propriété intellectuelle",["Hors votre contenu, app, nom, interface, code, algorithmes, icônes et documents sont protégés. Copie, vente, modification ou ingénierie inverse sont interdites sauf autorisation légale ou Apple."]],["9. Disponibilité",["Le service est fourni en l’état et peut évoluer ou cesser pour sécurité, compatibilité, droit, qualité ou exploitation. Une violation grave peut mettre fin à la licence."]],["10. Garanties et responsabilité",["Dans les limites légales, aucune garantie d’absence d’erreur, compatibilité totale, exactitude parfaite ou absence de perte. Testez sur des copies non critiques. La responsabilité indirecte est limitée sans écarter les droits impératifs."]],["11. Règles et droits du consommateur",["Ces conditions accompagnent le contrat standard Apple. Les droits impératifs de consommation, vie privée et contenu numérique de votre résidence restent acquis.","Contrat standard Apple : {eula}"]],["12. Modifications et contact",["Les changements importants seront annoncés dans l’app, sur le site ou les notes de version.","Contact : {email}"]]]},
"de":{title:"DiveTone-Nutzungsbedingungen und wichtige Hinweise",updated:"Gültig ab 9. August 2026",label:"Sprache",intro:"Durch Download oder Nutzung stimmen Sie diesen Bedingungen und Apples Standard-EULA zu. Andernfalls verwenden Sie die App nicht.",sections:[["1. Dienst",["DiveTone ist ein Offline-Assistent für Unterwasserbearbeitung mit Korrektur, Motiv-Erkennung und manueller Markierung, schwarzem Hintergrund, Zuschnitt, Wasserzeichen, Informationen, Video-Einzelbildern und Export. Funktionen variieren nach Gerät, System, Format, Berechtigung und Version.","Als in Entwicklung bezeichnete Funktionen sind keine Veröffentlichungszusage."]],["2. Analyse und Ergebnisse",["Algorithmen können wegen Wasserfarbe, Sicht, Verdeckung oder Bildaufbau irren. Pinsel und Vorschau garantieren keine perfekten Kanten. Schwarzer Hintergrund kann Säume oder falsche Masken erzeugen. Prüfen Sie Kanten, Farbe, Zuschnitt, Metadaten und Wasserzeichen. Eine Eignung für bestimmte ästhetische, kommerzielle, wissenschaftliche, Wettbewerbs- oder forensische Zwecke wird nicht garantiert."]],["3. Kein Tauchsicherheitswerkzeug",["Keine Tauchplanung, Tiefen-, Gas-, Dekompressions-, Navigations-, Wetter-, Medizin- oder Rettungsberatung. Niemals für lebenswichtige oder sicherheitsrelevante Entscheidungen nutzen."]],["4. Ihre Inhalte",["Sie behalten Rechte und bestätigen die Befugnis zu Nutzung, Bearbeitung, Urheberangabe, Wasserzeichen, Teilen und Export. Verletzen Sie keine Urheber-, Marken-, Persönlichkeits-, Datenschutz- oder sonstigen Rechte. Sie tragen Verantwortung für Eingaben, Bearbeitung, Metadaten und Ausgabe."]],["5. Originale und Sicherung",["Projekte sind nichtdestruktiv, doch bestätigte Aktionen können Photos-Assets oder Aufnahmedaten ändern. Die App ist kein Backup. Löschung, Gerätefehler, Systembereinigung oder Deinstallation kann Projekte unrettbar machen. Sichern Sie Wichtiges separat."]],["6. Metadaten und externe Dienste",["EXIF, Datum, Fotograf und GPS können beim Teilen Ort, Zeit, Gerät oder Personen offenlegen. Vor Veröffentlichung prüfen. Externe Dienste werden von ihren Anbietern kontrolliert."]],["7. Gratislimit und Pro",["Derzeit sind pro lokalem Tag 15 erfolgreiche Foto- und 2 Videoexporte kostenlos; maßgeblich ist die App-Anzeige.","Pro ist ein nicht verbrauchbarer lebenslanger App-Store-Kauf, kein Abo. Apple verwaltet Kauf, Erstattung, Prüfung und Wiederherstellung. „Lebenslang“ ist das Recht in verfügbaren kompatiblen Versionen, keine Garantie ewiger App- oder Systemverfügbarkeit."]],["8. Geistiges Eigentum",["Außer Ihren Inhalten sind App, Name, Oberfläche, Code, Algorithmen, Symbole und Dokumente geschützt. Kopie, Verkauf, Änderung oder Reverse Engineering sind außer bei gesetzlicher oder Apple-Erlaubnis verboten."]],["9. Verfügbarkeit",["Bereitstellung erfolgt wie verfügbar; Änderungen oder Einstellung aus Sicherheits-, Kompatibilitäts-, Rechts-, Qualitäts- oder Betriebsgründen sind möglich. Wesentliche Verstöße können die Lizenz beenden."]],["10. Gewährleistung und Haftung",["Soweit rechtlich zulässig keine Garantie für Fehlerfreiheit, vollständige Kompatibilität, perfekte Genauigkeit oder Verlustfreiheit. Testen Sie mit unwichtigen Kopien. Haftung für indirekte Schäden wird begrenzt; zwingende Verbraucherrechte bleiben unberührt."]],["11. Bedingungen und Verbraucherrechte",["Gilt mit Apples Standard-EULA. Zwingende Verbraucher-, Datenschutz- und Digitalinhaltsrechte Ihres Wohnsitzes werden nicht aufgegeben.","Apple Standard-EULA: {eula}"]],["12. Änderungen und Kontakt",["Wesentliche Änderungen erscheinen in App, Website oder Versionshinweisen.","Kontakt: {email}"]]]},
"it":{title:"Condizioni d’uso e avvisi importanti di DiveTone",updated:"In vigore dal 9 agosto 2026",label:"Lingua",intro:"Scaricando o usando DiveTone accetti queste condizioni e l’EULA standard Apple. In caso contrario, interrompi l’uso.",sections:[["1. Servizio",["DiveTone è un assistente offline per editing subacqueo con correzione, rilevamento e selezione soggetto, sfondo nero, ritaglio, filigrana, informazioni, fotogrammi video ed esportazione. Le funzioni variano per dispositivo, sistema, formato, permesso e versione.","Una funzione indicata come in sviluppo non ne promette il rilascio."]],["2. Analisi e risultati",["Gli algoritmi possono sbagliare per colore dell’acqua, visibilità, occlusione o composizione. Pennelli e anteprime non garantiscono bordi perfetti. Lo sfondo nero può generare aloni o maschere errate. Controlla bordi, colori, ritaglio, metadati e filigrane. Non garantiamo idoneità estetica, commerciale, agonistica, scientifica o forense."]],["3. Non è uno strumento di sicurezza",["Non offre pianificazione immersione, profondità, gas, decompressione, navigazione, meteo, medicina o soccorso. Non usarlo per decisioni vitali o di sicurezza subacquea."]],["4. I tuoi contenuti",["Conservi i diritti e confermi l’autorità per usare, modificare, attribuire, applicare filigrane, condividere ed esportare. Non violare copyright, marchi, immagine, privacy o leggi. Sei responsabile di input, modifiche, metadati e output."]],["5. Originali e backup",["Il progetto è non distruttivo, ma azioni confermate possono scrivere in Photos o cambiare la data. Non è un servizio di backup. Eliminazione, guasti, pulizia di sistema o disinstallazione possono rendere irrecuperabile un progetto. Conserva copie indipendenti."]],["6. Metadati e servizi esterni",["Mantenere EXIF, data, fotografo e GPS può rivelare luogo, tempo, dispositivo o persone. Controlla prima della pubblicazione. I servizi esterni dipendono dai fornitori."]],["7. Quota gratuita e Pro",["Attualmente sono consentite 15 foto e 2 video esportati con successo per giorno locale; prevale quanto mostrato nell’app.","Pro è uno sblocco a vita non consumabile tramite App Store, non un abbonamento. Apple gestisce acquisto, rimborso, verifica e ripristino. “A vita” indica il diritto nelle versioni compatibili disponibili, non disponibilità eterna dell’app o sistema."]],["8. Proprietà intellettuale",["Salvo i tuoi contenuti, app, nome, interfaccia, codice, algoritmi, icone e documenti sono protetti. Copia, vendita, modifica o reverse engineering sono vietati salvo autorizzazione legale o Apple."]],["9. Disponibilità",["Fornito così com’è, può cambiare o cessare per sicurezza, compatibilità, legge, qualità o gestione. Violazioni gravi possono terminare la licenza."]],["10. Garanzie e responsabilità",["Nei limiti di legge non garantiamo assenza di errori, compatibilità completa, precisione perfetta o assenza di perdita. Prova su copie non critiche. La responsabilità indiretta è limitata senza escludere diritti inderogabili."]],["11. Regole e diritti",["Si applica insieme all’EULA standard Apple. I diritti obbligatori di consumo, privacy e contenuto digitale della tua residenza restano validi.","EULA standard Apple: {eula}"]],["12. Modifiche e contatti",["Le modifiche importanti saranno comunicate nell’app, sul sito o nelle note.","Contatto: {email}"]]]},
"pt-BR":{title:"Termos de Uso e Avisos Importantes do DiveTone",updated:"Vigente em 9 de agosto de 2026",label:"Idioma",intro:"Ao baixar ou usar o DiveTone, você aceita estes termos e o EULA padrão da Apple. Caso discorde, pare de usar o app.",sections:[["1. Serviço",["DiveTone é um assistente offline de edição subaquática com correção, detecção e marcação de assunto, fundo preto, corte, marca-d’água, informações, captura de quadros e exportação. Recursos variam por aparelho, sistema, formato, permissão e versão.","Recurso indicado como em desenvolvimento não é promessa de lançamento."]],["2. Análise e resultados",["Algoritmos podem errar devido à água, visibilidade, obstrução ou composição. Pincéis e prévias não garantem bordas perfeitas. Fundo preto pode gerar halos ou máscaras incorretas. Revise bordas, cor, corte, metadados e marca-d’água. Não garantimos uso estético, comercial, científico, competitivo ou forense específico."]],["3. Não é ferramenta de segurança",["Não oferece planejamento de mergulho, profundidade, gás, descompressão, navegação, clima, medicina ou resgate. Nunca use para decisão vital ou de segurança."]],["4. Seu conteúdo",["Você mantém direitos e confirma autoridade para usar, editar, atribuir, aplicar marca, compartilhar e exportar. Não viole direitos autorais, marca, imagem, privacidade ou leis. Você responde por entradas, edições, metadados e saídas."]],["5. Originais e backup",["O projeto é não destrutivo, mas ações confirmadas podem gravar em Photos ou mudar data. Não é backup. Exclusão, falha, limpeza do sistema ou desinstalação pode tornar o projeto irrecuperável. Mantenha cópias independentes."]],["6. Metadados e externos",["Manter EXIF, data, fotógrafo e GPS pode revelar local, horário, aparelho ou pessoas. Revise antes de publicar. Serviços externos são controlados pelos fornecedores."]],["7. Cota grátis e Pro",["Atualmente são 15 fotos e 2 vídeos exportados com sucesso por dia local; vale a exibição do app.","Pro é desbloqueio vitalício não consumível pela App Store, não assinatura. Apple trata compra, reembolso, verificação e restauração. “Vitalício” é o direito em versões compatíveis disponíveis, não garantia eterna do app ou sistema."]],["8. Propriedade intelectual",["Exceto seu conteúdo, app, nome, interface, código, algoritmos, ícones e documentos são protegidos. Cópia, venda, alteração ou engenharia reversa são proibidas salvo permissão legal ou Apple."]],["9. Disponibilidade",["Fornecido como está, pode mudar ou cessar por segurança, compatibilidade, lei, qualidade ou operação. Violação grave pode encerrar a licença."]],["10. Garantias e responsabilidade",["No limite legal, não garantimos ausência de erros, compatibilidade total, precisão perfeita ou ausência de perda. Teste cópias não críticas. Responsabilidade indireta é limitada sem excluir direitos obrigatórios."]],["11. Regras e direitos",["Aplica-se junto ao EULA Apple. Direitos obrigatórios de consumo, privacidade e conteúdo digital da sua residência não são renunciados.","EULA padrão Apple: {eula}"]],["12. Mudanças e contato",["Mudanças importantes serão informadas no app, site ou notas.","Contato: {email}"]]]},
"pt-PT":{title:"Termos de Utilização e Avisos Importantes do DiveTone",updated:"Em vigor desde 9 de agosto de 2026",label:"Idioma",intro:"Ao descarregar ou usar o DiveTone, aceita estes termos e o EULA padrão da Apple. Se não concordar, deixe de usar a aplicação.",sections:[["1. Serviço",["O DiveTone é um assistente offline de edição subaquática com correção, deteção e marcação do motivo, fundo preto, recorte, marca de água, informações, captura de fotogramas e exportação. As funções variam por dispositivo, sistema, formato, permissão e versão.","Uma função assinalada em desenvolvimento não promete lançamento."]],["2. Análise e resultados",["Os algoritmos podem errar devido à água, visibilidade, obstrução ou composição. Pincéis e pré-visualizações não garantem contornos perfeitos. O fundo preto pode gerar halos ou máscaras incorretas. Reveja contornos, cor, recorte, metadados e marca de água. Não garantimos finalidade estética, comercial, científica, competitiva ou forense específica."]],["3. Não é ferramenta de segurança",["Não oferece planeamento de mergulho, profundidade, gás, descompressão, navegação, meteorologia, medicina ou salvamento. Nunca use para decisões vitais ou de segurança."]],["4. O seu conteúdo",["Mantém os direitos e confirma autorização para usar, editar, atribuir, aplicar marca, partilhar e exportar. Não viole direitos de autor, marca, imagem, privacidade ou leis. É responsável por entradas, edições, metadados e saídas."]],["5. Originais e cópias",["O projeto é não destrutivo, mas ações confirmadas podem gravar em Fotografias ou alterar a data. Não é um serviço de cópia de segurança. Eliminação, falha, limpeza do sistema ou desinstalação pode impedir recuperação. Guarde cópias independentes."]],["6. Metadados e externos",["Manter EXIF, data, fotógrafo e GPS pode revelar local, hora, dispositivo ou pessoas. Reveja antes de publicar. Serviços externos são controlados pelos fornecedores."]],["7. Limite gratuito e Pro",["Atualmente permite 15 fotografias e 2 vídeos exportados com êxito por dia local; prevalece a indicação da aplicação.","Pro é um desbloqueio vitalício não consumível pela App Store, não uma subscrição. Apple trata compra, reembolso, verificação e restauro. “Vitalício” é o direito em versões compatíveis disponíveis, não uma garantia eterna da aplicação ou sistema."]],["8. Propriedade intelectual",["Exceto o seu conteúdo, aplicação, nome, interface, código, algoritmos, ícones e documentos estão protegidos. Cópia, venda, alteração ou engenharia inversa são proibidas salvo permissão legal ou Apple."]],["9. Disponibilidade",["Fornecido tal como está, pode mudar ou cessar por segurança, compatibilidade, lei, qualidade ou operação. Violação grave pode terminar a licença."]],["10. Garantias e responsabilidade",["No limite legal, não garantimos ausência de erros, compatibilidade total, precisão perfeita ou ausência de perda. Teste cópias não críticas. A responsabilidade indireta é limitada sem excluir direitos obrigatórios."]],["11. Regras e direitos",["Aplica-se com o EULA Apple. Direitos obrigatórios de consumo, privacidade e conteúdo digital da sua residência não são renunciados.","EULA padrão Apple: {eula}"]],["12. Alterações e contacto",["Alterações importantes serão comunicadas na aplicação, site ou notas.","Contacto: {email}"]]]},
"nl":{title:"Gebruiksvoorwaarden en belangrijke mededelingen van DiveTone",updated:"Geldig vanaf 9 augustus 2026",label:"Taal",intro:"Door DiveTone te downloaden of gebruiken ga je akkoord met deze voorwaarden en de standaard-EULA van Apple. Stop anders met gebruik.",sections:[["1. Dienst",["DiveTone is een offline onderwaterbewerkingshulp met correctie, onderwerpdetectie en handmatige markering, zwarte achtergrond, uitsnede, watermerk, informatie, videoframes en export. Functies verschillen per apparaat, systeem, formaat, toestemming en versie.","Een functie in ontwikkeling is geen belofte tot uitgave."]],["2. Analyse en resultaten",["Algoritmen kunnen fouten maken door waterkleur, zicht, bedekking of compositie. Penselen en previews garanderen geen perfecte randen. Zwarte achtergrond kan halo’s of verkeerde maskers geven. Controleer randen, kleur, uitsnede, metadata en watermerken. Geen geschiktheid voor specifieke esthetische, commerciële, wetenschappelijke, wedstrijd- of forensische doelen wordt gegarandeerd."]],["3. Geen duikveiligheidstool",["Geen duikplanning, diepte-, gas-, decompressie-, navigatie-, weer-, medische of reddingsadviezen. Gebruik nooit voor levens- of duikveiligheidsbeslissingen."]],["4. Jouw inhoud",["Je houdt rechten en bevestigt bevoegdheid tot gebruik, bewerking, naamsvermelding, watermerk, delen en export. Schend geen auteursrecht, merk, portret, privacy of wet. Je bent verantwoordelijk voor invoer, bewerking, metadata en uitvoer."]],["5. Originelen en back-up",["Projecten zijn niet-destructief, maar bevestigde acties kunnen Photos of datum wijzigen. Dit is geen back-updienst. Verwijdering, storing, systeemopschoning of deïnstallatie kan herstel onmogelijk maken. Bewaar onafhankelijke kopieën."]],["6. Metadata en externe diensten",["EXIF, datum, fotograaf en GPS kunnen bij delen locatie, tijd, apparaat of personen onthullen. Controleer vóór publicatie. Externe diensten worden door hun aanbieders beheerd."]],["7. Gratis limiet en Pro",["Momenteel zijn 15 foto's en 2 video's per lokale dag succesvol te exporteren; de appweergave is leidend.","Pro is een niet-verbruikbare levenslange App Store-ontgrendeling, geen abonnement. Apple beheert aankoop, terugbetaling, controle en herstel. ‘Levenslang’ is gebruiksrecht in beschikbare compatibele versies, geen eeuwige beschikbaarheidsgarantie."]],["8. Intellectueel eigendom",["Buiten jouw inhoud zijn app, naam, interface, code, algoritmen, iconen en documenten beschermd. Kopiëren, verkopen, wijzigen of reverse engineering is verboden tenzij wet of Apple dit toestaat."]],["9. Beschikbaarheid",["Geleverd zoals beschikbaar en kan veranderen of stoppen wegens veiligheid, compatibiliteit, wet, kwaliteit of operatie. Ernstige schending kan de licentie beëindigen."]],["10. Garantie en aansprakelijkheid",["Voor zover wettelijk toegestaan geen garantie op foutloosheid, totale compatibiliteit, perfecte nauwkeurigheid of geen verlies. Test op onbelangrijke kopieën. Indirecte aansprakelijkheid is beperkt zonder dwingende rechten uit te sluiten."]],["11. Regels en rechten",["Geldt met de Apple EULA. Dwingende consumenten-, privacy- en digitale-inhoudsrechten van je woonplaats blijven behouden.","Apple Standard EULA: {eula}"]],["12. Wijzigingen en contact",["Belangrijke wijzigingen verschijnen in app, website of versienotities.","Contact: {email}"]]]},
"th":{title:"ข้อกำหนดการใช้และประกาศสำคัญ DiveTone",updated:"มีผลวันที่ 9 สิงหาคม 2026",label:"ภาษา",intro:"เมื่อดาวน์โหลดหรือใช้ DiveTone คุณยอมรับข้อกำหนดนี้และ EULA มาตรฐานของ Apple หากไม่ยอมรับ โปรดหยุดใช้",sections:[["1. บริการ",["DiveTone เป็นเครื่องมือแก้ไขภาพใต้น้ำแบบเน้นออฟไลน์ มีปรับสี ตรวจจับและระบุตัวแบบ พื้นหลังดำ ครอบตัด ลายน้ำ ข้อมูล จับเฟรม และส่งออก ฟังก์ชันแตกต่างตามอุปกรณ์ ระบบ รูปแบบ สิทธิ์ และรุ่น","ฟังก์ชันที่ระบุว่ากำลังพัฒนาไม่ใช่คำสัญญาว่าจะเปิดตัว"]],["2. การวิเคราะห์และผลลัพธ์",["อัลกอริทึมอาจผิดจากสีของน้ำ ทัศนวิสัย การบัง หรือองค์ประกอบ แปรงและภาพตัวอย่างไม่รับประกันขอบสมบูรณ์ พื้นหลังดำอาจมีขอบเรืองหรือมาสก์ผิด ตรวจสอบขอบ สี การครอบตัด metadata และลายน้ำก่อนส่งออก ไม่รับประกันการใช้เชิงพาณิชย์ วิทยาศาสตร์ การแข่งขัน หรือนิติวิทยาศาสตร์"]],["3. ไม่ใช่เครื่องมือความปลอดภัยดำน้ำ",["ไม่ให้คำแนะนำแผนดำน้ำ ความลึก ก๊าซ การลดความกด นำทาง อากาศ การแพทย์ หรือกู้ภัย ห้ามใช้ตัดสินใจด้านชีวิตหรือความปลอดภัย"]],["4. เนื้อหาของคุณ",["คุณยังมีสิทธิ์และยืนยันว่ามีอำนาจใช้ แก้ไข ระบุผู้สร้าง ใส่ลายน้ำ แชร์ และส่งออก ห้ามละเมิดลิขสิทธิ์ เครื่องหมาย ภาพบุคคล ความเป็นส่วนตัว หรือกฎหมาย คุณรับผิดชอบข้อมูลและผลลัพธ์"]],["5. ต้นฉบับและสำรอง",["โครงการไม่ทำลายต้นฉบับ แต่การกระทำที่ยืนยันอาจเขียนใน Photos หรือเปลี่ยนวันที่ แอปไม่ใช่บริการสำรอง การลบ ความเสียหาย การล้างระบบ หรือถอนแอปอาจทำให้กู้คืนไม่ได้ โปรดสำรองแยก"]],["6. Metadata และบริการภายนอก",["การเก็บ EXIF วันที่ ช่างภาพ และ GPS อาจเปิดเผยสถานที่ เวลา อุปกรณ์ หรือบุคคลเมื่อแชร์ ตรวจสอบก่อนเผยแพร่ บริการภายนอกอยู่ภายใต้ผู้ให้บริการ"]],["7. โควตาฟรีและ Pro",["ปัจจุบันส่งออกสำเร็จฟรี 15 ภาพและ 2 วิดีโอต่อวันท้องถิ่น โดยข้อมูลในแอปเป็นหลัก","Pro เป็นการปลดล็อกถาวรแบบไม่สิ้นเปลืองผ่าน App Store ไม่ใช่สมาชิก Apple จัดการซื้อ คืนเงิน ตรวจสอบ และกู้คืน “ถาวร” หมายถึงสิทธิ์ในรุ่นที่เข้ากันและยังให้บริการ ไม่รับประกันว่าแอปหรือระบบจะอยู่ตลอดไป"]],["8. ทรัพย์สินทางปัญญา",["นอกจากเนื้อหาของคุณ แอป ชื่อ UI โค้ด อัลกอริทึม ไอคอน และเอกสารได้รับคุ้มครอง ห้ามคัดลอก ขาย แก้ไข หรือวิศวกรรมย้อนกลับ เว้นแต่กฎหมายหรือ Apple อนุญาต"]],["9. ความพร้อมใช้",["ให้บริการตามสภาพและอาจเปลี่ยนหรือหยุดด้วยเหตุความปลอดภัย ความเข้ากัน กฎหมาย คุณภาพ หรือการดำเนินงาน การละเมิดร้ายแรงอาจยุติสิทธิ์"]],["10. การรับประกันและความรับผิด",["เท่าที่กฎหมายอนุญาต ไม่รับประกันว่าไร้ข้อผิดพลาด เข้ากันทุกอย่าง แม่นยำสมบูรณ์ หรือไม่สูญหาย ทดลองกับสำเนาที่ไม่สำคัญ จำกัดความรับผิดทางอ้อมโดยไม่ตัดสิทธิ์บังคับตามกฎหมาย"]],["11. กฎและสิทธิผู้บริโภค",["ใช้ร่วมกับ EULA Apple และไม่สละสิทธิผู้บริโภค ความเป็นส่วนตัว หรือเนื้อหาดิจิทัลที่กฎหมายบังคับ","Apple EULA: {eula}"]],["12. การเปลี่ยนแปลงและติดต่อ",["จะแจ้งการเปลี่ยนแปลงสำคัญในแอป เว็บไซต์ หรือบันทึกรุ่น","ติดต่อ: {email}"]]]},
"id":{title:"Ketentuan Penggunaan dan Pemberitahuan Penting DiveTone",updated:"Berlaku 9 Agustus 2026",label:"Bahasa",intro:"Dengan mengunduh atau memakai DiveTone, Anda menyetujui ketentuan ini dan EULA standar Apple. Jika tidak, hentikan penggunaan.",sections:[["1. Layanan",["DiveTone adalah asisten penyuntingan bawah air yang mengutamakan offline, dengan koreksi, deteksi dan penandaan subjek, latar hitam, crop, watermark, informasi, tangkap frame, dan ekspor. Fitur berbeda menurut perangkat, sistem, format, izin, dan versi.","Fitur berstatus dikembangkan bukan janji peluncuran."]],["2. Analisis dan hasil",["Algoritma dapat salah karena warna air, jarak pandang, halangan, atau komposisi. Kuas dan pratinjau tidak menjamin tepi sempurna. Latar hitam dapat menghasilkan halo atau mask salah. Periksa tepi, warna, crop, metadata, dan watermark. Tidak ada jaminan untuk tujuan estetika, komersial, lomba, ilmiah, atau forensik tertentu."]],["3. Bukan alat keselamatan selam",["Tidak memberi rencana selam, kedalaman, gas, dekompresi, navigasi, cuaca, medis, atau penyelamatan. Jangan gunakan untuk keputusan keselamatan atau nyawa."]],["4. Konten Anda",["Anda tetap memiliki hak dan memastikan wewenang untuk memakai, mengedit, memberi atribusi, watermark, berbagi, dan mengekspor. Jangan melanggar hak cipta, merek, citra, privasi, atau hukum. Anda bertanggung jawab atas masukan, edit, metadata, dan hasil."]],["5. Asli dan cadangan",["Proyek non-destruktif, tetapi tindakan terkonfirmasi dapat menulis ke Photos atau mengubah tanggal. Aplikasi bukan layanan cadangan. Penghapusan, kerusakan, pembersihan sistem, atau uninstall dapat membuat proyek tidak pulih. Simpan cadangan terpisah."]],["6. Metadata dan eksternal",["EXIF, tanggal, fotografer, dan GPS dapat mengungkap lokasi, waktu, perangkat, atau orang saat dibagikan. Periksa sebelum publikasi. Layanan eksternal dikelola penyedianya."]],["7. Kuota gratis dan Pro",["Saat ini 15 foto dan 2 video berhasil diekspor per hari lokal; tampilan aplikasi berlaku.","Pro adalah pembukaan seumur hidup non-konsumsi melalui App Store, bukan langganan. Apple mengurus pembelian, pengembalian, verifikasi, dan pemulihan. “Seumur hidup” berarti hak dalam versi kompatibel yang tersedia, bukan jaminan aplikasi atau sistem selamanya."]],["8. Kekayaan intelektual",["Selain konten Anda, aplikasi, nama, UI, kode, algoritma, ikon, dan dokumen dilindungi. Dilarang menyalin, menjual, mengubah, atau merekayasa balik kecuali diizinkan hukum atau Apple."]],["9. Ketersediaan",["Disediakan apa adanya dan dapat berubah atau berhenti demi keamanan, kompatibilitas, hukum, kualitas, atau operasi. Pelanggaran berat dapat mengakhiri lisensi."]],["10. Jaminan dan tanggung jawab",["Sejauh hukum mengizinkan, tidak dijamin bebas salah, kompatibel penuh, akurat sempurna, atau tanpa kehilangan. Uji pada salinan tidak penting. Tanggung jawab tidak langsung dibatasi tanpa menghapus hak wajib."]],["11. Aturan dan hak",["Berlaku bersama EULA Apple. Hak wajib konsumen, privasi, dan konten digital tempat tinggal Anda tidak dilepaskan.","EULA Apple: {eula}"]],["12. Perubahan dan kontak",["Perubahan penting diumumkan dalam aplikasi, situs, atau catatan rilis.","Kontak: {email}"]]]},
"ms":{title:"Terma Penggunaan dan Notis Penting DiveTone",updated:"Berkuat kuasa 9 Ogos 2026",label:"Bahasa",intro:"Dengan memuat turun atau menggunakan DiveTone, anda bersetuju dengan terma ini dan EULA standard Apple. Jika tidak, hentikan penggunaan.",sections:[["1. Perkhidmatan",["DiveTone ialah pembantu suntingan bawah air mengutamakan luar talian dengan pembetulan, pengesanan dan tanda subjek, latar hitam, pangkas, tera air, maklumat, tangkap bingkai dan eksport. Fungsi berbeza mengikut peranti, sistem, format, kebenaran dan versi.","Fungsi dalam pembangunan bukan janji pelancaran."]],["2. Analisis dan hasil",["Algoritma boleh silap kerana warna air, jarak penglihatan, halangan atau komposisi. Berus dan pratonton tidak menjamin sempadan sempurna. Latar hitam boleh menghasilkan halo atau topeng salah. Semak tepi, warna, pangkas, metadata dan tera air. Tiada jaminan untuk tujuan estetik, komersial, pertandingan, saintifik atau forensik tertentu."]],["3. Bukan alat keselamatan selam",["Tidak memberi pelan selam, kedalaman, gas, penyahmampatan, navigasi, cuaca, perubatan atau bantuan kecemasan. Jangan guna untuk keputusan nyawa atau keselamatan."]],["4. Kandungan anda",["Anda kekal memiliki hak dan mengesahkan kuasa untuk guna, sunting, atribut, tera air, kongsi dan eksport. Jangan langgar hak cipta, tanda dagang, imej, privasi atau undang-undang. Anda bertanggungjawab atas input, suntingan, metadata dan output."]],["5. Asal dan sandaran",["Projek tidak merosakkan, tetapi tindakan disahkan boleh menulis ke Photos atau ubah tarikh. Aplikasi bukan sandaran. Pemadaman, kegagalan, pembersihan sistem atau nyahpasang boleh menyebabkan projek tidak pulih. Simpan salinan berasingan."]],["6. Metadata dan luar",["EXIF, tarikh, jurugambar dan GPS boleh mendedahkan tempat, masa, peranti atau orang ketika dikongsi. Semak sebelum terbit. Perkhidmatan luar dikawal pembekalnya."]],["7. Kuota percuma dan Pro",["Kini 15 foto dan 2 video berjaya dieksport setiap hari tempatan; paparan aplikasi terpakai.","Pro ialah buka kunci sepanjang hayat tidak habis guna melalui App Store, bukan langganan. Apple mengurus pembelian, bayaran balik, pengesahan dan pemulihan. “Sepanjang hayat” ialah hak dalam versi serasi yang tersedia, bukan jaminan aplikasi atau sistem kekal selamanya."]],["8. Harta intelek",["Selain kandungan anda, aplikasi, nama, UI, kod, algoritma, ikon dan dokumen dilindungi. Salin, jual, ubah atau kejuruteraan songsang dilarang kecuali dibenarkan undang-undang atau Apple."]],["9. Ketersediaan",["Disediakan seadanya dan boleh berubah atau berhenti demi keselamatan, keserasian, undang-undang, kualiti atau operasi. Pelanggaran besar boleh tamatkan lesen."]],["10. Jaminan dan liabiliti",["Setakat dibenarkan undang-undang, tiada jaminan bebas ralat, serasi penuh, tepat sempurna atau tiada kehilangan. Uji salinan tidak kritikal. Liabiliti tidak langsung dihadkan tanpa menolak hak mandatori."]],["11. Peraturan dan hak",["Terpakai bersama EULA Apple. Hak mandatori pengguna, privasi dan kandungan digital tempat tinggal anda tidak diketepikan.","EULA Apple: {eula}"]],["12. Perubahan dan hubungan",["Perubahan penting diumumkan dalam aplikasi, laman atau nota keluaran.","Hubungan: {email}"]]]},
"fil":{title:"Mga Tuntunin sa Paggamit at Mahalagang Paalala ng DiveTone",updated:"Epektibo Agosto 9, 2026",label:"Wika",intro:"Sa pag-download o paggamit ng DiveTone, sumasang-ayon ka rito at sa Apple Standard EULA. Kung hindi, itigil ang paggamit.",sections:[["1. Serbisyo",["Ang DiveTone ay offline-first underwater editing assistant na may correction, subject detection at manual marking, black background, crop, watermark, impormasyon, frame capture at export. Nag-iiba ang features ayon sa device, system, format, permission at version.","Ang feature na under development ay hindi pangakong ilalabas."]],["2. Analysis at resulta",["Maaaring magkamali ang algorithm dahil sa kulay ng tubig, visibility, takip o composition. Hindi ginagarantiya ng brush at preview ang perpektong edges. Maaaring magkaroon ng halo o maling mask ang black background. Suriin ang edges, color, crop, metadata at watermark. Walang garantiya para sa partikular na aesthetic, commercial, contest, scientific o forensic use."]],["3. Hindi dive-safety tool",["Hindi ito nagbibigay ng dive planning, depth, gas, decompression, navigation, weather, medical o rescue advice. Huwag gamitin sa life-critical o safety decision."]],["4. Iyong content",["Nananatili sa iyo ang rights at kinukumpirma mong may pahintulot sa paggamit, edit, attribution, watermark, share at export. Huwag lumabag sa copyright, trademark, image, privacy o batas. Responsibilidad mo ang input, edits, metadata at output."]],["5. Originals at backup",["Non-destructive ang project ngunit ang kumpirmadong action ay maaaring sumulat sa Photos o magpalit ng petsa. Hindi backup service ang app. Ang deletion, failure, system cleanup o uninstall ay maaaring magpawala ng project. Magtabi ng hiwalay na backup."]],["6. Metadata at external services",["Ang EXIF, petsa, photographer at GPS ay maaaring maghayag ng lugar, oras, device o tao kapag ibinahagi. Suriin bago mag-publish. Provider ang namamahala sa external service."]],["7. Libreng quota at Pro",["Sa kasalukuyan, 15 photos at 2 videos ang matagumpay na export bawat local day; display ng app ang masusunod.","Ang Pro ay non-consumable lifetime unlock sa App Store, hindi subscription. Apple ang humahawak ng purchase, refund, verification at restore. Ang “lifetime” ay karapatan sa available compatible versions, hindi garantiya na laging iiral ang app o system."]],["8. Intellectual property",["Bukod sa content mo, protektado ang app, pangalan, UI, code, algorithms, icons at documents. Bawal kopyahin, ibenta, baguhin o reverse engineer maliban kung pinahihintulutan ng batas o Apple."]],["9. Availability",["Ibinibigay as-is at maaaring baguhin o ihinto para sa security, compatibility, batas, quality o operation. Maaaring matapos ang license sa seryosong paglabag."]],["10. Warranty at liability",["Hanggang pinapayagan ng batas, walang garantiya ng walang error, full compatibility, perfect accuracy o walang pagkawala. Subukan sa hindi mahalagang copies. Limitado ang indirect liability nang hindi inaalis ang mandatory rights."]],["11. Rules at rights",["Kasamang nalalapat ang Apple EULA. Hindi isinusuko ang mandatory consumer, privacy at digital-content rights sa tinitirhan mo.","Apple Standard EULA: {eula}"]],["12. Pagbabago at contact",["Iaanunsyo ang mahalagang pagbabago sa app, site o release notes.","Contact: {email}"]]]},
"vi":{title:"Điều khoản sử dụng và thông báo quan trọng DiveTone",updated:"Hiệu lực ngày 9 tháng 8 năm 2026",label:"Ngôn ngữ",intro:"Khi tải hoặc sử dụng DiveTone, bạn đồng ý với điều khoản này và EULA tiêu chuẩn của Apple. Nếu không, hãy ngừng sử dụng.",sections:[["1. Dịch vụ",["DiveTone là trợ lý chỉnh sửa dưới nước ưu tiên ngoại tuyến gồm chỉnh màu, phát hiện và đánh dấu chủ thể, nền đen, cắt, watermark, thông tin, lấy khung hình và xuất. Tính năng tùy thiết bị, hệ thống, định dạng, quyền và phiên bản.","Tính năng đang phát triển không phải cam kết phát hành."]],["2. Phân tích và kết quả",["Thuật toán có thể sai do màu nước, tầm nhìn, che khuất hoặc bố cục. Cọ và xem trước không bảo đảm cạnh hoàn hảo. Nền đen có thể tạo quầng hoặc mask sai. Kiểm tra cạnh, màu, cắt, metadata và watermark. Không bảo đảm phù hợp mục đích thẩm mỹ, thương mại, thi đấu, khoa học hay pháp chứng cụ thể."]],["3. Không phải công cụ an toàn lặn",["Không cung cấp kế hoạch lặn, độ sâu, khí, giảm áp, điều hướng, thời tiết, y tế hoặc cứu hộ. Không dùng cho quyết định liên quan tính mạng hay an toàn."]],["4. Nội dung của bạn",["Bạn giữ quyền và xác nhận có thẩm quyền sử dụng, chỉnh sửa, ghi tác giả, watermark, chia sẻ và xuất. Không vi phạm bản quyền, nhãn hiệu, hình ảnh, riêng tư hoặc pháp luật. Bạn chịu trách nhiệm về đầu vào, chỉnh sửa, metadata và đầu ra."]],["5. Bản gốc và sao lưu",["Dự án không phá hủy, nhưng hành động xác nhận có thể ghi vào Photos hoặc đổi ngày. App không phải dịch vụ sao lưu. Xóa, lỗi, dọn hệ thống hoặc gỡ app có thể khiến dự án không phục hồi. Hãy giữ bản sao riêng."]],["6. Metadata và dịch vụ ngoài",["EXIF, ngày, nhiếp ảnh gia và GPS có thể tiết lộ nơi, thời gian, thiết bị hoặc người khi chia sẻ. Kiểm tra trước khi công bố. Dịch vụ ngoài do nhà cung cấp quản lý."]],["7. Hạn mức miễn phí và Pro",["Hiện có 15 ảnh và 2 video xuất thành công mỗi ngày địa phương; hiển thị trong app là quyết định.","Pro là mở khóa trọn đời không tiêu hao qua App Store, không phải thuê bao. Apple xử lý mua, hoàn tiền, xác minh và khôi phục. “Trọn đời” là quyền trong phiên bản tương thích còn cung cấp, không bảo đảm app hay hệ thống tồn tại mãi."]],["8. Sở hữu trí tuệ",["Ngoài nội dung của bạn, app, tên, UI, mã, thuật toán, biểu tượng và tài liệu được bảo vệ. Cấm sao chép, bán, sửa hoặc dịch ngược trừ khi luật hoặc Apple cho phép."]],["9. Khả dụng",["Cung cấp theo hiện trạng và có thể thay đổi hoặc ngừng vì bảo mật, tương thích, pháp luật, chất lượng hoặc vận hành. Vi phạm nghiêm trọng có thể chấm dứt giấy phép."]],["10. Bảo đảm và trách nhiệm",["Trong phạm vi luật cho phép, không bảo đảm không lỗi, tương thích hoàn toàn, chính xác tuyệt đối hoặc không mất dữ liệu. Thử với bản sao không quan trọng. Trách nhiệm gián tiếp bị giới hạn nhưng không loại bỏ quyền bắt buộc."]],["11. Quy tắc và quyền",["Áp dụng cùng EULA Apple. Không từ bỏ quyền bắt buộc về người tiêu dùng, riêng tư và nội dung số tại nơi cư trú.","Apple Standard EULA: {eula}"]],["12. Thay đổi và liên hệ",["Thay đổi quan trọng sẽ thông báo trong app, trang web hoặc ghi chú phát hành.","Liên hệ: {email}"]]]},
"ar":{title:"شروط استخدام DiveTone وإشعارات مهمة",updated:"تاريخ النفاذ: 9 أغسطس 2026",label:"اللغة",intro:"بتنزيل DiveTone أو استخدامه توافق على هذه الشروط واتفاقية Apple القياسية. إن لم توافق فتوقف عن الاستخدام.",sections:[["1. الخدمة",["DiveTone مساعد تحرير تحت الماء يعمل أساساً دون اتصال، ويشمل التصحيح واكتشاف الهدف وتحديده والخلفية السوداء والقص والعلامة والمعلومات والتقاط الإطار والتصدير. تختلف الوظائف حسب الجهاز والنظام والتنسيق والإذن والإصدار.","الميزة قيد التطوير ليست وعداً بإطلاقها."]],["2. التحليل والنتائج",["قد تخطئ الخوارزميات بسبب لون الماء أو الرؤية أو الحجب أو التكوين. لا تضمن الفرشاة والمعاينة حدوداً مثالية. قد تنتج الخلفية السوداء هالات أو أقنعة خاطئة. راجع الحدود واللون والقص والبيانات والعلامة. لا نضمن ملاءمة لغرض جمالي أو تجاري أو تنافسي أو علمي أو جنائي محدد."]],["3. ليست أداة سلامة غوص",["لا تقدم تخطيط الغوص أو العمق أو الغاز أو إزالة الضغط أو الملاحة أو الطقس أو الطب أو الإنقاذ. لا تعتمد عليها في قرار حياة أو سلامة."]],["4. محتواك",["تحتفظ بحقوقك وتؤكد سلطتك على الاستخدام والتحرير والإسناد والعلامة والمشاركة والتصدير. لا تنتهك حقوق النشر أو العلامات أو الصورة أو الخصوصية أو القانون. أنت مسؤول عن المدخلات والتعديلات والبيانات والنتائج."]],["5. الأصول والنسخ الاحتياطي",["المشروع غير إتلافي، لكن الإجراءات المؤكدة قد تكتب في Photos أو تغير التاريخ. التطبيق ليس خدمة نسخ احتياطي. الحذف أو العطل أو تنظيف النظام أو إزالة التطبيق قد يمنع الاستعادة. احتفظ بنسخ مستقلة."]],["6. البيانات الوصفية والخدمات الخارجية",["قد يكشف EXIF والتاريخ والمصور وGPS المكان أو الوقت أو الجهاز أو الأشخاص عند المشاركة. راجع قبل النشر. يدير مقدمو الخدمات الخارجية خدماتهم."]],["7. الحصة المجانية وPro",["حالياً يمكن تصدير 15 صورة وفيديوهين بنجاح كل يوم محلي؛ وما يظهر في التطبيق هو المعتمد.","Pro فتح دائم غير مستهلك عبر App Store وليس اشتراكاً. تدير Apple الشراء والاسترداد والتحقق والاستعادة. «دائم» يعني الحق في الإصدارات المتوافقة المتاحة، ولا يضمن بقاء التطبيق أو النظام للأبد."]],["8. الملكية الفكرية",["عدا محتواك، التطبيق والاسم والواجهة والرمز والخوارزميات والأيقونات والوثائق محمية. يمنع النسخ أو البيع أو التعديل أو الهندسة العكسية إلا بإذن القانون أو Apple."]],["9. التوافر",["يقدم كما هو وقد يتغير أو يتوقف للأمان أو التوافق أو القانون أو الجودة أو التشغيل. المخالفة الجوهرية قد تنهي الترخيص."]],["10. الضمان والمسؤولية",["في حدود القانون لا نضمن الخلو من الخطأ أو التوافق الكامل أو الدقة التامة أو عدم الفقد. اختبر على نسخ غير مهمة. تحد المسؤولية غير المباشرة دون استبعاد الحقوق الإلزامية."]],["11. القواعد والحقوق",["تسري مع اتفاقية Apple. لا تتنازل عن حقوق المستهلك والخصوصية والمحتوى الرقمي الإلزامية في محل إقامتك.","اتفاقية Apple: {eula}"]],["12. التغييرات والاتصال",["ستعلن التغييرات المهمة في التطبيق أو الموقع أو ملاحظات الإصدار.","البريد: {email}"]]]},
"tr":{title:"DiveTone Kullanım Koşulları ve Önemli Bildirimler",updated:"Yürürlük: 9 Ağustos 2026",label:"Dil",intro:"DiveTone'u indirerek veya kullanarak bu koşulları ve Apple Standart EULA'yı kabul edersiniz. Etmiyorsanız kullanmayı bırakın.",sections:[["1. Hizmet",["DiveTone çevrimdışı öncelikli sualtı düzenleme yardımcısıdır: düzeltme, konu algılama ve elle işaretleme, siyah arka plan, kırpma, filigran, bilgi, kare yakalama ve dışa aktarma. Özellikler cihaz, sistem, biçim, izin ve sürüme göre değişir.","Geliştirilmekte olan özellik yayın sözü değildir."]],["2. Analiz ve sonuç",["Algoritmalar su rengi, görüş, kapanma veya kompozisyon nedeniyle yanılabilir. Fırça ve önizleme kusursuz kenar garantilemez. Siyah arka plan hale veya yanlış maske üretebilir. Kenar, renk, kırpma, meta veri ve filigranı kontrol edin. Belirli estetik, ticari, yarışma, bilimsel veya adli amaca uygunluk garanti edilmez."]],["3. Dalış güvenliği aracı değildir",["Dalış planı, derinlik, gaz, dekompresyon, navigasyon, hava, tıp veya kurtarma tavsiyesi vermez. Yaşam veya güvenlik kararında kullanmayın."]],["4. İçeriğiniz",["Hakları korur ve kullanma, düzenleme, atıf, filigran, paylaşım ve dışa aktarma yetkinizi doğrularsınız. Telif, marka, görüntü, gizlilik veya yasayı ihlal etmeyin. Girdi, düzenleme, meta veri ve çıktılardan siz sorumlusunuz."]],["5. Orijinal ve yedek",["Proje tahribatsızdır ancak onaylı işlemler Photos'a yazabilir veya tarihi değiştirebilir. Uygulama yedek değildir. Silme, arıza, sistem temizliği veya kaldırma kurtarmayı engelleyebilir. Bağımsız kopya tutun."]],["6. Meta veri ve dış hizmetler",["EXIF, tarih, fotoğrafçı ve GPS paylaşımda yer, zaman, cihaz veya kişileri açığa çıkarabilir. Yayından önce kontrol edin. Dış hizmetleri sağlayıcıları yönetir."]],["7. Ücretsiz kota ve Pro",["Şu anda yerel günde 15 fotoğraf ve 2 video başarıyla dışa aktarılır; uygulama gösterimi geçerlidir.","Pro App Store üzerinden tüketilmeyen ömür boyu kilit açmadır, abonelik değildir. Satın alma, iade, doğrulama ve geri yüklemeyi Apple yönetir. “Ömür boyu” mevcut uyumlu sürümlerde kullanım hakkıdır; uygulama veya sistemin sonsuza dek varlığını garanti etmez."]],["8. Fikri mülkiyet",["İçeriğiniz dışında uygulama, ad, UI, kod, algoritma, simge ve belgeler korunur. Yasa veya Apple izin vermedikçe kopyalama, satış, değiştirme veya tersine mühendislik yasaktır."]],["9. Kullanılabilirlik",["Olduğu gibi sunulur; güvenlik, uyumluluk, hukuk, kalite veya işletim için değişebilir veya durabilir. Önemli ihlal lisansı sona erdirebilir."]],["10. Garanti ve sorumluluk",["Yasanın izin verdiği ölçüde hatasızlık, tam uyum, kusursuz doğruluk veya kayıpsızlık garanti edilmez. Önemsiz kopyalarda test edin. Dolaylı sorumluluk, zorunlu hakları dışlamadan sınırlandırılır."]],["11. Kurallar ve haklar",["Apple EULA ile uygulanır. İkametinizdeki zorunlu tüketici, gizlilik ve dijital içerik haklarından vazgeçilmez.","Apple Standard EULA: {eula}"]],["12. Değişiklik ve iletişim",["Önemli değişiklikler uygulama, site veya sürüm notlarında açıklanır.","İletişim: {email}"]]]},
"el":{title:"Όροι Χρήσης και Σημαντικές Ειδοποιήσεις DiveTone",updated:"Ισχύει από 9 Αυγούστου 2026",label:"Γλώσσα",intro:"Κατεβάζοντας ή χρησιμοποιώντας το DiveTone αποδέχεστε τους όρους και την τυπική EULA της Apple. Αν διαφωνείτε, σταματήστε τη χρήση.",sections:[["1. Υπηρεσία",["Το DiveTone είναι βοηθός υποβρύχιας επεξεργασίας με προτεραιότητα offline: διόρθωση, εντοπισμός και χειροκίνητη σήμανση θέματος, μαύρο φόντο, περικοπή, υδατογράφημα, πληροφορίες, λήψη καρέ και εξαγωγή. Οι λειτουργίες διαφέρουν ανά συσκευή, σύστημα, μορφή, άδεια και έκδοση.","Λειτουργία υπό ανάπτυξη δεν αποτελεί υπόσχεση κυκλοφορίας."]],["2. Ανάλυση και αποτελέσματα",["Οι αλγόριθμοι μπορεί να σφάλουν λόγω χρώματος νερού, ορατότητας, απόκρυψης ή σύνθεσης. Πινέλα και προεπισκοπήσεις δεν εγγυώνται τέλεια όρια. Το μαύρο φόντο μπορεί να δημιουργήσει άλω ή λάθος μάσκα. Ελέγξτε όρια, χρώμα, περικοπή, μεταδεδομένα και υδατογράφημα. Δεν εγγυόμαστε καταλληλότητα για συγκεκριμένο αισθητικό, εμπορικό, αγωνιστικό, επιστημονικό ή εγκληματολογικό σκοπό."]],["3. Δεν είναι εργαλείο ασφάλειας κατάδυσης",["Δεν παρέχει σχεδιασμό κατάδυσης, βάθος, αέριο, αποσυμπίεση, πλοήγηση, καιρό, ιατρική ή διάσωση. Μην το χρησιμοποιείτε για αποφάσεις ζωής ή ασφάλειας."]],["4. Το περιεχόμενό σας",["Διατηρείτε δικαιώματα και επιβεβαιώνετε εξουσία χρήσης, επεξεργασίας, απόδοσης, υδατογραφήματος, κοινοποίησης και εξαγωγής. Μην παραβιάζετε πνευματικά δικαιώματα, σήματα, εικόνα, ιδιωτικότητα ή νόμο. Είστε υπεύθυνοι για εισόδους, αλλαγές, μεταδεδομένα και εξόδους."]],["5. Πρωτότυπα και αντίγραφα",["Το έργο είναι μη καταστροφικό, αλλά επιβεβαιωμένες ενέργειες μπορεί να γράψουν στο Photos ή να αλλάξουν ημερομηνία. Δεν είναι υπηρεσία αντιγράφων ασφαλείας. Διαγραφή, βλάβη, εκκαθάριση ή αφαίρεση μπορεί να εμποδίσει ανάκτηση. Κρατήστε ανεξάρτητα αντίγραφα."]],["6. Μεταδεδομένα και εξωτερικά",["EXIF, ημερομηνία, φωτογράφος και GPS μπορεί να αποκαλύψουν τόπο, χρόνο, συσκευή ή άτομα. Ελέγξτε πριν τη δημοσίευση. Οι εξωτερικές υπηρεσίες ελέγχονται από παρόχους."]],["7. Δωρεάν όριο και Pro",["Τώρα επιτρέπονται 15 φωτογραφίες και 2 βίντεο επιτυχούς εξαγωγής ανά τοπική ημέρα· υπερισχύει η ένδειξη της εφαρμογής.","Το Pro είναι μη αναλώσιμο ισόβιο ξεκλείδωμα μέσω App Store, όχι συνδρομή. Η Apple διαχειρίζεται αγορά, επιστροφή, επαλήθευση και επαναφορά. «Ισόβιο» είναι δικαίωμα σε διαθέσιμες συμβατές εκδόσεις, όχι εγγύηση αιώνιας ύπαρξης εφαρμογής ή συστήματος."]],["8. Πνευματική ιδιοκτησία",["Εκτός του περιεχομένου σας, εφαρμογή, όνομα, UI, κώδικας, αλγόριθμοι, εικονίδια και έγγραφα προστατεύονται. Απαγορεύεται αντιγραφή, πώληση, τροποποίηση ή αντίστροφη μηχανική εκτός αν επιτρέπεται από νόμο ή Apple."]],["9. Διαθεσιμότητα",["Παρέχεται ως έχει και μπορεί να αλλάξει ή σταματήσει για ασφάλεια, συμβατότητα, νόμο, ποιότητα ή λειτουργία. Σοβαρή παραβίαση μπορεί να τερματίσει την άδεια."]],["10. Εγγύηση και ευθύνη",["Στον βαθμό που επιτρέπει ο νόμος δεν εγγυόμαστε απουσία σφαλμάτων, πλήρη συμβατότητα, τέλεια ακρίβεια ή μη απώλεια. Δοκιμάστε σε μη κρίσιμα αντίγραφα. Η έμμεση ευθύνη περιορίζεται χωρίς να αποκλείονται υποχρεωτικά δικαιώματα."]],["11. Κανόνες και δικαιώματα",["Ισχύει με την Apple EULA. Δεν παραιτείστε από υποχρεωτικά δικαιώματα καταναλωτή, απορρήτου και ψηφιακού περιεχομένου του τόπου κατοικίας.","Apple Standard EULA: {eula}"]],["12. Αλλαγές και επικοινωνία",["Σημαντικές αλλαγές ανακοινώνονται στην εφαρμογή, ιστοσελίδα ή σημειώσεις έκδοσης.","Επικοινωνία: {email}"]]]}
};
function bestLanguage(){const q=new URLSearchParams(location.search).get("lang");const candidates=[q,...(navigator.languages||[]),navigator.language].filter(Boolean);for(const c of candidates){if(T[c])return c;const base=c.split("-")[0];if(base==="zh")return c.toLowerCase().includes("hant")||/tw|hk|mo/i.test(c)?"zh-Hant":"zh-Hans";if(base==="pt")return /br/i.test(c)?"pt-BR":"pt-PT";if(T[base])return base}return"en"}
function render(lang){const d=T[lang]||T.en;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.title=d.title;document.getElementById("title").textContent=d.title;document.getElementById("updated").textContent=d.updated;document.getElementById("languageLabel").textContent=d.label;document.getElementById("language").value=lang;document.getElementById("content").innerHTML=`<p class="muted">${d.intro}</p>`+d.sections.map(([h,ps])=>`<section><h2>${h}</h2>${ps.map(x=>`<p>${x.replace("{email}",`<a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a>`).replace("{eula}",`<a href="${APPLE_EULA}" target="_blank" rel="noopener">${APPLE_EULA}</a>`)}</p>`).join("")}</section>`).join("");localStorage.setItem("divetone-legal-language",lang);history.replaceState(null,"",`${location.pathname}?lang=${encodeURIComponent(lang)}`)}
for(const [code,name] of Object.entries(languages)){const o=document.createElement("option");o.value=code;o.textContent=name;document.getElementById("language").appendChild(o)}
document.getElementById("language").addEventListener("change",e=>render(e.target.value));if(CONTACT_EMAIL.startsWith("YOUR_"))document.getElementById("setupWarning").style.display="block";render(new URLSearchParams(location.search).has("lang")?bestLanguage():(T[localStorage.getItem("divetone-legal-language")]?localStorage.getItem("divetone-legal-language"):bestLanguage()));
</script>
