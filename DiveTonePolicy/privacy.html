const P={
"zh-Hant":{title:"DiveTone 隱私權政策",updated:"生效日期：2026 年 8 月 9 日",label:"語言",intro:"DiveTone 重視你的隱私。本政策說明 App 在你使用水下照片與影片編輯功能時如何處理資訊。DiveTone 沒有帳號系統、廣告、跨 App 追蹤、分析 SDK 或開發者營運的影像伺服器。",sections:[["1. DiveTone 處理的資料",["當你主動選取媒體時，App 會讀取照片或影片內容，以及可能包含的拍攝日期、GPS、檔名、格式、EXIF、TIFF、IPTC 與 QuickTime metadata。這些資訊用於顯示媒體資訊、排序與分組、調色、匯出及保留你選擇的 metadata。","你可在匯出時選擇完整保留、移除 GPS，或移除所有照片資訊。"]],["2. 裝置端影像處理",["調色、主體自動偵測、手動主體標示、黑背景效果、裁切、浮水印與影像編碼均在裝置上執行。主體偵測使用 Apple Vision 系統框架；照片或遮罩不會傳送至 DiveTone 開發者的伺服器。"]],["3. 本機儲存",["App 會在裝置內保存相簿資產識別碼、編輯參數、日期、GPS、格式、偏好設定、攝影者名稱、浮水印設定、手動畫出的主體遮罩、縮圖、地名快取及每日匯出次數。原始媒體通常仍保存在系統照片圖庫中。","Documents、Application Support 與偏好資料可能依你的裝置設定包含在 Apple 的裝置或 iCloud 備份中；縮圖快取可由系統自動清除。"]],["4. Apple 服務與網路連線",["若所選媒體只存在 iCloud Photos，PhotoKit 可能透過 Apple 服務下載媒體。StoreKit 會由 Apple 處理 Pro 商品價格、購買、資格驗證與恢復購買。DiveTone 不會取得你的 Apple ID、付款卡資料或完整訂單資料。","照片含 GPS 時，App 可能將該座標交給 Apple MapKit／Core Location 的反向地理編碼服務，以取得約略國家、城市或海域名稱，並將結果與約 100 公尺級座標快取在裝置上。Apple 對資料的處理由 Apple 隱私權政策規範。"]],["5. Google Maps、分享與外部服務",["只有當你主動點擊「在 Google Maps 顯示」時，照片座標才會放入 Google Maps 網址並交由 Google 處理。","當你使用分享、AirDrop、儲存到檔案或其他 App 時，所選的匯出內容會交給你選擇的服務或接收者，其後續處理由該第三方的政策規範。"]],["6. 權限",["DiveTone 只要求讀取你允許的照片與影片，以及將輸出新增至照片圖庫所需的權限。App 不要求裝置目前位置、聯絡人、麥克風、廣告識別碼或追蹤權限。你可隨時在 iOS「設定」中變更照片權限，但部分功能可能因此無法使用。"]],["7. 保存與刪除",["刪除 DiveTone 專案會清除該專案的參數、手動遮罩及縮圖，但不會刪除照片圖庫中的原始媒體或已匯出副本。刪除浮水印會清除其設定與 App 內圖片。移除 App 通常會移除其本機沙盒資料；已存到 Photos、Files、iCloud 備份或第三方服務的副本須在相應位置管理。","DiveTone 開發者無法查看或遠端刪除只存在你裝置上的資料。"]],["8. 資料蒐集、追蹤與兒童",["DiveTone 開發者不蒐集 App 使用資料、不建立使用者檔案，也不出售資料或進行跨公司追蹤。App 沒有針對兒童蒐集個人資料的功能。"]],["9. 你的權利與安全",["你可透過下方信箱詢問本政策。由於開發者不持有你的裝置端內容，存取、更正與刪除通常需由你在 App、Photos、Files、iCloud 或相應第三方服務中操作。適用法律賦予你的隱私與消費者權利不受本政策限制。","DiveTone 使用 iOS 沙盒及系統權限保護本機資料，但任何儲存方式都無法保證絕對安全。"]],["10. 政策更新與聯絡方式",["功能或法律要求變更時，本政策可能更新。重大變更會透過 App、網站或版本說明告知，頁首會顯示最新生效日期。","聯絡信箱：{email}"]]]},
"zh-Hans":{title:"DiveTone 隐私权政策",updated:"生效日期：2026 年 8 月 9 日",label:"语言",intro:"DiveTone 重视你的隐私。本政策说明 App 在你使用水下照片与视频编辑功能时如何处理信息。DiveTone 没有账户系统、广告、跨 App 跟踪、分析 SDK 或开发者运营的影像服务器。",sections:[["1. DiveTone 处理的数据",["当你主动选择媒体时，App 会读取照片或视频内容，以及可能包含的拍摄日期、GPS、文件名、格式、EXIF、TIFF、IPTC 与 QuickTime 元数据。这些信息用于显示媒体信息、排序和分组、调色、导出及保留你选择的元数据。","你可以在导出时选择完整保留、移除 GPS，或移除所有照片信息。"]],["2. 设备端影像处理",["调色、主体自动检测、手动主体标记、黑背景效果、裁切、水印与影像编码均在设备上执行。主体检测使用 Apple Vision 系统框架；照片或蒙版不会传送至 DiveTone 开发者的服务器。"]],["3. 本地存储",["App 会在设备内保存相册资源标识符、编辑参数、日期、GPS、格式、偏好设置、摄影者名称、水印设置、手动画出的主体蒙版、缩略图、地名缓存及每日导出次数。原始媒体通常仍保存在系统照片图库中。","Documents、Application Support 与偏好数据可能依据设备设置包含在 Apple 设备或 iCloud 备份中；缩略图缓存可由系统自动清除。"]],["4. Apple 服务与网络连接",["若所选媒体只存在于 iCloud Photos，PhotoKit 可能通过 Apple 服务下载媒体。StoreKit 由 Apple 处理 Pro 商品价格、购买、资格验证与恢复购买。DiveTone 不会取得你的 Apple ID、支付卡信息或完整订单数据。","照片包含 GPS 时，App 可能把坐标交给 Apple MapKit／Core Location 的反向地理编码服务以取得大致国家、城市或海域名称，并在设备上缓存结果及约 100 米精度的坐标。Apple 的处理受其隐私政策约束。"]],["5. Google Maps、分享与外部服务",["仅当你主动点击“在 Google Maps 显示”时，照片坐标才会放入 Google Maps 网址并由 Google 处理。","使用分享、AirDrop、存储到文件或其他 App 时，导出内容会交给你选择的服务或接收者，后续处理受第三方政策约束。"]],["6. 权限",["DiveTone 仅请求读取你允许的照片和视频，以及将输出添加到照片图库所需的权限。App 不请求设备当前位置、联系人、麦克风、广告标识符或跟踪权限。你可随时在 iOS“设置”中更改照片权限。"]],["7. 保留与删除",["删除 DiveTone 项目会清除其参数、手动蒙版和缩略图，但不会删除图库原始媒体或已导出副本。删除水印会清除其设置和 App 内图片。移除 App 通常会移除本地沙盒数据；Photos、Files、iCloud 备份或第三方服务中的副本须在相应位置管理。","DiveTone 开发者无法查看或远程删除只存在于你设备上的数据。"]],["8. 数据收集、跟踪与儿童",["DiveTone 开发者不收集 App 使用数据、不建立用户档案，也不出售数据或进行跨公司跟踪。App 没有面向儿童收集个人数据的功能。"]],["9. 你的权利与安全",["你可通过下方邮箱咨询本政策。由于开发者不持有你的设备端内容，访问、更正和删除通常由你在 App、Photos、Files、iCloud 或相应第三方服务中操作。适用法律赋予的权利不受限制。","DiveTone 使用 iOS 沙盒及系统权限保护本地数据，但任何存储方式都无法保证绝对安全。"]],["10. 更新与联系方式",["功能或法律要求变化时，本政策可能更新。重大变化会通过 App、网站或版本说明告知。","联系邮箱：{email}"]]]},
"en":{title:"DiveTone Privacy Policy",updated:"Effective: August 9, 2026",label:"Language",intro:"DiveTone respects your privacy. This policy explains how information is handled when you edit underwater photos and videos. DiveTone has no account system, advertising, cross-app tracking, analytics SDK, or developer-operated image server.",sections:[["1. Data processed by DiveTone",["When you select media, the app reads the photo or video and available metadata such as capture date, GPS, filename, format, EXIF, TIFF, IPTC, and QuickTime fields. This supports media information, sorting and grouping, editing, export, and preservation of metadata you choose.","At export, you can keep all metadata, remove GPS, or remove all photo information."]],["2. On-device image processing",["Color correction, automatic subject detection, manual subject marking, black-background effects, cropping, watermarking, and encoding run on your device. Subject detection uses Apple's Vision framework. Photos and masks are not sent to a DiveTone developer server."]],["3. Local storage",["The app stores photo-library asset identifiers, edit parameters, dates, GPS coordinates, formats, preferences, photographer name, watermark settings, manually edited masks, thumbnails, place-name cache, and daily export counts on the device. Original media normally remains in the system photo library.","Documents, Application Support, and preferences may be included in Apple device or iCloud backups according to your settings. The system may remove thumbnail caches."]],["4. Apple services and network access",["If selected media exists only in iCloud Photos, PhotoKit may download it through Apple services. Apple StoreKit handles Pro pricing, purchases, entitlement verification, and restoration. DiveTone does not receive your Apple ID, payment-card details, or full order record.","When a photo contains GPS, the app may send that coordinate to Apple MapKit/Core Location reverse-geocoding services to obtain an approximate country, city, or sea-area name. The result and a coordinate rounded to roughly 100 meters are cached on device. Apple's handling is governed by Apple's privacy policy."]],["5. Google Maps, sharing, and external services",["Only when you choose “Show in Google Maps” is the photo coordinate placed in a Google Maps URL and handled by Google.","When you use Share, AirDrop, Save to Files, or another app, the exported content is provided to your chosen service or recipient and is then governed by that party's practices."]],["6. Permissions",["DiveTone requests only access to photos and videos you allow and permission to add exports to the photo library. It does not request current device location, contacts, microphone, advertising identifier, or tracking permission. You can change Photos access in iOS Settings, though some features may stop working."]],["7. Retention and deletion",["Deleting a DiveTone project removes its parameters, manual mask, and thumbnail, but not the original library media or exported copies. Deleting a watermark removes its settings and in-app image. Removing the app normally removes sandboxed local data. Copies in Photos, Files, iCloud backup, or third-party services must be managed there.","The DiveTone developer cannot view or remotely delete information that exists only on your device."]],["8. Collection, tracking, and children",["The DiveTone developer does not collect app-usage data, build user profiles, sell data, or track users across companies. The app has no feature designed to collect children's personal data."]],["9. Your rights and security",["Contact us below with policy questions. Because the developer does not hold your on-device content, access, correction, and deletion are generally performed by you in DiveTone, Photos, Files, iCloud, or the relevant external service. Rights granted by applicable privacy and consumer law remain unaffected.","DiveTone uses the iOS sandbox and system permissions to protect local information, but no storage method can guarantee absolute security."]],["10. Changes and contact",["This policy may change when features or legal requirements change. Material updates will be communicated through the app, website, or release notes, and the effective date above will be revised.","Contact: {email}"]]]},
"ja":{title:"DiveTone プライバシーポリシー",updated:"施行日：2026年8月9日",label:"言語",intro:"DiveTone はプライバシーを尊重します。本ポリシーは、水中写真・動画の編集時に情報がどのように処理されるかを説明します。アカウント、広告、アプリ横断追跡、分析 SDK、開発者運営の画像サーバーはありません。",sections:[["1. 処理するデータ",["選択した写真・動画と、撮影日時、GPS、ファイル名、形式、EXIF、TIFF、IPTC、QuickTime メタデータを読み取り、情報表示、整理、編集、書き出しに利用します。","書き出し時に、全情報を保持、GPS を削除、全メタデータを削除から選べます。"]],["2. 端末内処理",["色補正、被写体の自動検出と手動指定、黒背景、切り抜き、透かし、エンコードは端末内で実行します。Apple Vision を使用し、写真やマスクを開発者サーバーへ送信しません。"]],["3. 端末内の保存",["写真アセット識別子、編集設定、日時、GPS、形式、各種設定、撮影者名、透かし、手動マスク、サムネイル、地名キャッシュ、日次書き出し回数を端末に保存します。原本は通常「写真」に残ります。","設定により Documents、Application Support、環境設定が Apple の端末／iCloud バックアップに含まれる場合があります。"]],["4. Apple サービス",["媒体が iCloud Photos のみにある場合、PhotoKit が Apple 経由でダウンロードします。購入と復元は StoreKit が処理し、DiveTone は Apple ID、カード情報、完全な注文情報を取得しません。","GPS 付き写真では、概略地名を得るため座標を Apple の逆ジオコーディングへ送る場合があります。結果と約100m単位の座標を端末にキャッシュします。"]],["5. Google Maps と共有",["「Google Maps で表示」を選んだ場合のみ座標が Google Maps URL に渡されます。共有、AirDrop、ファイル保存、他 App を選ぶと、その後は選択先の方針が適用されます。"]],["6. 権限",["許可した写真・動画の読み取りと書き出し追加だけを要求します。現在地、連絡先、マイク、広告 ID、追跡権限は要求しません。"]],["7. 保持と削除",["プロジェクト削除で設定、手動マスク、サムネイルは消えますが、原本と書き出し済みコピーは消えません。App の削除で通常ローカルデータは削除されます。外部保存先のコピーは各サービスで管理してください。開発者は端末内データを閲覧・遠隔削除できません。"]],["8. 収集・追跡・子ども",["開発者は利用データを収集せず、プロファイル作成、販売、企業横断追跡を行いません。子どもの個人情報を収集する機能もありません。"]],["9. 権利と安全",["お問い合わせは下記へ。端末内内容の確認・修正・削除は、DiveTone、写真、Files、iCloud または外部サービスで行います。法定の権利は制限されません。iOS のサンドボックスを使用しますが、絶対的安全は保証できません。"]],["10. 更新と連絡先",["機能や法令の変更に応じて改定し、重要な変更は App、サイトまたはリリースノートで案内します。","連絡先：{email}"]]]},
"ko":{title:"DiveTone 개인정보 처리방침",updated:"시행일: 2026년 8월 9일",label:"언어",intro:"DiveTone은 개인정보를 존중합니다. 본 방침은 수중 사진과 동영상을 편집할 때 정보가 처리되는 방식을 설명합니다. 계정, 광고, 앱 간 추적, 분석 SDK 또는 개발자 운영 이미지 서버가 없습니다.",sections:[["1. 처리하는 데이터",["선택한 사진·동영상과 촬영일, GPS, 파일명, 형식, EXIF, TIFF, IPTC, QuickTime 메타데이터를 정보 표시, 정렬, 편집 및 내보내기에 사용합니다.","내보낼 때 전체 정보 유지, GPS 제거 또는 모든 사진 정보 제거를 선택할 수 있습니다."]],["2. 기기 내 처리",["색 보정, 자동 피사체 감지, 수동 표시, 검은 배경, 자르기, 워터마크 및 인코딩은 기기에서 실행됩니다. Apple Vision을 사용하며 사진이나 마스크를 개발자 서버로 보내지 않습니다."]],["3. 로컬 저장",["사진 자산 식별자, 편집값, 날짜, GPS, 형식, 환경설정, 촬영자 이름, 워터마크, 수동 마스크, 썸네일, 지명 캐시와 일일 내보내기 횟수를 기기에 저장합니다. 원본은 보통 사진 보관함에 남습니다.","설정에 따라 일부 데이터가 Apple 기기 또는 iCloud 백업에 포함될 수 있습니다."]],["4. Apple 서비스",["미디어가 iCloud Photos에만 있으면 PhotoKit이 Apple을 통해 내려받을 수 있습니다. StoreKit이 가격, 구매, 자격 확인과 복원을 처리하며 DiveTone은 Apple ID, 카드 또는 전체 주문 정보를 받지 않습니다.","GPS 사진의 대략적인 지명을 얻기 위해 좌표를 Apple 역지오코딩 서비스로 보낼 수 있으며 결과와 약 100m 단위 좌표를 기기에 캐시합니다."]],["5. Google Maps 및 공유",["사용자가 Google Maps 표시를 선택할 때만 좌표가 Google URL로 전달됩니다. 공유, AirDrop, Files 또는 다른 앱으로 보낸 후에는 해당 서비스의 정책이 적용됩니다."]],["6. 권한",["허용한 사진·동영상 접근과 보관함 추가 권한만 요청합니다. 현재 위치, 연락처, 마이크, 광고 ID 또는 추적 권한은 요청하지 않습니다."]],["7. 보관 및 삭제",["프로젝트 삭제 시 설정, 수동 마스크와 썸네일은 삭제되지만 원본과 내보낸 사본은 삭제되지 않습니다. 앱 제거 시 로컬 샌드박스 데이터는 일반적으로 삭제됩니다. 외부 사본은 해당 위치에서 관리해야 하며 개발자는 기기 데이터를 원격으로 볼 수 없습니다."]],["8. 수집·추적·아동",["개발자는 사용 데이터를 수집하거나 사용자 프로필을 만들고 판매하거나 회사 간 추적을 하지 않습니다. 아동 개인정보 수집 기능이 없습니다."]],["9. 권리와 보안",["문의는 아래 이메일로 보내주세요. 기기 내 정보의 열람·수정·삭제는 사용자가 앱 또는 저장 서비스에서 수행합니다. 법적 권리는 제한되지 않습니다. iOS 샌드박스를 사용하지만 절대적 보안을 보장할 수는 없습니다."]],["10. 변경 및 연락",["기능 또는 법률 변경 시 개정되며 중요한 변경은 앱, 웹사이트 또는 릴리스 노트로 알립니다.","연락처: {email}"]]]},
"es":{title:"Política de privacidad de DiveTone",updated:"Vigente desde el 9 de agosto de 2026",label:"Idioma",intro:"DiveTone respeta tu privacidad. Esta política explica el tratamiento de la información al editar fotos y vídeos submarinos. No hay cuentas, publicidad, seguimiento entre apps, SDK de analítica ni servidor de imágenes operado por el desarrollador.",sections:[["1. Datos procesados",["La app lee los medios que eliges y metadatos disponibles como fecha, GPS, nombre, formato, EXIF, TIFF, IPTC y QuickTime para mostrar información, organizar, editar y exportar.","Al exportar puedes conservar todo, eliminar el GPS o eliminar toda la información de la foto."]],["2. Procesamiento en el dispositivo",["La corrección, detección automática y marcado manual del sujeto, fondo negro, recorte, marca de agua y codificación se ejecutan en tu dispositivo mediante marcos de Apple. Las imágenes y máscaras no se envían a un servidor de DiveTone."]],["3. Almacenamiento local",["Se guardan localmente identificadores de Fotos, ajustes, fechas, GPS, formatos, preferencias, nombre del fotógrafo, marcas de agua, máscaras manuales, miniaturas, caché de lugares y cuotas diarias. Los originales permanecen normalmente en Fotos.","Según tu configuración, ciertos datos pueden incluirse en copias del dispositivo o iCloud de Apple."]],["4. Servicios de Apple",["PhotoKit puede descargar desde iCloud Photos. StoreKit gestiona precios, compras, verificación y restauración; DiveTone no recibe tu Apple ID, tarjeta ni pedido completo.","Para obtener un lugar aproximado, las coordenadas GPS pueden enviarse a la geocodificación inversa de Apple. El resultado y coordenadas redondeadas a unos 100 m se guardan localmente."]],["5. Google Maps y compartir",["Solo al elegir mostrar en Google Maps se incluye la coordenada en una URL de Google. Al compartir, usar AirDrop, Files u otra app, se aplican las prácticas del destino elegido."]],["6. Permisos",["Solo se solicita acceso a los medios autorizados y permiso para añadir exportaciones. No se pide ubicación actual, contactos, micrófono, identificador publicitario ni seguimiento."]],["7. Conservación y eliminación",["Eliminar un proyecto borra ajustes, máscara y miniatura, no el original ni copias exportadas. Desinstalar la app normalmente borra sus datos locales; las copias externas deben eliminarse en su destino. El desarrollador no puede ver ni borrar remotamente datos solo presentes en tu dispositivo."]],["8. Recopilación, seguimiento y menores",["El desarrollador no recopila uso, crea perfiles, vende datos ni realiza seguimiento entre empresas. La app no está diseñada para recopilar datos personales de menores."]],["9. Derechos y seguridad",["Contacta abajo para consultas. El acceso, corrección y eliminación de contenido local los realizas en la app o servicio correspondiente. Tus derechos legales no se limitan. Se usa el entorno seguro de iOS, sin que ningún método garantice seguridad absoluta."]],["10. Cambios y contacto",["Podemos actualizar esta política y comunicar cambios relevantes en la app, web o notas de versión.","Contacto: {email}"]]]},
"fr":{title:"Politique de confidentialité de DiveTone",updated:"En vigueur le 9 août 2026",label:"Langue",intro:"DiveTone respecte votre vie privée. Cette politique décrit le traitement des informations lors de l’édition de photos et vidéos sous-marines. Il n’existe ni compte, publicité, suivi inter-apps, SDK analytique ni serveur d’images exploité par le développeur.",sections:[["1. Données traitées",["L’app lit les médias choisis et leurs métadonnées disponibles : date, GPS, nom, format, EXIF, TIFF, IPTC et QuickTime, afin d’afficher, classer, modifier et exporter.","À l’export, vous pouvez tout conserver, supprimer le GPS ou toutes les informations de la photo."]],["2. Traitement sur l’appareil",["Correction, détection automatique et marquage manuel du sujet, fond noir, recadrage, filigrane et encodage sont effectués sur l’appareil avec les frameworks Apple. Images et masques ne sont pas envoyés à un serveur DiveTone."]],["3. Stockage local",["Identifiants Photos, réglages, dates, GPS, formats, préférences, nom du photographe, filigranes, masques manuels, miniatures, cache de lieux et quotas quotidiens sont stockés localement. Les originaux restent normalement dans Photos.","Selon vos réglages, certaines données peuvent figurer dans les sauvegardes Apple de l’appareil ou iCloud."]],["4. Services Apple",["PhotoKit peut télécharger un média depuis iCloud Photos. StoreKit gère prix, achat, vérification et restauration ; DiveTone ne reçoit ni Apple ID, carte bancaire ni commande complète.","Pour obtenir un lieu approximatif, les coordonnées GPS peuvent être envoyées au géocodage inverse Apple. Le résultat et des coordonnées arrondies à environ 100 m sont mis en cache localement."]],["5. Google Maps et partage",["La coordonnée n’est placée dans une URL Google Maps que si vous choisissez cette action. Après partage, AirDrop, Files ou une autre app, les règles du destinataire s’appliquent."]],["6. Autorisations",["Seuls l’accès aux médias autorisés et l’ajout d’exports sont demandés. L’app ne demande pas la position actuelle, les contacts, le micro, l’identifiant publicitaire ou le suivi."]],["7. Conservation et suppression",["Supprimer un projet efface ses réglages, masque et miniature, pas l’original ni les exports. Désinstaller l’app supprime normalement ses données locales ; gérez les copies externes à leur emplacement. Le développeur ne peut consulter ni supprimer à distance les données uniquement présentes sur l’appareil."]],["8. Collecte, suivi et enfants",["Le développeur ne collecte pas l’usage, ne crée pas de profil, ne vend pas de données et ne suit pas entre entreprises. Aucune fonction ne vise à collecter les données d’enfants."]],["9. Droits et sécurité",["Contactez-nous ci-dessous. L’accès, la correction et la suppression des contenus locaux s’effectuent par vous dans l’app ou le service concerné. Vos droits légaux demeurent. Le bac à sable iOS protège les données sans garantie absolue."]],["10. Modifications et contact",["Cette politique peut évoluer ; les changements importants seront annoncés dans l’app, sur le site ou dans les notes de version.","Contact : {email}"]]]},
"de":{title:"DiveTone-Datenschutzerklärung",updated:"Gültig ab 9. August 2026",label:"Sprache",intro:"DiveTone respektiert Ihre Privatsphäre. Diese Erklärung beschreibt die Verarbeitung beim Bearbeiten von Unterwasserfotos und -videos. Es gibt keine Konten, Werbung, appübergreifende Verfolgung, Analyse-SDKs oder vom Entwickler betriebenen Bildserver.",sections:[["1. Verarbeitete Daten",["Die App liest ausgewählte Medien und verfügbare Metadaten wie Datum, GPS, Name, Format, EXIF, TIFF, IPTC und QuickTime zur Anzeige, Organisation, Bearbeitung und Ausgabe.","Beim Export können Sie alle Angaben behalten, GPS oder sämtliche Fotoinformationen entfernen."]],["2. Verarbeitung auf dem Gerät",["Korrektur, automatische Motiverkennung, manuelle Markierung, schwarzer Hintergrund, Zuschnitt, Wasserzeichen und Kodierung erfolgen auf dem Gerät mit Apple-Frameworks. Bilder und Masken werden nicht an einen DiveTone-Server gesendet."]],["3. Lokale Speicherung",["Fotos-Kennungen, Einstellungen, Datum, GPS, Formate, Präferenzen, Fotografenname, Wasserzeichen, manuelle Masken, Vorschaubilder, Ortscache und Tageskontingente werden lokal gespeichert. Originale bleiben normalerweise in Fotos.","Je nach Einstellungen können Daten in Apple-Geräte- oder iCloud-Backups enthalten sein."]],["4. Apple-Dienste",["PhotoKit kann Medien aus iCloud Photos laden. StoreKit verarbeitet Preis, Kauf, Prüfung und Wiederherstellung; DiveTone erhält weder Apple-ID noch Karten- oder vollständige Bestelldaten.","Für ungefähre Ortsnamen können GPS-Koordinaten an Apples Rückwärts-Geocodierung gesendet werden. Ergebnis und auf etwa 100 m gerundete Koordinaten werden lokal gespeichert."]],["5. Google Maps und Teilen",["Nur wenn Sie Google Maps wählen, wird die Koordinate in eine Google-URL eingefügt. Bei Teilen, AirDrop, Files oder anderen Apps gelten anschließend deren Regeln."]],["6. Berechtigungen",["Angefordert werden nur erlaubte Medien und das Hinzufügen von Exporten. Nicht angefordert werden aktueller Standort, Kontakte, Mikrofon, Werbe-ID oder Tracking."]],["7. Aufbewahrung und Löschung",["Das Löschen eines Projekts entfernt Einstellungen, Maske und Vorschau, nicht Originale oder Exporte. Beim Entfernen der App werden lokale Daten normalerweise gelöscht; externe Kopien sind dort zu verwalten. Der Entwickler kann reine Gerätedaten nicht einsehen oder fernlöschen."]],["8. Erhebung, Tracking und Kinder",["Der Entwickler erhebt keine Nutzungsdaten, erstellt keine Profile, verkauft keine Daten und betreibt kein unternehmensübergreifendes Tracking. Es gibt keine Funktion zur Erhebung von Kinderdaten."]],["9. Rechte und Sicherheit",["Kontaktieren Sie uns unten. Lokale Inhalte verwalten Sie in der App oder dem jeweiligen Dienst. Gesetzliche Rechte bleiben unberührt. Die iOS-Sandbox schützt Daten, absolute Sicherheit kann jedoch nicht garantiert werden."]],["10. Änderungen und Kontakt",["Wichtige Aktualisierungen werden in App, Website oder Versionshinweisen bekanntgegeben.","Kontakt: {email}"]]]},
"it":{title:"Informativa sulla privacy di DiveTone",updated:"In vigore dal 9 agosto 2026",label:"Lingua",intro:"DiveTone rispetta la tua privacy. Questa informativa descrive il trattamento durante la modifica di foto e video subacquei. Non sono presenti account, pubblicità, tracciamento tra app, SDK analitici o server di immagini gestiti dallo sviluppatore.",sections:[["1. Dati trattati",["L’app legge i contenuti scelti e i metadati disponibili: data, GPS, nome, formato, EXIF, TIFF, IPTC e QuickTime, per visualizzare, organizzare, modificare ed esportare.","All’esportazione puoi mantenere tutto, rimuovere il GPS o tutte le informazioni della foto."]],["2. Elaborazione sul dispositivo",["Correzione, rilevamento automatico e selezione manuale del soggetto, sfondo nero, ritaglio, filigrana e codifica avvengono sul dispositivo con framework Apple. Immagini e maschere non vengono inviate a server DiveTone."]],["3. Archiviazione locale",["Identificatori Foto, regolazioni, date, GPS, formati, preferenze, nome fotografo, filigrane, maschere manuali, miniature, cache dei luoghi e quote giornaliere sono locali. Gli originali restano normalmente in Foto.","Secondo le impostazioni, alcuni dati possono rientrare nei backup Apple del dispositivo o iCloud."]],["4. Servizi Apple",["PhotoKit può scaricare da iCloud Photos. StoreKit gestisce prezzi, acquisti, verifica e ripristino; DiveTone non riceve Apple ID, carta o ordine completo.","Per un luogo approssimativo, le coordinate GPS possono essere inviate alla geocodifica inversa Apple. Risultato e coordinate arrotondate a circa 100 m vengono memorizzati localmente."]],["5. Google Maps e condivisione",["La coordinata passa a un URL Google Maps solo su tua scelta. Dopo Condividi, AirDrop, Files o un’altra app si applicano le regole del destinatario."]],["6. Autorizzazioni",["Sono richiesti solo accesso ai media consentiti e aggiunta degli export. Non sono richiesti posizione attuale, contatti, microfono, ID pubblicitario o tracciamento."]],["7. Conservazione e cancellazione",["Eliminare un progetto rimuove regolazioni, maschera e miniatura, non originali o export. Disinstallare normalmente rimuove i dati locali; le copie esterne vanno gestite nella loro destinazione. Lo sviluppatore non può vedere o cancellare da remoto dati solo sul dispositivo."]],["8. Raccolta, tracciamento e minori",["Lo sviluppatore non raccoglie utilizzo, crea profili, vende dati o traccia tra aziende. Nessuna funzione raccoglie intenzionalmente dati di minori."]],["9. Diritti e sicurezza",["Contattaci sotto. Accesso, correzione e cancellazione dei contenuti locali sono gestiti da te nell’app o servizio pertinente. I diritti di legge restano invariati. La sandbox iOS protegge i dati senza garanzia assoluta."]],["10. Modifiche e contatti",["Gli aggiornamenti importanti saranno comunicati nell’app, sul sito o nelle note di versione.","Contatto: {email}"]]]},
"pt-BR":{title:"Política de Privacidade do DiveTone",updated:"Vigente em 9 de agosto de 2026",label:"Idioma",intro:"O DiveTone respeita sua privacidade. Esta política explica o tratamento ao editar fotos e vídeos subaquáticos. Não há contas, anúncios, rastreamento entre apps, SDK de análise nem servidor de imagens operado pelo desenvolvedor.",sections:[["1. Dados processados",["O app lê a mídia escolhida e metadados disponíveis como data, GPS, nome, formato, EXIF, TIFF, IPTC e QuickTime para exibir, organizar, editar e exportar.","Na exportação, você pode manter tudo, remover o GPS ou todas as informações da foto."]],["2. Processamento no dispositivo",["Correção, detecção automática e marcação manual do assunto, fundo preto, corte, marca-d’água e codificação ocorrem no dispositivo com frameworks Apple. Imagens e máscaras não vão para servidor do DiveTone."]],["3. Armazenamento local",["Identificadores do Fotos, ajustes, datas, GPS, formatos, preferências, nome do fotógrafo, marcas-d’água, máscaras manuais, miniaturas, cache de locais e cotas diárias ficam localmente. Originais normalmente permanecem no Fotos.","Conforme seus ajustes, dados podem integrar backups Apple do aparelho ou iCloud."]],["4. Serviços Apple",["PhotoKit pode baixar mídia do iCloud Photos. StoreKit cuida de preço, compra, verificação e restauração; DiveTone não recebe Apple ID, cartão ou pedido completo.","Para obter local aproximado, coordenadas GPS podem ser enviadas à geocodificação reversa Apple. Resultado e coordenadas arredondadas para cerca de 100 m ficam em cache local."]],["5. Google Maps e compartilhamento",["A coordenada só entra em URL do Google Maps quando você escolhe essa opção. Após Compartilhar, AirDrop, Files ou outro app, valem as práticas do destino."]],["6. Permissões",["Só são solicitados acesso à mídia permitida e inclusão de exportações. Não pedimos localização atual, contatos, microfone, ID de publicidade ou rastreamento."]],["7. Retenção e exclusão",["Excluir projeto remove ajustes, máscara e miniatura, não original ou exportações. Desinstalar normalmente remove dados locais; cópias externas devem ser geridas no destino. O desenvolvedor não vê nem apaga remotamente dados apenas no aparelho."]],["8. Coleta, rastreamento e crianças",["O desenvolvedor não coleta uso, cria perfis, vende dados ou rastreia entre empresas. Não há função voltada à coleta de dados infantis."]],["9. Direitos e segurança",["Fale conosco abaixo. Você gerencia conteúdo local no app ou serviço correspondente. Direitos legais permanecem. A sandbox do iOS protege os dados, sem garantia absoluta."]],["10. Alterações e contato",["Mudanças relevantes serão informadas no app, site ou notas da versão.","Contato: {email}"]]]},
"pt-PT":{title:"Política de Privacidade do DiveTone",updated:"Em vigor desde 9 de agosto de 2026",label:"Idioma",intro:"O DiveTone respeita a sua privacidade. Esta política explica o tratamento ao editar fotografias e vídeos subaquáticos. Não existem contas, publicidade, seguimento entre aplicações, SDK analítico nem servidor de imagens operado pelo programador.",sections:[["1. Dados tratados",["A aplicação lê os conteúdos escolhidos e metadados disponíveis, como data, GPS, nome, formato, EXIF, TIFF, IPTC e QuickTime, para apresentar, organizar, editar e exportar.","Na exportação pode manter tudo, remover o GPS ou todas as informações da fotografia."]],["2. Tratamento no dispositivo",["Correção, deteção automática e marcação manual do motivo, fundo preto, recorte, marca de água e codificação ocorrem no dispositivo com frameworks Apple. Imagens e máscaras não são enviadas a um servidor DiveTone."]],["3. Armazenamento local",["Identificadores de Fotografias, ajustes, datas, GPS, formatos, preferências, nome do fotógrafo, marcas de água, máscaras manuais, miniaturas, cache de locais e limites diários são locais. Os originais permanecem normalmente em Fotografias.","Consoante as definições, dados podem integrar cópias Apple do dispositivo ou iCloud."]],["4. Serviços Apple",["O PhotoKit pode descarregar de iCloud Photos. O StoreKit gere preço, compra, verificação e restauro; o DiveTone não recebe Apple ID, cartão ou encomenda completa.","Para obter um local aproximado, coordenadas GPS podem ser enviadas à geocodificação inversa Apple. O resultado e coordenadas arredondadas a cerca de 100 m ficam em cache local."]],["5. Google Maps e partilha",["A coordenada só é incluída num URL Google Maps quando escolhe essa opção. Após Partilhar, AirDrop, Files ou outra aplicação, aplicam-se as práticas do destino."]],["6. Permissões",["Apenas são pedidos acesso aos conteúdos permitidos e adição de exportações. Não pedimos localização atual, contactos, microfone, ID publicitário ou seguimento."]],["7. Conservação e eliminação",["Eliminar um projeto remove ajustes, máscara e miniatura, não originais ou exportações. Desinstalar normalmente remove dados locais; cópias externas são geridas no destino. O programador não pode ver ou apagar remotamente dados apenas no dispositivo."]],["8. Recolha, seguimento e crianças",["O programador não recolhe utilização, cria perfis, vende dados ou segue entre empresas. Não há função destinada a recolher dados de crianças."]],["9. Direitos e segurança",["Contacte-nos abaixo. Gere os conteúdos locais na aplicação ou serviço relevante. Os direitos legais mantêm-se. A sandbox iOS protege os dados, sem garantia absoluta."]],["10. Alterações e contacto",["Alterações relevantes serão comunicadas na aplicação, site ou notas da versão.","Contacto: {email}"]]]},
"nl":{title:"Privacybeleid van DiveTone",updated:"Geldig vanaf 9 augustus 2026",label:"Taal",intro:"DiveTone respecteert je privacy. Dit beleid beschrijft de verwerking bij het bewerken van onderwaterfoto’s en -video’s. Er zijn geen accounts, advertenties, app-overstijgende tracking, analytics-SDK’s of door de ontwikkelaar beheerde beeldservers.",sections:[["1. Verwerkte gegevens",["De app leest gekozen media en beschikbare metadata zoals datum, GPS, naam, formaat, EXIF, TIFF, IPTC en QuickTime voor weergave, ordening, bewerking en export.","Bij export kun je alles behouden, GPS verwijderen of alle foto-informatie verwijderen."]],["2. Verwerking op het apparaat",["Correctie, automatische onderwerpdetectie, handmatige markering, zwarte achtergrond, uitsnede, watermerk en codering gebeuren op het apparaat met Apple-frameworks. Beelden en maskers gaan niet naar een DiveTone-server."]],["3. Lokale opslag",["Foto-ID’s, bewerkingen, datums, GPS, formaten, voorkeuren, fotograafnaam, watermerken, handmatige maskers, miniaturen, plaatscache en dagquota worden lokaal bewaard. Originelen blijven normaal in Foto’s.","Afhankelijk van instellingen kunnen gegevens in Apple-apparaat- of iCloud-reservekopieën staan."]],["4. Apple-diensten",["PhotoKit kan media uit iCloud Photos downloaden. StoreKit verwerkt prijs, aankoop, controle en herstel; DiveTone ontvangt geen Apple ID, kaart- of volledige bestelgegevens.","Voor een globale plaatsnaam kunnen GPS-coördinaten naar Apple reverse geocoding worden gestuurd. Het resultaat en tot circa 100 m afgeronde coördinaten worden lokaal gecachet."]],["5. Google Maps en delen",["Alleen wanneer je Google Maps kiest, komt de coördinaat in een Google-URL. Na delen, AirDrop, Files of een andere app gelden de regels van de bestemming."]],["6. Toestemmingen",["Alleen toegestane media en toevoegen van exports worden gevraagd. Geen huidige locatie, contacten, microfoon, advertentie-ID of tracking."]],["7. Bewaren en verwijderen",["Een project verwijderen wist instellingen, masker en miniatuur, niet het origineel of exports. De app verwijderen wist normaal lokale gegevens; externe kopieën beheer je daar. De ontwikkelaar kan apparaatdata niet op afstand bekijken of wissen."]],["8. Verzameling, tracking en kinderen",["De ontwikkelaar verzamelt geen gebruik, maakt geen profielen, verkoopt geen gegevens en volgt niet tussen bedrijven. Er is geen functie voor het verzamelen van kindergegevens."]],["9. Rechten en beveiliging",["Neem hieronder contact op. Lokale inhoud beheer je in de app of betreffende dienst. Wettelijke rechten blijven gelden. De iOS-sandbox beschermt gegevens zonder absolute garantie."]],["10. Wijzigingen en contact",["Belangrijke wijzigingen worden gemeld in app, website of versienotities.","Contact: {email}"]]]},
"th":{title:"นโยบายความเป็นส่วนตัว DiveTone",updated:"มีผลวันที่ 9 สิงหาคม 2026",label:"ภาษา",intro:"DiveTone เคารพความเป็นส่วนตัวของคุณ นโยบายนี้อธิบายการประมวลผลเมื่อแก้ไขภาพและวิดีโอใต้น้ำ ไม่มีบัญชี โฆษณา การติดตามข้ามแอป SDK วิเคราะห์ หรือเซิร์ฟเวอร์ภาพของผู้พัฒนา",sections:[["1. ข้อมูลที่ประมวลผล",["แอปอ่านสื่อที่คุณเลือกและข้อมูลกำกับ เช่น วันที่ GPS ชื่อไฟล์ รูปแบบ EXIF, TIFF, IPTC และ QuickTime เพื่อแสดง จัดกลุ่ม แก้ไข และส่งออก","เมื่อส่งออก คุณเลือกเก็บทั้งหมด ลบ GPS หรือลบข้อมูลภาพทั้งหมดได้"]],["2. การประมวลผลบนอุปกรณ์",["การปรับสี ตรวจจับและทำเครื่องหมายตัวแบบ พื้นหลังดำ ครอบตัด ลายน้ำ และเข้ารหัสทำบนอุปกรณ์ด้วยเฟรมเวิร์ก Apple ภาพและมาสก์ไม่ถูกส่งไปเซิร์ฟเวอร์ DiveTone"]],["3. การเก็บในเครื่อง",["รหัสทรัพยากร ค่าปรับ วันที่ GPS รูปแบบ การตั้งค่า ชื่อช่างภาพ ลายน้ำ มาสก์ ภาพย่อ แคชชื่อสถานที่ และโควตารายวันเก็บในอุปกรณ์ ต้นฉบับมักอยู่ใน Photos","ข้อมูลบางส่วนอาจอยู่ในข้อมูลสำรองอุปกรณ์หรือ iCloud ตามการตั้งค่าของคุณ"]],["4. บริการ Apple",["PhotoKit อาจดาวน์โหลดจาก iCloud Photos และ StoreKit จัดการราคา ซื้อ ตรวจสอบ และกู้คืน DiveTone ไม่ได้รับ Apple ID บัตร หรือรายการสั่งซื้อเต็ม","พิกัด GPS อาจส่งให้บริการแปลงพิกัดของ Apple เพื่อหาชื่อสถานที่โดยประมาณ และเก็บผลกับพิกัดระดับประมาณ 100 ม. ในเครื่อง"]],["5. Google Maps และการแชร์",["พิกัดจะไปใน URL Google Maps เฉพาะเมื่อคุณเลือกเท่านั้น หลังแชร์ AirDrop, Files หรือแอปอื่น จะใช้นโยบายของปลายทาง"]],["6. สิทธิ์",["ขอเฉพาะสื่อที่คุณอนุญาตและสิทธิ์เพิ่มผลงาน ไม่ขอตำแหน่งปัจจุบัน รายชื่อ ไมโครโฟน รหัสโฆษณา หรือการติดตาม"]],["7. การเก็บและลบ",["ลบโปรเจ็กต์จะลบค่า มาสก์ และภาพย่อ ไม่ลบต้นฉบับหรือสำเนาส่งออก การถอนแอปมักลบข้อมูลในเครื่อง สำเนาภายนอกต้องจัดการที่ปลายทาง ผู้พัฒนาไม่สามารถดูหรือลบข้อมูลบนอุปกรณ์จากระยะไกล"]],["8. การเก็บข้อมูล การติดตาม และเด็ก",["ผู้พัฒนาไม่เก็บข้อมูลการใช้งาน สร้างโปรไฟล์ ขายข้อมูล หรือติดตามข้ามบริษัท และไม่มีฟังก์ชันเก็บข้อมูลเด็ก"]],["9. สิทธิและความปลอดภัย",["ติดต่อด้านล่าง คุณจัดการข้อมูลในเครื่องผ่านแอปหรือบริการที่เกี่ยวข้อง สิทธิตามกฎหมายยังคงอยู่ iOS sandbox ช่วยปกป้องแต่ไม่รับประกันความปลอดภัยสมบูรณ์"]],["10. การเปลี่ยนแปลงและติดต่อ",["การเปลี่ยนแปลงสำคัญจะแจ้งผ่านแอป เว็บไซต์ หรือบันทึกรุ่น","ติดต่อ: {email}"]]]},
"id":{title:"Kebijakan Privasi DiveTone",updated:"Berlaku 9 Agustus 2026",label:"Bahasa",intro:"DiveTone menghormati privasi Anda. Kebijakan ini menjelaskan pemrosesan saat mengedit foto dan video bawah air. Tidak ada akun, iklan, pelacakan lintas aplikasi, SDK analitik, atau server gambar milik pengembang.",sections:[["1. Data yang diproses",["Aplikasi membaca media pilihan dan metadata seperti tanggal, GPS, nama, format, EXIF, TIFF, IPTC, dan QuickTime untuk tampilan, pengaturan, penyuntingan, dan ekspor.","Saat ekspor Anda dapat menyimpan semua, menghapus GPS, atau menghapus seluruh informasi foto."]],["2. Pemrosesan di perangkat",["Koreksi, deteksi subjek otomatis, penandaan manual, latar hitam, pemotongan, watermark, dan encoding berjalan di perangkat dengan framework Apple. Gambar dan mask tidak dikirim ke server DiveTone."]],["3. Penyimpanan lokal",["ID aset Foto, pengaturan edit, tanggal, GPS, format, preferensi, nama fotografer, watermark, mask manual, thumbnail, cache tempat, dan kuota harian disimpan lokal. Asli biasanya tetap di Foto.","Sesuai pengaturan, data tertentu dapat masuk cadangan perangkat Apple atau iCloud."]],["4. Layanan Apple",["PhotoKit dapat mengunduh dari iCloud Photos. StoreKit menangani harga, pembelian, verifikasi, dan pemulihan; DiveTone tidak menerima Apple ID, kartu, atau pesanan lengkap.","Untuk nama tempat perkiraan, koordinat GPS dapat dikirim ke reverse geocoding Apple. Hasil dan koordinat yang dibulatkan sekitar 100 m disimpan lokal."]],["5. Google Maps dan berbagi",["Koordinat hanya masuk URL Google Maps bila Anda memilihnya. Setelah Share, AirDrop, Files, atau aplikasi lain, kebijakan tujuan berlaku."]],["6. Izin",["Hanya akses media yang diizinkan dan penambahan ekspor yang diminta. Tidak meminta lokasi saat ini, kontak, mikrofon, ID iklan, atau pelacakan."]],["7. Retensi dan penghapusan",["Menghapus proyek menghapus pengaturan, mask, dan thumbnail, bukan asli atau ekspor. Menghapus aplikasi biasanya menghapus data lokal; salinan eksternal dikelola di tujuannya. Pengembang tidak dapat melihat atau menghapus data perangkat dari jarak jauh."]],["8. Pengumpulan, pelacakan, dan anak",["Pengembang tidak mengumpulkan penggunaan, membuat profil, menjual data, atau melacak lintas perusahaan. Tidak ada fitur untuk mengumpulkan data anak."]],["9. Hak dan keamanan",["Hubungi kami di bawah. Kelola konten lokal di aplikasi atau layanan terkait. Hak hukum tetap berlaku. Sandbox iOS melindungi data tanpa jaminan mutlak."]],["10. Perubahan dan kontak",["Perubahan penting diumumkan melalui aplikasi, situs, atau catatan rilis.","Kontak: {email}"]]]},
"ms":{title:"Dasar Privasi DiveTone",updated:"Berkuat kuasa 9 Ogos 2026",label:"Bahasa",intro:"DiveTone menghormati privasi anda. Dasar ini menerangkan pemprosesan semasa menyunting foto dan video bawah air. Tiada akaun, iklan, penjejakan merentas aplikasi, SDK analitik atau pelayan imej kendalian pembangun.",sections:[["1. Data yang diproses",["Aplikasi membaca media pilihan dan metadata seperti tarikh, GPS, nama, format, EXIF, TIFF, IPTC dan QuickTime untuk paparan, susunan, suntingan dan eksport.","Semasa eksport anda boleh mengekalkan semua, membuang GPS atau semua maklumat foto."]],["2. Pemprosesan pada peranti",["Pembetulan, pengesanan subjek automatik, tanda manual, latar hitam, pangkas, tera air dan pengekodan berlaku pada peranti dengan rangka kerja Apple. Imej dan topeng tidak dihantar ke pelayan DiveTone."]],["3. Storan setempat",["ID aset Foto, tetapan, tarikh, GPS, format, pilihan, nama jurugambar, tera air, topeng manual, lakaran kecil, cache tempat dan kuota harian disimpan setempat. Asal biasanya kekal dalam Foto.","Mengikut tetapan, data tertentu mungkin termasuk dalam sandaran peranti Apple atau iCloud."]],["4. Perkhidmatan Apple",["PhotoKit boleh memuat turun daripada iCloud Photos. StoreKit mengurus harga, pembelian, pengesahan dan pemulihan; DiveTone tidak menerima Apple ID, kad atau pesanan penuh.","Untuk nama tempat anggaran, koordinat GPS boleh dihantar kepada geokod songsang Apple. Hasil dan koordinat dibundarkan kira-kira 100 m dicache setempat."]],["5. Google Maps dan perkongsian",["Koordinat hanya dimasukkan dalam URL Google Maps apabila anda memilihnya. Selepas Kongsi, AirDrop, Files atau aplikasi lain, dasar destinasi terpakai."]],["6. Kebenaran",["Hanya media yang dibenarkan dan penambahan eksport diminta. Tiada lokasi semasa, kenalan, mikrofon, ID iklan atau penjejakan."]],["7. Penyimpanan dan pemadaman",["Memadam projek membuang tetapan, topeng dan lakaran kecil, bukan asal atau eksport. Membuang aplikasi biasanya memadam data setempat; salinan luar diurus di destinasinya. Pembangun tidak boleh melihat atau memadam data peranti dari jauh."]],["8. Pengumpulan, penjejakan dan kanak-kanak",["Pembangun tidak mengumpul penggunaan, membina profil, menjual data atau menjejak merentas syarikat. Tiada fungsi mengumpul data kanak-kanak."]],["9. Hak dan keselamatan",["Hubungi kami di bawah. Urus kandungan setempat dalam aplikasi atau perkhidmatan berkaitan. Hak undang-undang kekal. Kotak pasir iOS melindungi data tanpa jaminan mutlak."]],["10. Perubahan dan hubungan",["Perubahan penting diumumkan melalui aplikasi, laman atau nota keluaran.","Hubungan: {email}"]]]},
"fil":{title:"Patakaran sa Privacy ng DiveTone",updated:"Epektibo Agosto 9, 2026",label:"Wika",intro:"Iginagalang ng DiveTone ang iyong privacy. Ipinapaliwanag nito ang pagproseso habang nag-e-edit ng underwater photos at videos. Walang account, ads, cross-app tracking, analytics SDK, o developer image server.",sections:[["1. Datos na pinoproseso",["Binabasa ng app ang piniling media at metadata gaya ng petsa, GPS, pangalan, format, EXIF, TIFF, IPTC at QuickTime para ipakita, ayusin, i-edit at i-export.","Sa export, maaari mong panatilihin lahat, alisin ang GPS, o alisin lahat ng photo information."]],["2. On-device processing",["Ang correction, automatic subject detection, manual marking, black background, crop, watermark at encoding ay ginagawa sa device gamit ang Apple frameworks. Hindi ipinapadala ang images o masks sa DiveTone server."]],["3. Lokal na storage",["Lokal na sine-save ang Photos asset ID, edits, dates, GPS, formats, preferences, photographer name, watermarks, manual masks, thumbnails, place cache at daily quota. Karaniwang nananatili ang originals sa Photos.","Depende sa settings, maaaring mapasama ang ilang data sa Apple device o iCloud backup."]],["4. Mga serbisyo ng Apple",["Maaaring mag-download ang PhotoKit mula iCloud Photos. StoreKit ang humahawak sa presyo, pagbili, verification at restore; hindi natatanggap ng DiveTone ang Apple ID, card o buong order.","Para sa tinatayang lugar, maaaring ipadala ang GPS sa Apple reverse geocoding. Lokal na kina-cache ang resulta at coordinate na ni-round sa humigit-kumulang 100 m."]],["5. Google Maps at sharing",["Inilalagay lang ang coordinate sa Google Maps URL kapag pinili mo. Pagkatapos ng Share, AirDrop, Files o ibang app, patakaran ng destination ang susundin."]],["6. Permissions",["Access lang sa pinayagang media at pagdagdag ng exports ang hinihingi. Hindi hinihingi ang kasalukuyang location, contacts, microphone, advertising ID o tracking."]],["7. Retention at deletion",["Pag-delete ng project ay nag-aalis ng settings, mask at thumbnail, hindi original o exports. Karaniwang nabubura ang local data kapag inalis ang app; sa destination pamahalaan ang external copies. Hindi kayang makita o burahin ng developer nang remote ang device-only data."]],["8. Collection, tracking at mga bata",["Hindi kinokolekta ng developer ang usage, gumagawa ng profile, nagbebenta ng data o nagta-track sa ibang kumpanya. Walang feature para mangolekta ng datos ng bata."]],["9. Mga karapatan at seguridad",["Makipag-ugnayan sa ibaba. Ikaw ang namamahala ng lokal na content sa app o kaugnay na serbisyo. Hindi nalilimitahan ang legal rights. Gumagamit ng iOS sandbox ngunit walang ganap na garantiya."]],["10. Pagbabago at contact",["Iaanunsyo ang mahahalagang pagbabago sa app, website o release notes.","Contact: {email}"]]]},
"vi":{title:"Chính sách quyền riêng tư DiveTone",updated:"Hiệu lực ngày 9 tháng 8 năm 2026",label:"Ngôn ngữ",intro:"DiveTone tôn trọng quyền riêng tư của bạn. Chính sách này giải thích việc xử lý khi chỉnh sửa ảnh và video dưới nước. Không có tài khoản, quảng cáo, theo dõi liên ứng dụng, SDK phân tích hoặc máy chủ ảnh do nhà phát triển vận hành.",sections:[["1. Dữ liệu được xử lý",["Ứng dụng đọc nội dung bạn chọn và siêu dữ liệu như ngày, GPS, tên, định dạng, EXIF, TIFF, IPTC và QuickTime để hiển thị, sắp xếp, chỉnh sửa và xuất.","Khi xuất, bạn có thể giữ tất cả, xóa GPS hoặc xóa toàn bộ thông tin ảnh."]],["2. Xử lý trên thiết bị",["Chỉnh màu, phát hiện chủ thể tự động, đánh dấu thủ công, nền đen, cắt, watermark và mã hóa đều chạy trên thiết bị bằng framework Apple. Ảnh và mask không gửi tới máy chủ DiveTone."]],["3. Lưu trữ cục bộ",["ID tài sản Photos, chỉnh sửa, ngày, GPS, định dạng, tùy chọn, tên nhiếp ảnh gia, watermark, mask thủ công, ảnh thu nhỏ, bộ nhớ địa danh và hạn mức ngày được lưu cục bộ. Bản gốc thường ở Photos.","Tùy cài đặt, một số dữ liệu có thể nằm trong bản sao lưu thiết bị Apple hoặc iCloud."]],["4. Dịch vụ Apple",["PhotoKit có thể tải từ iCloud Photos. StoreKit xử lý giá, mua, xác minh và khôi phục; DiveTone không nhận Apple ID, thẻ hay đơn hàng đầy đủ.","Để lấy địa danh gần đúng, tọa độ GPS có thể gửi tới dịch vụ mã hóa địa lý ngược Apple. Kết quả và tọa độ làm tròn khoảng 100 m được lưu cục bộ."]],["5. Google Maps và chia sẻ",["Tọa độ chỉ nằm trong URL Google Maps khi bạn chủ động chọn. Sau Share, AirDrop, Files hoặc ứng dụng khác, chính sách của nơi nhận được áp dụng."]],["6. Quyền",["Chỉ yêu cầu quyền với nội dung bạn cho phép và thêm bản xuất. Không yêu cầu vị trí hiện tại, danh bạ, micrô, ID quảng cáo hoặc theo dõi."]],["7. Lưu giữ và xóa",["Xóa dự án sẽ xóa thiết lập, mask và ảnh thu nhỏ, không xóa bản gốc hay bản xuất. Gỡ ứng dụng thường xóa dữ liệu cục bộ; bản sao bên ngoài phải quản lý tại nơi đó. Nhà phát triển không thể xem hoặc xóa từ xa dữ liệu chỉ có trên thiết bị."]],["8. Thu thập, theo dõi và trẻ em",["Nhà phát triển không thu thập sử dụng, lập hồ sơ, bán dữ liệu hay theo dõi giữa các công ty. Không có tính năng thu thập dữ liệu trẻ em."]],["9. Quyền lợi và bảo mật",["Liên hệ bên dưới. Bạn quản lý nội dung cục bộ trong ứng dụng hoặc dịch vụ liên quan. Quyền pháp luật không bị hạn chế. Sandbox iOS bảo vệ dữ liệu nhưng không bảo đảm tuyệt đối."]],["10. Thay đổi và liên hệ",["Thay đổi quan trọng sẽ được thông báo trong ứng dụng, trang web hoặc ghi chú phát hành.","Liên hệ: {email}"]]]},
"ar":{title:"سياسة خصوصية DiveTone",updated:"تاريخ النفاذ: 9 أغسطس 2026",label:"اللغة",intro:"يحترم DiveTone خصوصيتك. توضح هذه السياسة معالجة المعلومات عند تحرير الصور ومقاطع الفيديو تحت الماء. لا توجد حسابات أو إعلانات أو تتبع عبر التطبيقات أو أدوات تحليل أو خادم صور يديره المطور.",sections:[["1. البيانات المعالَجة",["يقرأ التطبيق الوسائط التي تختارها والبيانات الوصفية المتاحة مثل التاريخ وGPS والاسم والتنسيق وEXIF وTIFF وIPTC وQuickTime للعرض والتنظيم والتحرير والتصدير.","عند التصدير يمكنك الاحتفاظ بكل البيانات أو إزالة GPS أو إزالة جميع معلومات الصورة."]],["2. المعالجة على الجهاز",["يتم تصحيح الألوان واكتشاف الهدف وتحديده يدوياً والخلفية السوداء والقص والعلامة المائية والترميز على الجهاز باستخدام أطر Apple. لا تُرسل الصور أو الأقنعة إلى خادم DiveTone."]],["3. التخزين المحلي",["تُحفظ محلياً معرّفات Photos والتعديلات والتواريخ وGPS والتنسيقات والتفضيلات واسم المصور والعلامات والأقنعة والصور المصغرة وذاكرة الأماكن والحصص اليومية. تبقى الأصول عادةً في Photos.","بحسب إعداداتك قد تدخل بعض البيانات في نسخ Apple للجهاز أو iCloud."]],["4. خدمات Apple",["قد ينزّل PhotoKit من iCloud Photos. يدير StoreKit السعر والشراء والتحقق والاستعادة؛ ولا يتلقى DiveTone معرف Apple أو البطاقة أو سجل الطلب الكامل.","للحصول على اسم مكان تقريبي قد تُرسل إحداثيات GPS إلى الترميز الجغرافي العكسي من Apple، وتُخزن النتيجة وإحداثيات مقربة لنحو 100 متر محلياً."]],["5. Google Maps والمشاركة",["لا يوضع الموقع في رابط Google Maps إلا باختيارك. بعد المشاركة أو AirDrop أو Files أو تطبيق آخر تنطبق سياسة الجهة المختارة."]],["6. الأذونات",["يطلب التطبيق فقط الوسائط التي تسمح بها وإضافة الصادرات. لا يطلب الموقع الحالي أو جهات الاتصال أو الميكروفون أو معرف الإعلان أو التتبع."]],["7. الاحتفاظ والحذف",["حذف المشروع يزيل الإعدادات والقناع والصورة المصغرة لا الأصل أو الصادرات. إزالة التطبيق تحذف عادةً البيانات المحلية؛ وتدار النسخ الخارجية في وجهتها. لا يستطيع المطور رؤية بيانات الجهاز أو حذفها عن بُعد."]],["8. الجمع والتتبع والأطفال",["لا يجمع المطور بيانات الاستخدام ولا ينشئ ملفات تعريف أو يبيع البيانات أو يتتبع بين الشركات. لا توجد ميزة لجمع بيانات الأطفال."]],["9. الحقوق والأمان",["تواصل معنا أدناه. تدير المحتوى المحلي في التطبيق أو الخدمة المعنية. لا تتأثر حقوقك القانونية. تحمي بيئة iOS البيانات دون ضمان مطلق."]],["10. التغييرات والاتصال",["ستُعلن التغييرات المهمة في التطبيق أو الموقع أو ملاحظات الإصدار.","البريد: {email}"]]]},
"tr":{title:"DiveTone Gizlilik Politikası",updated:"Yürürlük: 9 Ağustos 2026",label:"Dil",intro:"DiveTone gizliliğinize saygı duyar. Bu politika su altı fotoğraf ve videolarını düzenlerken bilgilerin işlenmesini açıklar. Hesap, reklam, uygulamalar arası takip, analiz SDK'sı veya geliştiriciye ait görüntü sunucusu yoktur.",sections:[["1. İşlenen veriler",["Uygulama seçtiğiniz medyayı ve tarih, GPS, ad, biçim, EXIF, TIFF, IPTC ve QuickTime gibi mevcut meta verileri görüntüleme, düzenleme ve dışa aktarma için okur.","Dışa aktarırken tümünü koruyabilir, GPS'i veya tüm fotoğraf bilgilerini kaldırabilirsiniz."]],["2. Cihazda işleme",["Renk düzeltme, otomatik konu algılama, elle işaretleme, siyah arka plan, kırpma, filigran ve kodlama Apple çerçeveleriyle cihazda çalışır. Görseller ve maskeler DiveTone sunucusuna gönderilmez."]],["3. Yerel depolama",["Photos kimlikleri, düzenlemeler, tarihler, GPS, biçimler, tercihler, fotoğrafçı adı, filigranlar, elle maskeler, küçük resimler, yer önbelleği ve günlük kotalar yerel tutulur. Orijinaller genellikle Photos'ta kalır.","Ayarlarınıza göre bazı veriler Apple cihaz veya iCloud yedeklerine girebilir."]],["4. Apple hizmetleri",["PhotoKit iCloud Photos'tan indirebilir. StoreKit fiyat, satın alma, doğrulama ve geri yüklemeyi işler; DiveTone Apple ID, kart veya tam sipariş kaydı almaz.","Yaklaşık yer adı için GPS koordinatı Apple ters coğrafi kodlamaya gönderilebilir. Sonuç ve yaklaşık 100 m'ye yuvarlanan koordinat yerel önbelleğe alınır."]],["5. Google Maps ve paylaşım",["Koordinat yalnızca seçtiğinizde Google Maps URL'sine konur. Paylaş, AirDrop, Files veya başka uygulamadan sonra hedefin politikası geçerlidir."]],["6. İzinler",["Yalnızca izin verdiğiniz medya ve dışa aktarımları ekleme izni istenir. Güncel konum, kişiler, mikrofon, reklam kimliği veya takip istenmez."]],["7. Saklama ve silme",["Proje silmek ayar, maske ve küçük resmi kaldırır; orijinal ve çıktıları kaldırmaz. Uygulamayı kaldırmak genellikle yerel verileri siler; dış kopyalar hedefte yönetilir. Geliştirici cihaz verisini uzaktan göremez veya silemez."]],["8. Toplama, takip ve çocuklar",["Geliştirici kullanım toplamaz, profil oluşturmaz, veri satmaz veya şirketler arasında takip etmez. Çocuk verisi toplamaya yönelik özellik yoktur."]],["9. Haklar ve güvenlik",["Aşağıdan iletişim kurun. Yerel içeriği ilgili uygulama veya hizmette siz yönetirsiniz. Yasal haklar etkilenmez. iOS koruması kullanılır ancak mutlak güvenlik garanti edilemez."]],["10. Değişiklikler ve iletişim",["Önemli değişiklikler uygulama, site veya sürüm notlarında duyurulur.","İletişim: {email}"]]]},
"el":{title:"Πολιτική Απορρήτου DiveTone",updated:"Ισχύει από 9 Αυγούστου 2026",label:"Γλώσσα",intro:"Το DiveTone σέβεται το απόρρητό σας. Η πολιτική εξηγεί την επεξεργασία κατά την επεξεργασία υποβρύχιων φωτογραφιών και βίντεο. Δεν υπάρχουν λογαριασμοί, διαφημίσεις, παρακολούθηση μεταξύ εφαρμογών, SDK αναλύσεων ή διακομιστής εικόνων του προγραμματιστή.",sections:[["1. Δεδομένα που υποβάλλονται σε επεξεργασία",["Η εφαρμογή διαβάζει τα επιλεγμένα μέσα και μεταδεδομένα όπως ημερομηνία, GPS, όνομα, μορφή, EXIF, TIFF, IPTC και QuickTime για εμφάνιση, οργάνωση, επεξεργασία και εξαγωγή.","Στην εξαγωγή μπορείτε να διατηρήσετε τα πάντα, να αφαιρέσετε GPS ή όλες τις πληροφορίες φωτογραφίας."]],["2. Επεξεργασία στη συσκευή",["Διόρθωση, αυτόματος εντοπισμός και χειροκίνητη σήμανση θέματος, μαύρο φόντο, περικοπή, υδατογράφημα και κωδικοποίηση γίνονται στη συσκευή με πλαίσια Apple. Εικόνες και μάσκες δεν στέλνονται σε διακομιστή DiveTone."]],["3. Τοπική αποθήκευση",["Αναγνωριστικά Photos, ρυθμίσεις, ημερομηνίες, GPS, μορφές, προτιμήσεις, όνομα φωτογράφου, υδατογραφήματα, μάσκες, μικρογραφίες, cache τόπων και ημερήσια όρια αποθηκεύονται τοπικά. Τα πρωτότυπα συνήθως μένουν στο Photos.","Ανάλογα με τις ρυθμίσεις, δεδομένα μπορεί να περιλαμβάνονται σε αντίγραφα Apple συσκευής ή iCloud."]],["4. Υπηρεσίες Apple",["Το PhotoKit μπορεί να κατεβάζει από iCloud Photos. Το StoreKit χειρίζεται τιμή, αγορά, επαλήθευση και επαναφορά· το DiveTone δεν λαμβάνει Apple ID, κάρτα ή πλήρη παραγγελία.","Για κατά προσέγγιση τοποθεσία, συντεταγμένες GPS μπορεί να σταλούν στην αντίστροφη γεωκωδικοποίηση Apple. Το αποτέλεσμα και συντεταγμένες στρογγυλεμένες περίπου στα 100 μ. αποθηκεύονται τοπικά."]],["5. Google Maps και κοινοποίηση",["Η συντεταγμένη μπαίνει σε URL Google Maps μόνο όταν το επιλέξετε. Μετά από Share, AirDrop, Files ή άλλη εφαρμογή ισχύουν οι όροι του προορισμού."]],["6. Άδειες",["Ζητείται μόνο πρόσβαση στα επιτρεπόμενα μέσα και προσθήκη εξαγωγών. Δεν ζητούνται τρέχουσα τοποθεσία, επαφές, μικρόφωνο, διαφημιστικό ID ή παρακολούθηση."]],["7. Διατήρηση και διαγραφή",["Η διαγραφή έργου αφαιρεί ρυθμίσεις, μάσκα και μικρογραφία, όχι πρωτότυπα ή εξαγωγές. Η αφαίρεση της εφαρμογής συνήθως διαγράφει τοπικά δεδομένα· τα εξωτερικά αντίγραφα διαχειρίζονται στον προορισμό. Ο προγραμματιστής δεν μπορεί να δει ή να διαγράψει εξ αποστάσεως δεδομένα συσκευής."]],["8. Συλλογή, παρακολούθηση και παιδιά",["Ο προγραμματιστής δεν συλλέγει χρήση, δεν δημιουργεί προφίλ, δεν πουλά δεδομένα και δεν παρακολουθεί μεταξύ εταιρειών. Δεν υπάρχει λειτουργία συλλογής δεδομένων παιδιών."]],["9. Δικαιώματα και ασφάλεια",["Επικοινωνήστε παρακάτω. Διαχειρίζεστε το τοπικό περιεχόμενο στην εφαρμογή ή σχετική υπηρεσία. Τα νόμιμα δικαιώματα παραμένουν. Το sandbox iOS προστατεύει χωρίς απόλυτη εγγύηση."]],["10. Αλλαγές και επικοινωνία",["Σημαντικές αλλαγές θα ανακοινώνονται στην εφαρμογή, ιστοσελίδα ή σημειώσεις έκδοσης.","Επικοινωνία: {email}"]]]}
};

function bestLanguage(){const q=new URLSearchParams(location.search).get("lang");const candidates=[q,...(navigator.languages||[]),navigator.language].filter(Boolean);for(const c of candidates){if(P[c])return c;const base=c.split("-")[0];if(base==="zh")return c.toLowerCase().includes("hant")||/tw|hk|mo/i.test(c)?"zh-Hant":"zh-Hans";if(base==="pt")return /br/i.test(c)?"pt-BR":"pt-PT";if(P[base])return base}return"en"}
function render(lang){const d=P[lang]||P.en;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.title=d.title;document.getElementById("title").textContent=d.title;document.getElementById("updated").textContent=d.updated;document.getElementById("languageLabel").textContent=d.label;document.getElementById("language").value=lang;document.getElementById("content").innerHTML=`<p class="muted">${d.intro}</p><p>${hostingNotes[lang]||hostingNotes.en} <a href="https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener">GitHub Privacy Statement</a></p><p>${sampleDownloadNotes[lang]||sampleDownloadNotes.en}</p>`+d.sections.map(([h,ps])=>`<section><h2>${h}</h2>${ps.map(x=>`<p>${x.replace("{email}",`<a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a>`)}</p>`).join("")}</section>`).join("");localStorage.setItem("divetone-legal-language",lang);history.replaceState(null,"",`${location.pathname}?lang=${encodeURIComponent(lang)}`)}
for(const [code,name] of Object.entries(languages)){const o=document.createElement("option");o.value=code;o.textContent=name;document.getElementById("language").appendChild(o)}
document.getElementById("language").addEventListener("change",e=>render(e.target.value));if(CONTACT_EMAIL.startsWith("YOUR_"))document.getElementById("setupWarning").style.display="block";render(new URLSearchParams(location.search).has("lang")?bestLanguage():(P[localStorage.getItem("divetone-legal-language")]?localStorage.getItem("divetone-legal-language"):bestLanguage()));
