ms:{title:"Sokongan DiveTone",sub:"Dihasilkan oleh penyelam dari Taiwan",label:"Bahasa",about:"Tentang DiveTone",intro:"DiveTone ialah studio imej bawah air untuk iPhone dan iPad. Ia membantu mengembalikan warna dan rasa yang anda lihat ketika menyelam sambil mengekalkan cahaya dan warna air.",features:"Ciri utama",supportTitle:"Hubungi sokongan",support:"Untuk bantuan aplikasi, pembelian atau maklum balas, e-mel kami. Jika boleh, sertakan model peranti, versi iOS dan ringkasan masalah.",privacy:"Privasi dan data",privacyText:"Pemprosesan imej utama berlaku pada peranti anda. DiveTone tiada akaun atau iklan dan tidak memuat naik foto atau topeng subjek anda ke pelayan pembangun.",featureList:["Pembetulan warna bawah air untuk keadaan selaman sebenar","Pengesanan subjek automatik dengan kawasan boleh sunting","Latar hitam, pangkas, putar dan tera air","Projek tempatan, perbandingan, maklumat foto dan eksport foto"]},
fil:{title:"Suporta ng DiveTone",sub:"Ginawa ng isang diver mula Taiwan",label:"Wika",about:"Tungkol sa DiveTone",intro:"Ang DiveTone ay isang underwater image studio para sa iPhone at iPad. Tinutulungan ka nitong maibalik ang kulay at damdaming nakita mo sa pagsisid habang pinananatili ang liwanag at kulay ng tubig.",features:"Pangunahing tampok",supportTitle:"Makipag-ugnayan sa suporta",support:"Para sa tulong sa app, pagbili, o puna, mag-email sa amin. Kung maaari, isama ang modelo ng device, bersyon ng iOS, at maikling paglalarawan ng problema.",privacy:"Privacy at data",privacyText:"Ang pangunahing pagproseso ng larawan ay ginagawa sa iyong device. Walang account o ads ang DiveTone at hindi nito ina-upload ang iyong larawan o subject mask sa server ng developer.",featureList:["Underwater color correction para sa tunay na kondisyon ng pagsisid","Awtomatikong pagtukoy ng subject na may nae-edit na area","Black Background, crop, rotate, at watermark","Lokal na proyekto, paghahambing, impormasyon, at photo export"]},
vi:{title:"Hỗ trợ DiveTone",sub:"Được tạo bởi một thợ lặn từ Đài Loan",label:"Ngôn ngữ",about:"Giới thiệu DiveTone",intro:"DiveTone là studio hình ảnh dưới nước cho iPhone và iPad. Ứng dụng giúp khôi phục màu sắc và cảm xúc bạn nhìn thấy khi lặn, đồng thời giữ lại ánh sáng và sắc nước biển.",features:"Tính năng chính",supportTitle:"Liên hệ hỗ trợ",support:"Để được hỗ trợ về ứng dụng, mua hàng hoặc góp ý, hãy gửi email cho chúng tôi. Nếu có thể, hãy kèm theo mẫu thiết bị, phiên bản iOS và mô tả ngắn về sự cố.",privacy:"Quyền riêng tư và dữ liệu",privacyText:"Xử lý hình ảnh chính diễn ra trên thiết bị của bạn. DiveTone không có tài khoản hay quảng cáo và không tải ảnh hoặc mặt nạ chủ thể lên máy chủ của nhà phát triển.",featureList:["Chỉnh màu dưới nước cho điều kiện lặn thực tế","Tự động nhận diện chủ thể với vùng có thể chỉnh sửa","Nền đen, cắt, xoay và hình mờ","Dự án cục bộ, so sánh, thông tin ảnh và xuất ảnh"]},
ar:{title:"دعم DiveTone",sub:"صممه غواص من تايوان",label:"اللغة",about:"عن DiveTone",intro:"DiveTone هو استوديو صور تحت الماء لأجهزة iPhone وiPad. يساعدك على استعادة الألوان والإحساس اللذين رأيتهما أثناء الغوص، مع الحفاظ على ضوء البحر ولون الماء.",features:"الميزات الرئيسية",supportTitle:"التواصل مع الدعم",support:"للحصول على المساعدة بشأن التطبيق أو المشتريات أو الملاحظات، راسلنا عبر البريد الإلكتروني. إن أمكن، أرفق طراز الجهاز وإصدار iOS ووصفاً موجزاً للمشكلة.",privacy:"الخصوصية والبيانات",privacyText:"تتم معالجة الصور الأساسية على جهازك. لا يحتوي DiveTone على حسابات أو إعلانات، ولا يرفع صورك أو أقنعة الهدف إلى خادم للمطور.",featureList:["تصحيح ألوان تحت الماء لظروف الغوص الحقيقية","اكتشاف تلقائي للهدف مع مناطق قابلة للتحرير","خلفية سوداء واقتصاص وتدوير وعلامة مائية","مشاريع محلية ومقارنة ومعلومات الصورة وتصدير الصور"]},
tr:{title:"DiveTone Destek",sub:"Tayvanlı bir dalgıç tarafından geliştirildi",label:"Dil",about:"DiveTone hakkında",intro:"DiveTone, iPhone ve iPad için bir su altı görüntü stüdyosudur. Denizdeki ışığı ve su rengini korurken dalışta gördüğünüz renkleri ve hissi geri getirmenize yardımcı olur.",features:"Başlıca özellikler",supportTitle:"Destekle iletişime geçin",support:"Uygulama, satın alma veya geri bildirim konusunda yardım için bize e-posta gönderin. Mümkünse cihaz modelini, iOS sürümünü ve sorunun kısa açıklamasını ekleyin.",privacy:"Gizlilik ve veriler",privacyText:"Temel görüntü işleme cihazınızda yapılır. DiveTone’da hesap veya reklam yoktur; fotoğraflarınız ya da konu maskeleriniz geliştirici sunucusuna yüklenmez.",featureList:["Gerçek dalış koşulları için su altı renk düzeltmesi","Düzenlenebilir konu alanlarıyla otomatik konu algılama","Siyah arka plan, kırpma, döndürme ve filigran","Yerel projeler, karşılaştırma, fotoğraf bilgileri ve dışa aktarma"]},
el:{title:"Υποστήριξη DiveTone",sub:"Δημιουργήθηκε από δύτη από την Ταϊβάν",label:"Γλώσσα",about:"Σχετικά με το DiveTone",intro:"Το DiveTone είναι ένα στούντιο υποβρύχιας εικόνας για iPhone και iPad. Σας βοηθά να επαναφέρετε τα χρώματα και την αίσθηση της κατάδυσης, διατηρώντας το φως και το χρώμα του νερού.",features:"Κύριες δυνατότητες",supportTitle:"Επικοινωνία με υποστήριξη",support:"Για βοήθεια με την εφαρμογή, αγορές ή σχόλια, στείλτε μας email. Αν είναι δυνατόν, συμπεριλάβετε μοντέλο συσκευής, έκδοση iOS και σύντομη περιγραφή του προβλήματος.",privacy:"Απόρρητο και δεδομένα",privacyText:"Η βασική επεξεργασία εικόνας γίνεται στη συσκευή σας. Το DiveTone δεν έχει λογαριασμούς ή διαφημίσεις και δεν ανεβάζει τις φωτογραφίες ή τις μάσκες θέματος σε διακομιστή του δημιουργού.",featureList:["Υποβρύχια χρωματική επεξεργασία για πραγματικές συνθήκες κατάδυσης","Αυτόματη ανίχνευση θέματος με επεξεργάσιμες περιοχές","Μαύρο φόντο, περικοπή, περιστροφή και υδατογράφημα","Τοπικά έργα, σύγκριση, πληροφορίες φωτογραφίας και εξαγωγή"]}
};
const supportTopics = {
"zh-Hant":[["DiveTone 使用說明","從首頁按「加入影像」選取照片或影片；照片載入後可選擇內建風格，再在主體、色彩、光線與細節工具中微調。使用前後比較確認結果，最後由輸出選單儲存或分享。"],["常見問題","若預覽仍在處理中，請先等待完成；大型 RAW 或 iCloud 媒體需要較久時間。刪除 DiveTone 專案只會移除編輯資料、遮罩與縮圖，不會刪除照片圖庫的原始檔。"],["Photos 權限問題","建議在 iOS 設定中允許 DiveTone 取用「所有照片」。若只允許部分照片，未授權的媒體可能無法載入原始檔、讀取相機資訊或完成匯出；可於「設定」>「隱私權與安全性」>「照片」調整。"],["iCloud 原始檔問題","若原始檔只存於 iCloud Photos，DiveTone 會在需要時透過 Apple 服務下載。請確認已登入 iCloud、網路連線可用且裝置有足夠空間；行動網路下載會依 App 的網路設定與你的系統設定執行。"],["免費額度","免費版可完整編輯與預覽。每部裝置每天可成功匯出 15 張照片與 2 支影片；只有實際成功的匯出才會計入額度，失敗的匯出不扣除額度。"],["購買與恢復購買","DiveTone Pro 為一次性永久購買，解鎖不限量匯出，沒有訂閱。請使用購買時相同的 Apple ID，在 App 的購買頁選擇「恢復購買」；購買與資格驗證均由 Apple StoreKit 處理。"],["隱私權政策","主要影像處理在裝置端完成。DiveTone 沒有帳號、廣告或開發者營運的影像伺服器；完整隱私權政策可由下方連結查看。"]],
"zh-Hans":[["DiveTone 使用说明","在首页点按“添加影像”选择照片或视频；照片载入后可选择内建风格，并在主体、色彩、光线和细节工具中微调。使用前后对比确认结果，最后从导出菜单保存或分享。"],["常见问题","预览仍在处理时请先等待完成；大型 RAW 或 iCloud 媒体需要更多时间。删除 DiveTone 项目只会移除编辑数据、蒙版和缩略图，不会删除照片图库的原始文件。"],["Photos 权限问题","建议在 iOS 设置中允许 DiveTone 访问“所有照片”。只允许部分照片时，未授权媒体可能无法加载原始文件、读取相机信息或完成导出；可在“设置”>“隐私与安全性”>“照片”中调整。"],["iCloud 原始文件问题","若原始文件只在 iCloud Photos 中，DiveTone 会在需要时通过 Apple 服务下载。请确认已登录 iCloud、网络可用且设备空间充足；蜂窝网络下载遵循 App 和系统网络设置。"],["免费额度","免费版可完整编辑和预览。每台设备每天可成功导出 15 张照片和 2 个视频；只有成功导出才计入额度，失败导出不扣额度。"],["购买与恢复购买","DiveTone Pro 是一次性永久购买，解锁不限量导出，没有订阅。请使用购买时相同的 Apple ID，并在 App 的购买页选择“恢复购买”；购买与资格验证由 Apple StoreKit 处理。"],["隐私权政策","主要影像处理在设备端完成。DiveTone 没有账户、广告或开发者运营的影像服务器；完整隐私政策可通过下方链接查看。"]],
en:[["Using DiveTone","From the Home screen, choose Add Media and select a photo or video. After a photo loads, choose a built-in style and refine it with Subject, Color, Light, and Detail tools. Use before-and-after comparison, then save or share from Export."],["Frequently asked questions","Please wait for processing to finish before judging a preview. Large RAW files and iCloud media can take longer. Deleting a DiveTone project removes its edits, mask, and thumbnail only; it never deletes the original item in Photos."],["Photos permission","For the most reliable experience, allow DiveTone access to All Photos in iOS Settings. Limited access can prevent the app from loading an original, reading camera information, or exporting selected media. Change this in Settings > Privacy & Security > Photos."],["iCloud originals","If an original exists only in iCloud Photos, DiveTone downloads it through Apple services when needed. Confirm that you are signed in to iCloud, have a working connection and sufficient device storage. Cellular downloads follow the app and system network settings."],["Free allowance","The free version includes full editing and preview. Each device can successfully export up to 15 photos and 2 videos per local day. Only a completed export counts; a failed export does not use an allowance."],["Purchase and restore","DiveTone Pro is a one-time lifetime purchase for unlimited exports, with no subscription. Use the same Apple ID used for purchase, then choose Restore Purchases in the app. Apple StoreKit handles payment and entitlement verification."],["Privacy policy","Core image processing happens on your device. DiveTone has no accounts, advertising, or developer-operated image server. Read the full privacy policy using the link below."]],
ja:[["DiveTone の使い方","ホームで「メディアを追加」を選び、写真または動画を選択します。写真の読み込み後に内蔵スタイルを選び、「被写体」「カラー」「光」「ディテール」で調整します。比較表示で確認し、書き出しから保存または共有します。"],["よくある質問","プレビューの処理中は完了するまでお待ちください。大きな RAW ファイルや iCloud のメディアには時間がかかる場合があります。DiveTone プロジェクトを削除しても、削除されるのは編集内容、マスク、サムネイルだけで、写真の原本は削除されません。"],["写真へのアクセス","安定して使うには、iOS の設定で DiveTone に「すべての写真」へのアクセスを許可してください。限定アクセスでは、原本の読み込み、カメラ情報の取得、書き出しができない場合があります。設定 > プライバシーとセキュリティ > 写真で変更できます。"],["iCloud の原本","原本が iCloud 写真のみにある場合、DiveTone は必要時に Apple のサービス経由でダウンロードします。iCloud にサインイン済みであること、接続と空き容量を確認してください。モバイル通信でのダウンロードは App とシステムの設定に従います。"],["無料枠","無料版でも編集とプレビューをすべて利用できます。各デバイスで 1 日に写真 15 枚、動画 2 本まで正常に書き出せます。完了した書き出しだけがカウントされ、失敗分は消費しません。"],["購入と復元","DiveTone Pro はサブスクリプションではなく、無制限の書き出しを利用できる買い切り版です。購入時と同じ Apple ID で App の購入画面から「購入を復元」を選んでください。決済と資格確認は Apple StoreKit が行います。"],["プライバシーポリシー","主要な画像処理は端末内で行われます。DiveTone にはアカウント、広告、開発者運営の画像サーバーはありません。完全なポリシーは下のリンクから確認できます。"]],
ko:[["DiveTone 사용 방법","홈에서 미디어 추가를 선택해 사진 또는 동영상을 고릅니다. 사진이 로드되면 내장 스타일을 선택하고 피사체, 색상, 빛, 디테일 도구로 조정합니다. 전후 비교 후 내보내기에서 저장하거나 공유합니다."],["자주 묻는 질문","미리보기가 처리 중이면 완료될 때까지 기다려 주세요. 큰 RAW 파일과 iCloud 미디어는 더 오래 걸릴 수 있습니다. DiveTone 프로젝트를 삭제해도 편집값, 마스크, 썸네일만 삭제되며 사진 앱의 원본은 삭제되지 않습니다."],["사진 권한","안정적으로 사용하려면 iOS 설정에서 DiveTone에 모든 사진 접근을 허용하세요. 제한된 접근은 원본 로드, 카메라 정보 읽기 또는 내보내기를 막을 수 있습니다. 설정 > 개인정보 보호 및 보안 > 사진에서 변경할 수 있습니다."],["iCloud 원본","원본이 iCloud 사진에만 있으면 DiveTone이 필요할 때 Apple 서비스를 통해 다운로드합니다. iCloud 로그인, 네트워크 연결, 충분한 기기 저장 공간을 확인하세요. 셀룰러 다운로드는 앱과 시스템 네트워크 설정을 따릅니다."],["무료 할당량","무료 버전에서도 모든 편집과 미리보기를 사용할 수 있습니다. 각 기기에서 하루에 사진 15장과 동영상 2개를 성공적으로 내보낼 수 있습니다. 완료된 내보내기만 계산되며 실패한 내보내기는 할당량을 쓰지 않습니다."],["구매 및 복원","DiveTone Pro는 구독이 아닌 일회성 평생 구매로, 무제한 내보내기를 제공합니다. 구매에 사용한 동일한 Apple ID로 앱의 구매 화면에서 구매 복원을 선택하세요. 결제와 권한 확인은 Apple StoreKit이 처리합니다."],["개인정보 처리방침","핵심 이미지 처리는 기기에서 이루어집니다. DiveTone에는 계정, 광고 또는 개발자 운영 이미지 서버가 없습니다. 아래 링크에서 전체 정책을 확인할 수 있습니다."]],
es:[["Cómo usar DiveTone","En Inicio, elige Añadir contenido y selecciona una foto o vídeo. Cuando cargue la foto, elige un estilo y ajusta Sujeto, Color, Luz y Detalle. Comprueba la comparación y guarda o comparte desde Exportar."],["Preguntas frecuentes","Espera a que termine el procesamiento antes de evaluar la vista previa. Los archivos RAW grandes y el contenido de iCloud pueden tardar más. Al eliminar un proyecto solo se borran sus ajustes, máscara y miniatura; nunca el original de Fotos."],["Permiso de Fotos","Para una experiencia fiable, permite a DiveTone acceder a Todas las fotos en Ajustes de iOS. El acceso limitado puede impedir cargar un original, leer datos de cámara o exportar. Cámbialo en Ajustes > Privacidad y seguridad > Fotos."],["Originales de iCloud","Si el original solo está en iCloud Photos, DiveTone lo descarga mediante servicios de Apple cuando hace falta. Comprueba iCloud, la conexión y el espacio del dispositivo. Las descargas móviles siguen los ajustes de red de la app y del sistema."],["Límite gratuito","La versión gratuita incluye edición y vista previa completas. Cada dispositivo puede exportar correctamente hasta 15 fotos y 2 vídeos por día local. Solo cuenta una exportación terminada; un fallo no consume límite."],["Compra y restauración","DiveTone Pro es una compra única de por vida con exportaciones ilimitadas, sin suscripción. Usa el mismo Apple ID de compra y elige Restaurar compras en la app. Apple StoreKit gestiona el pago y la verificación."],["Política de privacidad","El procesamiento principal se realiza en el dispositivo. DiveTone no tiene cuentas, publicidad ni servidor de imágenes del desarrollador. Consulta la política completa en el enlace siguiente."]],
fr:[["Utiliser DiveTone","Depuis l’accueil, choisissez Ajouter un média puis une photo ou vidéo. Une fois la photo chargée, choisissez un style et ajustez Sujet, Couleur, Lumière et Détail. Vérifiez la comparaison, puis enregistrez ou partagez depuis Exporter."],["Questions fréquentes","Attendez la fin du traitement avant d’évaluer l’aperçu. Les grands fichiers RAW et les médias iCloud peuvent prendre plus de temps. Supprimer un projet n’efface que ses réglages, masque et miniature, jamais l’original dans Photos."],["Autorisation Photos","Pour un fonctionnement fiable, autorisez l’accès à Toutes les photos dans les Réglages iOS. Un accès limité peut empêcher le chargement de l’original, la lecture des données de l’appareil ou l’export. Modifiez-le dans Réglages > Confidentialité et sécurité > Photos."],["Originaux iCloud","Si l’original se trouve uniquement dans iCloud Photos, DiveTone le télécharge via les services Apple au besoin. Vérifiez iCloud, la connexion et l’espace libre. Les téléchargements cellulaires suivent les réglages de réseau de l’app et du système."],["Quota gratuit","La version gratuite offre l’édition et l’aperçu complets. Chaque appareil peut exporter avec succès jusqu’à 15 photos et 2 vidéos par jour local. Seul un export terminé compte ; un échec ne consomme pas de quota."],["Achat et restauration","DiveTone Pro est un achat unique à vie avec exportations illimitées, sans abonnement. Utilisez le même identifiant Apple et choisissez Restaurer les achats dans l’app. Apple StoreKit gère le paiement et la vérification."],["Politique de confidentialité","Le traitement principal est effectué sur l’appareil. DiveTone n’a ni compte, ni publicité, ni serveur d’images exploité par le développeur. Consultez la politique complète ci-dessous."]],
de:[["DiveTone verwenden","Wähle auf der Startseite Medien hinzufügen und dann ein Foto oder Video. Nach dem Laden eines Fotos wählst du einen Stil und passt Motiv, Farbe, Licht und Details an. Prüfe den Vergleich und sichere oder teile über Exportieren."],["Häufige Fragen","Warte, bis die Verarbeitung der Vorschau abgeschlossen ist. Große RAW-Dateien und iCloud-Medien können länger dauern. Beim Löschen eines Projekts werden nur Bearbeitungen, Maske und Miniatur gelöscht, niemals das Original in Fotos."],["Fotos-Berechtigung","Für eine zuverlässige Nutzung erlaube DiveTone in iOS-Einstellungen den Zugriff auf Alle Fotos. Beschränkter Zugriff kann das Laden des Originals, das Lesen von Kameradaten oder den Export verhindern. Ändere dies unter Einstellungen > Datenschutz & Sicherheit > Fotos."],["iCloud-Originale","Liegt das Original nur in iCloud Fotos, lädt DiveTone es bei Bedarf über Apple-Dienste. Prüfe iCloud-Anmeldung, Verbindung und freien Speicher. Mobilfunk-Downloads folgen den Netzwerk-Einstellungen der App und des Systems."],["Kostenloses Kontingent","Die kostenlose Version enthält vollständige Bearbeitung und Vorschau. Jedes Gerät kann täglich bis zu 15 Fotos und 2 Videos erfolgreich exportieren. Nur ein abgeschlossener Export zählt; ein Fehlschlag verbraucht kein Kontingent."],["Kauf und Wiederherstellung","DiveTone Pro ist ein einmaliger Kauf für unbegrenzten Export, ohne Abonnement. Verwende dieselbe Apple-ID wie beim Kauf und wähle Käufe wiederherstellen in der App. Apple StoreKit verarbeitet Zahlung und Berechtigungsprüfung."],["Datenschutzrichtlinie","Die zentrale Bildverarbeitung erfolgt auf deinem Gerät. DiveTone hat keine Konten, Werbung oder einen Entwickler-Bildserver. Die vollständige Richtlinie findest du über den Link unten."]],
it:[["Usare DiveTone","Dalla Home scegli Aggiungi contenuto e seleziona una foto o un video. Quando la foto è caricata, scegli uno stile e regola Soggetto, Colore, Luce e Dettaglio. Controlla il confronto e salva o condividi da Esporta."],["Domande frequenti","Attendi la fine dell’elaborazione prima di valutare l’anteprima. RAW grandi e contenuti iCloud possono richiedere più tempo. Eliminare un progetto rimuove solo regolazioni, maschera e miniatura, mai l’originale in Foto."],["Permesso Foto","Per un uso affidabile, consenti a DiveTone l’accesso a Tutte le foto nelle Impostazioni di iOS. L’accesso limitato può impedire il caricamento dell’originale, la lettura dei dati della fotocamera o l’esportazione. Modificalo in Impostazioni > Privacy e sicurezza > Foto."],["Originali iCloud","Se l’originale è solo in Foto di iCloud, DiveTone lo scarica tramite servizi Apple quando necessario. Controlla l’accesso a iCloud, la connessione e lo spazio disponibile. I download mobili seguono le impostazioni dell’app e del sistema."],["Quota gratuita","La versione gratuita include modifica e anteprima complete. Ogni dispositivo può esportare con successo fino a 15 foto e 2 video al giorno locale. Conta solo un’esportazione completata; un errore non consuma la quota."],["Acquisto e ripristino","DiveTone Pro è un acquisto unico a vita con esportazioni illimitate, senza abbonamento. Usa lo stesso Apple ID dell’acquisto e scegli Ripristina acquisti nell’app. Apple StoreKit gestisce pagamento e verifica."],["Informativa sulla privacy","L’elaborazione principale avviene sul dispositivo. DiveTone non ha account, pubblicità o un server immagini del sviluppatore. Consulta l’informativa completa dal link qui sotto."]],
"pt-BR":[["Como usar o DiveTone","Na tela inicial, escolha Adicionar mídia e selecione uma foto ou vídeo. Depois que a foto carregar, escolha um estilo e ajuste Assunto, Cor, Luz e Detalhe. Confira a comparação e salve ou compartilhe em Exportar."],["Perguntas frequentes","Espere o processamento terminar antes de avaliar a prévia. Arquivos RAW grandes e mídias do iCloud podem demorar mais. Excluir um projeto remove apenas ajustes, máscara e miniatura; nunca o original no Fotos."],["Permissão do Fotos","Para melhor funcionamento, permita que o DiveTone acesse Todas as Fotos nos Ajustes do iOS. O acesso limitado pode impedir carregar o original, ler dados da câmera ou exportar. Altere em Ajustes > Privacidade e Segurança > Fotos."],["Originais do iCloud","Se o original existir apenas no iCloud Photos, o DiveTone o baixa pelos serviços Apple quando necessário. Verifique o iCloud, a conexão e o espaço livre. Downloads por rede celular seguem os ajustes do app e do sistema."],["Cota gratuita","A versão gratuita inclui edição e prévia completas. Cada aparelho pode exportar com sucesso até 15 fotos e 2 vídeos por dia local. Só uma exportação concluída conta; uma falha não usa cota."],["Compra e restauração","DiveTone Pro é uma compra única vitalícia com exportações ilimitadas, sem assinatura. Use o mesmo Apple ID da compra e escolha Restaurar Compras no app. A Apple StoreKit cuida do pagamento e da verificação."],["Política de privacidade","O processamento principal ocorre no dispositivo. O DiveTone não tem contas, anúncios nem servidor de imagens do desenvolvedor. Leia a política completa pelo link abaixo."]],
"pt-PT":[["Como utilizar o DiveTone","No ecrã inicial, escolha Adicionar conteúdo e selecione uma fotografia ou vídeo. Depois de carregar a fotografia, escolha um estilo e ajuste Motivo, Cor, Luz e Detalhe. Confirme a comparação e guarde ou partilhe em Exportar."],["Perguntas frequentes","Aguarde que o processamento termine antes de avaliar a pré-visualização. RAW grandes e conteúdos iCloud podem demorar mais. Apagar um projeto remove apenas ajustes, máscara e miniatura; nunca o original em Fotografias."],["Permissão das Fotografias","Para uma utilização fiável, permita ao DiveTone acesso a Todas as Fotografias nas Definições do iOS. O acesso limitado pode impedir carregar o original, ler dados da câmara ou exportar. Altere em Definições > Privacidade e segurança > Fotografias."],["Originais do iCloud","Se o original existir apenas em Fotografias em iCloud, o DiveTone descarrega-o através dos serviços Apple quando necessário. Confirme iCloud, ligação e espaço disponível. Os downloads móveis seguem as definições de rede da app e do sistema."],["Limite gratuito","A versão gratuita inclui edição e pré-visualização completas. Cada dispositivo pode exportar com sucesso até 15 fotografias e 2 vídeos por dia local. Só uma exportação concluída conta; uma falha não consome limite."],["Compra e restauro","DiveTone Pro é uma compra única vitalícia com exportações ilimitadas, sem subscrição. Use o mesmo ID Apple da compra e escolha Restaurar compras na app. A Apple StoreKit trata do pagamento e da verificação."],["Política de privacidade","O processamento principal ocorre no dispositivo. O DiveTone não tem contas, publicidade nem servidor de imagens do programador. Consulte a política completa na ligação abaixo."]],
nl:[["DiveTone gebruiken","Kies op het beginscherm Media toevoegen en selecteer een foto of video. Kies na het laden van een foto een stijl en pas Onderwerp, Kleur, Licht en Detail aan. Controleer de vergelijking en bewaar of deel via Exporteer."],["Veelgestelde vragen","Wacht tot de verwerking klaar is voordat je de voorvertoning beoordeelt. Grote RAW-bestanden en iCloud-media kunnen langer duren. Een project verwijderen wist alleen bewerkingen, masker en miniatuur, nooit het origineel in Foto’s."],["Foto’s-toegang","Sta DiveTone voor betrouwbaar gebruik toegang tot Alle foto’s toe in iOS-instellingen. Beperkte toegang kan het laden van het origineel, het lezen van cameragegevens of exporteren verhinderen. Wijzig dit via Instellingen > Privacy en beveiliging > Foto’s."],["iCloud-originelen","Staat een origineel alleen in iCloud Foto’s, dan downloadt DiveTone het via Apple-diensten wanneer nodig. Controleer iCloud, verbinding en vrije ruimte. Mobiele downloads volgen de netwerkinstellingen van app en systeem."],["Gratis limiet","De gratis versie bevat volledige bewerking en voorvertoning. Elk apparaat kan per lokale dag maximaal 15 foto’s en 2 video’s succesvol exporteren. Alleen een voltooide export telt; een mislukte export gebruikt geen limiet."],["Aankoop en herstel","DiveTone Pro is een eenmalige levenslange aankoop voor onbeperkt exporteren, zonder abonnement. Gebruik dezelfde Apple ID als bij aankoop en kies Aankopen herstellen in de app. Apple StoreKit verwerkt betaling en controle."],["Privacybeleid","De belangrijkste beeldverwerking gebeurt op je apparaat. DiveTone heeft geen accounts, advertenties of ontwikkelaarsserver voor beelden. Lees het volledige beleid via de link hieronder."]],
th:[["การใช้ DiveTone","จากหน้าแรก เลือกเพิ่มสื่อแล้วเลือกรูปภาพหรือวิดีโอ เมื่อรูปภาพโหลดแล้ว ให้เลือกสไตล์และปรับตัวแบบ สี แสง และรายละเอียด ตรวจสอบการเปรียบเทียบ แล้วบันทึกหรือแชร์จากเมนูส่งออก."],["คำถามที่พบบ่อย","โปรดรอให้การประมวลผลเสร็จก่อนประเมินภาพตัวอย่าง ไฟล์ RAW ขนาดใหญ่และสื่อใน iCloud อาจใช้เวลานานขึ้น การลบโครงการจะลบเฉพาะการปรับแต่ง มาสก์ และภาพย่อ ไม่ลบไฟล์ต้นฉบับในรูปภาพ."],["สิทธิ์รูปภาพ","เพื่อการใช้งานที่เชื่อถือได้ ให้อนุญาต DiveTone เข้าถึงรูปภาพทั้งหมดในการตั้งค่า iOS การเข้าถึงแบบจำกัดอาจทำให้โหลดต้นฉบับ อ่านข้อมูลกล้อง หรือส่งออกไม่ได้ เปลี่ยนได้ที่ การตั้งค่า > ความเป็นส่วนตัวและความปลอดภัย > รูปภาพ."],["ไฟล์ต้นฉบับ iCloud","หากไฟล์ต้นฉบับอยู่ใน iCloud Photos เท่านั้น DiveTone จะดาวน์โหลดผ่านบริการ Apple เมื่อจำเป็น โปรดตรวจสอบ iCloud การเชื่อมต่อ และพื้นที่ว่าง การดาวน์โหลดผ่านเครือข่ายมือถือเป็นไปตามการตั้งค่าแอปและระบบ."],["โควต้าฟรี","เวอร์ชันฟรีมีการแก้ไขและพรีวิวครบถ้วน แต่ละอุปกรณ์ส่งออกรูปภาพได้สำเร็จสูงสุด 15 รูปและวิดีโอ 2 รายการต่อวัน เฉพาะการส่งออกที่เสร็จสมบูรณ์เท่านั้นที่นับ ความล้มเหลวไม่ใช้โควตา."],["การซื้อและกู้คืน","DiveTone Pro เป็นการซื้อครั้งเดียวตลอดชีพสำหรับการส่งออกไม่จำกัด ไม่มีการสมัครสมาชิก ใช้ Apple ID เดียวกับที่ซื้อ แล้วเลือกกู้คืนการซื้อในแอป Apple StoreKit จัดการการชำระเงินและการตรวจสอบสิทธิ์."],["นโยบายความเป็นส่วนตัว","การประมวลผลภาพหลักเกิดขึ้นบนอุปกรณ์ของคุณ DiveTone ไม่มีบัญชี โฆษณา หรือเซิร์ฟเวอร์ภาพของผู้พัฒนา อ่านนโยบายฉบับเต็มได้จากลิงก์ด้านล่าง."]],
id:[["Menggunakan DiveTone","Dari Beranda, pilih Tambah Media lalu pilih foto atau video. Setelah foto dimuat, pilih gaya bawaan dan sesuaikan Subjek, Warna, Cahaya, dan Detail. Periksa perbandingan, lalu simpan atau bagikan dari Ekspor."],["Pertanyaan umum","Tunggu pemrosesan selesai sebelum menilai pratinjau. File RAW besar dan media iCloud dapat memerlukan waktu lebih lama. Menghapus proyek hanya menghapus pengeditan, mask, dan thumbnail; bukan foto asli di Foto."],["Izin Foto","Agar andal, izinkan DiveTone mengakses Semua Foto di Pengaturan iOS. Akses terbatas dapat menghalangi pemuatan asli, pembacaan data kamera, atau ekspor. Ubah di Pengaturan > Privasi & Keamanan > Foto."],["File asli iCloud","Jika file asli hanya ada di iCloud Photos, DiveTone mengunduhnya melalui layanan Apple saat diperlukan. Pastikan iCloud, koneksi, dan ruang perangkat tersedia. Unduhan seluler mengikuti pengaturan jaringan app dan sistem."],["Jatah gratis","Versi gratis mencakup pengeditan dan pratinjau penuh. Setiap perangkat dapat berhasil mengekspor hingga 15 foto dan 2 video per hari lokal. Hanya ekspor selesai yang dihitung; ekspor gagal tidak memakai jatah."],["Pembelian dan pemulihan","DiveTone Pro adalah pembelian sekali seumur hidup untuk ekspor tanpa batas, tanpa langganan. Gunakan Apple ID yang sama lalu pilih Pulihkan Pembelian di app. Apple StoreKit menangani pembayaran dan verifikasi."],["Kebijakan privasi","Pemrosesan gambar utama terjadi di perangkat Anda. DiveTone tidak memiliki akun, iklan, atau server gambar pengembang. Baca kebijakan lengkap melalui tautan di bawah."]],
ms:[["Menggunakan DiveTone","Dari Halaman Utama, pilih Tambah Media dan pilih foto atau video. Setelah foto dimuatkan, pilih gaya terbina dalam dan laraskan Subjek, Warna, Cahaya dan Butiran. Semak perbandingan, kemudian simpan atau kongsi melalui Eksport."],["Soalan lazim","Tunggu pemprosesan selesai sebelum menilai pratonton. Fail RAW besar dan media iCloud mungkin mengambil masa lebih lama. Memadam projek hanya menghapuskan suntingan, topeng dan imej kecil; bukan foto asal dalam Photos."],["Kebenaran Photos","Untuk penggunaan yang boleh dipercayai, benarkan DiveTone mengakses Semua Foto dalam Tetapan iOS. Akses terhad boleh menghalang pemuatan asal, pembacaan data kamera atau eksport. Ubah di Tetapan > Privasi & Keselamatan > Photos."],["Asal iCloud","Jika asal hanya berada dalam iCloud Photos, DiveTone memuat turunnya melalui perkhidmatan Apple apabila perlu. Pastikan iCloud, sambungan dan ruang peranti mencukupi. Muat turun selular mengikut tetapan rangkaian app dan sistem."],["Had percuma","Versi percuma merangkumi suntingan dan pratonton penuh. Setiap peranti boleh berjaya mengeksport sehingga 15 foto dan 2 video sehari. Hanya eksport siap dikira; eksport gagal tidak menggunakan had."],["Pembelian dan pemulihan","DiveTone Pro ialah pembelian sekali seumur hidup untuk eksport tanpa had, tanpa langganan. Gunakan Apple ID yang sama dan pilih Pulihkan Pembelian dalam app. Apple StoreKit mengurus pembayaran dan pengesahan."],["Dasar privasi","Pemprosesan imej utama berlaku pada peranti anda. DiveTone tiada akaun, iklan atau pelayan imej pembangun. Baca dasar lengkap melalui pautan di bawah."]],
fil:[["Paggamit ng DiveTone","Mula sa Home, piliin ang Add Media at pumili ng larawan o video. Pagkatapos mag-load ng larawan, pumili ng built-in na style at ayusin ang Subject, Color, Light, at Detail. Tingnan ang paghahambing, saka i-save o i-share mula sa Export."],["Madalas itanong","Hintaying matapos ang pagproseso bago suriin ang preview. Maaaring mas tumagal ang malalaking RAW file at iCloud media. Ang pag-delete ng project ay edits, mask, at thumbnail lamang ang aalisin; hindi ang original sa Photos."],["Pahintulot sa Photos","Para sa maaasahang paggamit, payagan ang DiveTone na ma-access ang Lahat ng Larawan sa iOS Settings. Maaaring pigilan ng limited access ang pag-load ng original, pagbasa ng camera info, o export. Baguhin ito sa Settings > Privacy & Security > Photos."],["iCloud originals","Kung nasa iCloud Photos lamang ang original, ida-download ito ng DiveTone sa pamamagitan ng Apple services kapag kailangan. Tiyaking naka-sign in sa iCloud, may koneksyon at sapat na storage. Ang cellular download ay sumusunod sa app at system network settings."],["Libreng allowance","May buong editing at preview ang libreng bersyon. Bawat device ay maaaring matagumpay na mag-export ng hanggang 15 larawan at 2 video bawat lokal na araw. Tanging natapos na export ang binibilang; hindi nababawas ang failed export."],["Pagbili at restore","Ang DiveTone Pro ay isang beses na lifetime purchase para sa walang limitasyong export, walang subscription. Gamitin ang parehong Apple ID at piliin ang Restore Purchases sa app. Apple StoreKit ang humahawak ng bayad at beripikasyon."],["Patakaran sa privacy","Sa device mo nagaganap ang pangunahing image processing. Walang account, ads, o developer-operated image server ang DiveTone. Basahin ang buong patakaran sa link sa ibaba."]],
vi:[["Cách dùng DiveTone","Từ Màn hình chính, chọn Thêm nội dung rồi chọn ảnh hoặc video. Sau khi ảnh tải xong, chọn phong cách có sẵn và điều chỉnh Chủ thể, Màu sắc, Ánh sáng và Chi tiết. Kiểm tra so sánh, rồi lưu hoặc chia sẻ từ Xuất."],["Câu hỏi thường gặp","Hãy chờ xử lý hoàn tất trước khi đánh giá bản xem trước. Tệp RAW lớn và nội dung iCloud có thể mất nhiều thời gian hơn. Xóa dự án chỉ xóa chỉnh sửa, mặt nạ và hình thu nhỏ; không xóa tệp gốc trong Ảnh."],["Quyền Ảnh","Để sử dụng ổn định, hãy cho phép DiveTone truy cập Tất cả ảnh trong Cài đặt iOS. Quyền hạn chế có thể ngăn tải tệp gốc, đọc thông tin máy ảnh hoặc xuất. Thay đổi tại Cài đặt > Quyền riêng tư & Bảo mật > Ảnh."],["Tệp gốc iCloud","Nếu tệp gốc chỉ có trong iCloud Photos, DiveTone sẽ tải qua dịch vụ Apple khi cần. Hãy kiểm tra iCloud, kết nối và dung lượng thiết bị. Tải qua di động tuân theo cài đặt mạng của app và hệ thống."],["Hạn mức miễn phí","Phiên bản miễn phí có đầy đủ chỉnh sửa và xem trước. Mỗi thiết bị có thể xuất thành công tối đa 15 ảnh và 2 video mỗi ngày địa phương. Chỉ lần xuất hoàn tất mới được tính; xuất lỗi không trừ hạn mức."],["Mua và khôi phục","DiveTone Pro là mua một lần trọn đời để xuất không giới hạn, không đăng ký. Dùng cùng Apple ID đã mua rồi chọn Khôi phục giao dịch mua trong app. Apple StoreKit xử lý thanh toán và xác minh."],["Chính sách quyền riêng tư","Xử lý ảnh chính diễn ra trên thiết bị. DiveTone không có tài khoản, quảng cáo hay máy chủ ảnh do nhà phát triển vận hành. Đọc chính sách đầy đủ qua liên kết bên dưới."]],
ar:[["استخدام DiveTone","من الشاشة الرئيسية، اختر إضافة وسائط وحدد صورة أو فيديو. بعد تحميل الصورة، اختر نمطاً مدمجاً واضبط الهدف واللون والضوء والتفاصيل. راجع المقارنة ثم احفظ أو شارك من التصدير."],["الأسئلة الشائعة","انتظر حتى تنتهي المعالجة قبل تقييم المعاينة. قد تستغرق ملفات RAW الكبيرة ووسائط iCloud وقتاً أطول. حذف المشروع يزيل التعديلات والقناع والصورة المصغرة فقط، ولا يحذف الأصل من الصور."],["إذن الصور","للاستخدام الموثوق، اسمح لـ DiveTone بالوصول إلى كل الصور في إعدادات iOS. قد يمنع الوصول المحدود تحميل الأصل أو قراءة معلومات الكاميرا أو التصدير. غيّر ذلك من الإعدادات > الخصوصية والأمان > الصور."],["أصول iCloud","إذا كان الأصل موجوداً في iCloud Photos فقط، ينزله DiveTone عبر خدمات Apple عند الحاجة. تأكد من تسجيل الدخول إلى iCloud والاتصال والمساحة الكافية. التنزيل عبر البيانات الخلوية يتبع إعدادات الشبكة في التطبيق والنظام."],["الحد المجاني","تتضمن النسخة المجانية التحرير والمعاينة بالكامل. يمكن لكل جهاز تصدير 15 صورة وفيديوهين بنجاح يومياً. لا يُحتسب إلا التصدير المكتمل، ولا يستهلك الفشل الحد."],["الشراء والاستعادة","DiveTone Pro شراء دائم لمرة واحدة للتصدير غير المحدود، من دون اشتراك. استخدم Apple ID نفسه واختر استعادة المشتريات في التطبيق. تتولى Apple StoreKit الدفع والتحقق من الأهلية."],["سياسة الخصوصية","تتم معالجة الصور الأساسية على جهازك. لا يحتوي DiveTone على حسابات أو إعلانات أو خادم صور يديره المطور. اقرأ السياسة الكاملة من الرابط أدناه."]],
tr:[["DiveTone kullanımı","Ana ekrandan Medya Ekle’yi seçip fotoğraf veya video seçin. Fotoğraf yüklendikten sonra yerleşik bir stil seçin ve Konu, Renk, Işık ve Ayrıntı araçlarıyla ayarlayın. Karşılaştırmayı kontrol edip Dışa Aktar’dan kaydedin veya paylaşın."],["Sık sorulan sorular","Önizlemeyi değerlendirmeden önce işlemenin bitmesini bekleyin. Büyük RAW dosyaları ve iCloud medyası daha uzun sürebilir. Projeyi silmek yalnızca düzenlemeleri, maskeyi ve küçük resmi siler; Fotoğraflar’daki orijinali asla silmez."],["Fotoğraflar izni","Güvenilir kullanım için iOS Ayarları’nda DiveTone’un Tüm Fotoğraflara erişmesine izin verin. Sınırlı erişim orijinalin yüklenmesini, kamera bilgisinin okunmasını veya dışa aktarmayı engelleyebilir. Ayarlar > Gizlilik ve Güvenlik > Fotoğraflar’dan değiştirin."],["iCloud orijinalleri","Orijinal yalnızca iCloud Photos’ta bulunuyorsa, DiveTone gerektiğinde Apple hizmetleri üzerinden indirir. iCloud oturumunu, bağlantıyı ve boş alanı kontrol edin. Hücresel indirmeler uygulama ve sistem ağ ayarlarına uyar."],["Ücretsiz kota","Ücretsiz sürüm tam düzenleme ve önizleme içerir. Her cihaz yerel günde en fazla 15 fotoğraf ve 2 videoyu başarıyla dışa aktarabilir. Yalnızca tamamlanan dışa aktarma sayılır; başarısız olan kotayı kullanmaz."],["Satın alma ve geri yükleme","DiveTone Pro, sınırsız dışa aktarma için aboneliksiz tek seferlik ömür boyu satın almadır. Aynı Apple ID’yi kullanın ve uygulamada Satın Alımları Geri Yükle’yi seçin. Ödemeyi ve doğrulamayı Apple StoreKit yönetir."],["Gizlilik politikası","Temel görüntü işleme cihazınızda yapılır. DiveTone’da hesap, reklam veya geliştiricinin işlettiği görüntü sunucusu yoktur. Tam politikayı aşağıdaki bağlantıdan okuyun."]],
el:[["Χρήση του DiveTone","Από την Αρχική οθόνη επιλέξτε Προσθήκη πολυμέσων και μια φωτογραφία ή βίντεο. Αφού φορτώσει η φωτογραφία, επιλέξτε ενσωματωμένο στυλ και ρυθμίστε Θέμα, Χρώμα, Φως και Λεπτομέρεια. Ελέγξτε τη σύγκριση και αποθηκεύστε ή μοιραστείτε από την Εξαγωγή."],["Συχνές ερωτήσεις","Περιμένετε να ολοκληρωθεί η επεξεργασία πριν αξιολογήσετε την προεπισκόπηση. Μεγάλα αρχεία RAW και πολυμέσα iCloud μπορεί να χρειαστούν περισσότερο χρόνο. Η διαγραφή έργου αφαιρεί μόνο ρυθμίσεις, μάσκα και μικρογραφία, ποτέ το πρωτότυπο στις Φωτογραφίες."],["Άδεια Φωτογραφιών","Για αξιόπιστη χρήση, επιτρέψτε στο DiveTone πρόσβαση σε Όλες τις φωτογραφίες στις Ρυθμίσεις iOS. Η περιορισμένη πρόσβαση μπορεί να εμποδίσει τη φόρτωση πρωτοτύπου, την ανάγνωση στοιχείων κάμερας ή την εξαγωγή. Αλλάξτε το στις Ρυθμίσεις > Απόρρητο και ασφάλεια > Φωτογραφίες."],["Πρωτότυπα iCloud","Αν το πρωτότυπο βρίσκεται μόνο στο iCloud Photos, το DiveTone το κατεβάζει μέσω υπηρεσιών Apple όταν χρειάζεται. Ελέγξτε iCloud, σύνδεση και ελεύθερο χώρο. Οι λήψεις μέσω κινητού ακολουθούν τις ρυθμίσεις δικτύου της εφαρμογής και του συστήματος."],["Δωρεάν όριο","Η δωρεάν έκδοση περιλαμβάνει πλήρη επεξεργασία και προεπισκόπηση. Κάθε συσκευή μπορεί να εξαγάγει επιτυχώς έως 15 φωτογραφίες και 2 βίντεο ανά τοπική ημέρα. Μετρά μόνο η ολοκληρωμένη εξαγωγή· η αποτυχημένη δεν καταναλώνει όριο."],["Αγορά και επαναφορά","Το DiveTone Pro είναι εφάπαξ ισόβια αγορά για απεριόριστες εξαγωγές, χωρίς συνδρομή. Χρησιμοποιήστε το ίδιο Apple ID και επιλέξτε Επαναφορά αγορών στην εφαρμογή. Το Apple StoreKit διαχειρίζεται πληρωμή και επαλήθευση."],["Πολιτική απορρήτου","Η βασική επεξεργασία εικόνας γίνεται στη συσκευή σας. Το DiveTone δεν έχει λογαριασμούς, διαφημίσεις ή διακομιστή εικόνων του δημιουργού. Διαβάστε την πλήρη πολιτική από τον παρακάτω σύνδεσμο."]]
};
const PRIVACY_URL = "https://lingogo2025.github.io/DiveTone/DiveTonePolicy/privacy.html";
function normalise(raw){const value=(raw||"").replace(/_/g,"-");const low=value.toLowerCase();if(low.startsWith("zh"))return /hans|cn|sg/.test(low)?"zh-Hans":"zh-Hant";if(low.startsWith("pt"))return /br/.test(low)?"pt-BR":"pt-PT";const short=low.split("-")[0];return copy[short]?short:"en"}
function bestLanguage(){const param=new URLSearchParams(location.search).get("lang");if(param)return normalise(param);const stored=localStorage.getItem("divetone-support-language");if(stored&&copy[stored])return stored;for(const item of navigator.languages||[navigator.language]){const result=normalise(item);if(result!=="en"||String(item).toLowerCase().startsWith("en"))return result}return "en"}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]))}
function render(lang){const t=copy[lang]||copy.en;const topics=supportTopics[lang]||supportTopics.en;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.title=t.title;document.getElementById("title").textContent=t.title;document.getElementById("subtitle").textContent=t.sub;document.getElementById("languageLabel").textContent=t.label;const topicHTML=topics.map(([heading,text])=>`<h2>${escapeHTML(heading)}</h2><p>${escapeHTML(text)}</p>`).join("");const privacyLink=`<p><a href="${PRIVACY_URL}?lang=${encodeURIComponent(lang)}">${escapeHTML(topics[6][0])}</a></p>`;document.getElementById("content").innerHTML=`<h2>${escapeHTML(t.about)}</h2><p>${escapeHTML(t.intro)}</p><h2>${escapeHTML(t.features)}</h2><ul>${t.featureList.map(item=>`<li>${escapeHTML(item)}</li>`).join("")}</ul>${topicHTML}<div class="contact"><div class="contact-icon" aria-hidden="true">✉</div><p>${escapeHTML(t.support)}<br><a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a></p></div>${privacyLink}`;const select=document.getElementById("language");select.value=lang}
const select=document.getElementById("language");Object.entries(languages).forEach(([code,name])=>{const option=document.createElement("option");option.value=code;option.textContent=name;select.append(option)});select.addEventListener("change",event=>{const lang=event.target.value;localStorage.setItem("divetone-support-language",lang);const url=new URL(location.href);url.searchParams.set("lang",lang);history.replaceState(null,"",url);render(lang)});render(bestLanguage());
</script>
