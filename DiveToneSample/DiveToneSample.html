<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#075f91">
  <meta name="description" content="Download sample underwater media for DiveTone.">
  <title>DiveTone Sample Media</title>
  <style>
    :root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#eef6fa;--card:#fff;--text:#102a38;--muted:#5d7480;--line:#d3e2e9;--accent:#087fbd;--accent2:#075f91;--soft:#e5f4fb;--shadow:#06304918}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% -10%,#c9edf9 0,transparent 34rem),var(--bg);color:var(--text);line-height:1.6}
    main{width:min(980px,calc(100% - 32px));margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 0 max(48px,env(safe-area-inset-bottom))}
    header{position:relative;overflow:hidden;padding:clamp(26px,6vw,52px);border-radius:28px;background:linear-gradient(145deg,#063f5d,#087fbd 58%,#14a4cf);color:#fff;box-shadow:0 18px 48px #02334b38;text-align:center}
    header:after{content:"";position:absolute;right:-70px;bottom:-100px;width:280px;height:280px;border:44px solid #fff1;border-radius:50%}
    .logo{position:relative;z-index:1;width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 8px 14px #001f3266)}
    h1{position:relative;z-index:1;margin:12px 0 8px;font-size:clamp(2rem,7vw,3.2rem);line-height:1.1;letter-spacing:-.02em}
    .subtitle{position:relative;z-index:1;margin:0 auto;max-width:620px;font-size:clamp(1rem,2.5vw,1.18rem);opacity:.9}
    .toolbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:18px 2px}
    label{font-size:.92rem;color:var(--muted)}
    select{max-width:220px;padding:10px 36px 10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit}
    .intro,.steps,.notice{padding:clamp(20px,4vw,32px);border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 10px 28px var(--shadow)}
    .intro h2,.steps h2,.notice h2{margin:0 0 8px;font-size:1.25rem}
    .intro p,.notice p{margin:0;color:var(--muted)}
    .steps{margin-top:18px}
    ol{margin:12px 0 0;padding-inline-start:1.45rem}
    li+li{margin-top:8px}
    .media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}
    .media-card{display:flex;min-width:0;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 12px 34px var(--shadow)}
    .preview{position:relative;aspect-ratio:4/3;background:#06171f;overflow:hidden}
    .preview img,.preview video{display:block;width:100%;height:100%;object-fit:cover}
    .type{position:absolute;top:12px;left:12px;padding:5px 10px;border-radius:999px;background:#001d2bbd;color:#fff;font-size:.78rem;font-weight:700;backdrop-filter:blur(8px)}
    .card-body{display:flex;flex:1;flex-direction:column;padding:20px}
    .card-body h2{margin:0;font-size:1.3rem}
    .card-body p{margin:7px 0 18px;color:var(--muted);font-size:.95rem}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:auto;padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-decoration:none;font-weight:700;box-shadow:0 8px 20px #087fbd3b}
    .button:focus-visible,select:focus-visible{outline:3px solid #f4b942;outline-offset:3px}
    .notice{margin-top:18px;background:var(--soft)}
    footer{text-align:center;margin-top:24px;color:var(--muted);font-size:.86rem}
    [dir=rtl] .type{left:auto;right:12px}
    [dir=rtl] .toolbar{justify-content:flex-start}
    @media(max-width:680px){main{width:min(100% - 22px,980px)}header{border-radius:22px}.media-grid{grid-template-columns:1fr}.toolbar{justify-content:space-between}.toolbar label{text-align:start}.media-card{border-radius:20px}}
    @media(prefers-color-scheme:dark){:root{--bg:#06141b;--card:#0f252f;--text:#edf8fc;--muted:#abc0ca;--line:#294651;--accent:#26a9e2;--accent2:#087fbd;--soft:#0c2b38;--shadow:#0007}body{background:radial-gradient(circle at 50% -10%,#0a4157 0,transparent 34rem),var(--bg)}}
    @media(prefers-reduced-motion:no-preference){.media-card,.intro,.steps,.notice{animation:rise .45s ease-out both}.media-card:nth-child(2){animation-delay:.08s}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
<main>
  <header>
    <img class="logo" src="https://lingogo2025.github.io/DiveTone/DiveTone_Logo_Dark_1024.png" alt="DiveTone" width="88" height="88" decoding="async" fetchpriority="high" onerror="this.hidden=true">
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div class="toolbar">
    <label id="languageLabel" for="language"></label>
    <select id="language" aria-label="Language"></select>
  </div>

  <section class="intro">
    <h2 id="introTitle"></h2>
    <p id="introText"></p>
  </section>

  <section class="steps">
    <h2 id="stepsTitle"></h2>
    <ol id="stepsList"></ol>
  </section>

  <div class="media-grid">
    <article class="media-card">
      <div class="preview">
        <img src="https://lingogo2025.github.io/DiveTone/DiveToneSample/DiveToneSample.jpg" alt="DiveTone underwater sample photo" loading="eager" decoding="async">
        <span class="type">JPG</span>
      </div>
      <div class="card-body">
        <h2 id="photoTitle"></h2>
        <p id="photoText"></p>
        <a class="button" id="photoButton" href="https://lingogo2025.github.io/DiveTone/DiveToneSample/DiveToneSample.jpg" target="_blank" rel="noopener"></a>
      </div>
    </article>

    <article class="media-card">
      <div class="preview">
        <video controls playsinline preload="metadata" poster="https://lingogo2025.github.io/DiveTone/DiveToneSample/DiveToneSampleVideoPoster.jpg">
          <source src="https://lingogo2025.github.io/DiveTone/DiveToneSample/DiveToneSample.mov" type="video/quicktime">
        </video>
        <span class="type">MOV</span>
      </div>
      <div class="card-body">
        <h2 id="videoTitle"></h2>
        <p id="videoText"></p>
        <a class="button" id="videoButton" href="https://lingogo2025.github.io/DiveTone/DiveToneSample/DiveToneSample.mov" target="_blank" rel="noopener"></a>
      </div>
    </article>
  </div>

  <section class="notice">
    <h2 id="noticeTitle"></h2>
    <p id="noticeText"></p>
  </section>

  <footer><span id="privacyText"></span><br>© 2026 DiveTone</footer>
</main>

function normalizeLanguage(code){
  if(!code)return null;
  const exact=Object.keys(T).find(key=>key.toLowerCase()===code.toLowerCase());
  if(exact)return exact;
  const lower=code.toLowerCase(),base=lower.split("-")[0];
  if(base==="zh")return /hant|tw|hk|mo/.test(lower)?"zh-Hant":"zh-Hans";
  if(base==="pt")return /br/.test(lower)?"pt-BR":"pt-PT";
  return T[base]?base:null;
}

function bestLanguage(){
  const query=normalizeLanguage(new URLSearchParams(location.search).get("lang"));
  if(query)return query;
  const saved=normalizeLanguage(localStorage.getItem("divetone-sample-language"));
  if(saved)return saved;
  for(const candidate of [...(navigator.languages||[]),navigator.language]){
    const match=normalizeLanguage(candidate);
    if(match)return match;
  }
  return "en";
}

function setText(id,value){document.getElementById(id).textContent=value}

function render(lang,updateURL=false){
  const code=normalizeLanguage(lang)||"en",t=T[code];
  document.documentElement.lang=code;
  document.documentElement.dir=code==="ar"?"rtl":"ltr";
  document.title=t.title;
  setText("title",t.title);setText("subtitle",t.subtitle);setText("languageLabel",t.language);
  setText("introTitle",t.introTitle);setText("introText",t.intro);setText("stepsTitle",t.stepsTitle);
  setText("photoTitle",t.photoTitle);setText("photoText",t.photoText);setText("photoButton",t.photoButton+" ↗");
  setText("videoTitle",t.videoTitle);setText("videoText",t.videoText);setText("videoButton",t.videoButton+" ↗");
  setText("noticeTitle",t.noticeTitle);setText("noticeText",t.notice);setText("privacyText",t.privacy);
  const list=document.getElementById("stepsList");list.replaceChildren(...t.steps.map(step=>{const li=document.createElement("li");li.textContent=step;return li}));
  document.getElementById("language").value=code;
  localStorage.setItem("divetone-sample-language",code);
  if(updateURL){const url=new URL(location.href);url.searchParams.set("lang",code);history.replaceState(null,"",url)}
}

const picker=document.getElementById("language");
for(const [code,name] of Object.entries(languages)){const option=document.createElement("option");option.value=code;option.textContent=name;picker.appendChild(option)}
picker.addEventListener("change",event=>render(event.target.value,true));
render(bestLanguage());
</script>
